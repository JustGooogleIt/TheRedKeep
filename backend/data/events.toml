]

[[event]]
id = "israel-iran"
title = "Israel and Iran trade strikes again"
short = "Israel–Iran strikes"
category = "Geopolitics"
question = "Will Israel or Iran carry out an air or missile strike that hits the other's territory, ending their ceasefire, before January 1, 2027?"
resolves = 2026-12-31
deadline = 2026-12-31
source = "Confirmed by major news organizations"
search = ["Israel Iran ceasefire", "Israel strike Iran", "Iran missile attack Israel"]
why = "Renewed strikes would lift oil, gold and fear while the Strait of Hormuz is still mostly shut."
analogs = [
  { date = 2024-10-01, days = 1, surprise = 0.6, note = "Iran fired about 180 ballistic missiles at Israel" },
  { date = 2025-06-13, days = 1, surprise = 0.7, note = "Israel struck Iran's nuclear and military sites" },
]

[[event]]
id = "hormuz-reopens"
title = "Shipping through Hormuz returns to normal"
short = "Hormuz reopens"
category = "Energy"
question = "Will the 7-day average of ships transiting the Strait of Hormuz reach 60 or more a day in IMF PortWatch data before January 1, 2027?"
resolves = 2026-12-31
deadline = 2026-12-31
threshold = 60
threshold_unit = "transits a day, 7-day average"
direction = "above"
source = "IMF PortWatch"
