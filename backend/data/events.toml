search = ["US recession", "recession 2027", "negative GDP growth"]
why = "The biggest single risk for most portfolios: stocks and credit fall while long bonds rally."
analogs = []

# Proposed knock-on links. `w` is the AI's guess of P(child | parent) - P(child | not parent);
# the engine uses a link only when the slope of the child's odds on the parent's agrees in sign
# and is significant, and then uses that slope (DESIGN.md 4.4 and 6.6).
[[link]]
parent = "cpi-hot"
child = "fed-cut-dec"
w = -0.20
reason = "A hot core print makes a December cut less likely."

[[link]]
parent = "tariffs-china"
child = "recession"
w = 0.08
reason = "Higher tariffs slow trade and investment."

[[link]]
parent = "iran-strike"
child = "hormuz"
w = 0.15
reason = "A strike raises the chance that Iran retaliates against shipping."

[[link]]
parent = "hormuz"
child = "recession"
w = 0.10
reason = "An oil shock squeezes consumers and margins."

[[link]]
parent = "taiwan"
child = "recession"
w = 0.25
reason = "A blockade would cut global chip supply."
