[[event]]
id = "recession"
title = "US recession by spring 2027"
short = "US recession"
category = "Growth"
question = "Will the US enter a recession by April 30, 2027, meaning two consecutive quarters of negative real GDP growth in BEA estimates or an NBER announcement of a peak?"
