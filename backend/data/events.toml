# The vertical slice's event library: ten macro and geopolitical events that
# could move a typical US portfolio over the next six months (DESIGN.md 6.2).
# Checked against the live markets on 2026-11-08: the Fed is expected to hike in
# December, Hormuz traffic is still far below normal after this year's war with
# Iran, and Israel and Iran hold a ceasefire, so the events ask about those.
#
# Each event states its exact terms, because matching checks the entity, the
# threshold, the deadline and the resolution source (DESIGN.md 6.3). Nothing
# here is a number the engine uses as-is:
#   * odds come from matched markets, or the AI prior when nothing fits;
#   * jumps come from jump windows, past events and the AI prior;
#   * links are proposals; the engine keeps one only if the odds data agrees.
#
# Analogs are past days when a similar event happened. `surprise` is how much
# of the event the market had not expected that day (1 = complete surprise);
# the event study divides the day's factor moves by it.

[[event]]
id = "cpi-hot"
title = "October core CPI runs hot"
short = "Hot CPI"
category = "Inflation"
question = "Will US core CPI (seasonally adjusted, excluding food and energy) for October 2026 rise 0.4% or more from September, as first published by the BLS?"
resolves = 2026-11-10
deadline = 2026-11-10
threshold = 0.4
threshold_unit = "% month over month"
direction = "above"
source = "BLS CPI release"
search = ["core CPI October", "CPI inflation month over month", "core inflation"]
why = "A hot core print pushes yields and the dollar up and makes a December hike more likely."
analogs = [
  { date = 2022-09-13, days = 1, surprise = 0.8, note = "August 2022 core CPI came in at 0.6% against 0.3% expected" },
  { date = 2024-04-10, days = 1, surprise = 0.7, note = "March 2024 core CPI beat expectations for a third month" },
]

[[event]]
id = "fed-hike-dec"
title = "Fed raises rates in December"
short = "Dec Fed hike"
category = "Fed"
question = "Will the FOMC raise the federal funds target range at its meeting ending December 9, 2026?"
resolves = 2026-12-09
deadline = 2026-12-09
source = "FOMC statement"
search = ["Fed decision December", "Fed rate hike December 2026", "FOMC December"]
why = "A hike lifts yields and the dollar. Markets already expect one, so a hold would be the bigger surprise."
analogs = []

[[event]]
id = "boj-hike-dec"
title = "Bank of Japan raises rates in December"
short = "BoJ hike"
category = "Global rates"
question = "Will the Bank of Japan raise its short-term policy rate at its December 2026 monetary policy meeting?"
resolves = 2026-12-18
deadline = 2026-12-18
source = "Bank of Japan statement"
search = ["Bank of Japan December", "BoJ rate hike", "Japan interest rate decision"]
why = "A hike strengthens the yen and can force carry trades to unwind, as in August 2024."
# July 31, 2024 is the obvious analog, but the Fed met the same day and the US jobs
# report followed two days later, so its moves can't be pinned on the BoJ.
analogs = []

[[event]]
id = "ceasefire"
title = "Russia and Ukraine agree a ceasefire"
short = "Ukraine ceasefire"
category = "Geopolitics"
question = "Will Russia and Ukraine both publicly agree to a general ceasefire or armistice before April 1, 2027?"
resolves = 2027-03-31
deadline = 2027-03-31
source = "Official statements by both governments"
search = ["Russia Ukraine ceasefire", "Ukraine peace deal", "Russia Ukraine armistice"]
why = "A ceasefire lowers oil and gold and lifts European stocks; defense stocks would fall."
analogs = []

[[event]]
id = "tariffs-china"
title = "US raises tariffs on Chinese goods"
short = "China tariffs"
category = "Trade"
question = "Will the US announce an increase of 10 percentage points or more in tariffs on a broad set of Chinese imports before May 1, 2027?"
resolves = 2027-04-30
deadline = 2027-04-30
threshold = 10
threshold_unit = "percentage points"
direction = "above"
source = "White House or USTR announcement"
search = ["tariffs China", "US China trade war tariff increase", "China tariff rate"]
why = "New tariffs hit China-exposed and chip stocks first, lift inflation expectations and widen credit spreads."
analogs = [
  { date = 2018-03-22, days = 1, surprise = 0.7, note = "Tariffs on $60B of Chinese goods announced" },
  { date = 2019-05-06, days = 1, surprise = 0.8, note = "Weekend announcement raising tariffs on $200B of goods from 10% to 25%" },
  { date = 2019-08-01, days = 1, surprise = 0.8, note = "10% tariffs announced on the remaining $300B of imports" },
]

