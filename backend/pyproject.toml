[project]
name = "redkeep"
version = "0.1.0"
description = "The Red Keep: scenario analysis engine (backend vertical slice)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic>=2.7",
    "scipy>=1.13",
    "uvicorn>=0.30",
]

[project.scripts]
redkeep = "redkeep.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redkeep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
