>recession odds 25 points higher</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">with tariffs than without</tspan></text></g></g><g transform="translate(335.625, 124)" class="edgeLabel"><g transform="translate(-39.9765625, -10)" class="label"><rect height="20" width="79.953125" ry="0" rx="0"></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">adds up to</tspan></text></g></g></g><g class="nodes"><g transform="translate(94.140625, 74)" data-id="T" data-node="true" id="flowchart-T-0" class="node default ev flowchart-label"><rect height="64" width="188.28125" y="-32" x="-94.140625" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -26)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">Tariffs on China 25%+</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">market odds 40%</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">direct hit on QQQ: −6%</tspan></text></g></g><g transform="translate(668.9453125, 24)" data-id="R" data-node="true" id="flowchart-R-1" class="node default ev flowchart-label"><rect height="48" width="147.328125" y="-24" x="-73.6640625" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -18)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">US recession</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">hit on QQQ: −10%</tspan></text></g></g><g transform="translate(668.9453125, 124)" data-id="X" data-node="true" id="flowchart-X-2" class="node default res flowchart-label"><rect height="80" width="371.953125" y="-40" x="-185.9765625" ry="0" rx="0" style="" class="basic label-container"></rect><g transform="translate(0, -34)" style="" class="label"><rect></rect><text style=""><tspan class="row" x="0" dy="1em" xml:space="preserve">Total jump: −6% + 0.25 × −10% = −8.5%</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">If tariffs happen: 60% × −8.5% = −5.1%</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">If they don't: 40% × 8.5% = +3.4%</tspan><tspan class="row" x="0" dy="1em" xml:space="preserve">At 40% odds the two outcomes balance to zero</tspan></text></g></g></g></g></g></svg>