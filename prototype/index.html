<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Red Keep</title>
<meta name="description" content="Scenario Analysis Engine. Ashwin's take-home for Castle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Hedvig+Letters+Serif:opsz@12..24&display=swap">
<style>
:root {
  /* UI layer read from castle.tech: grey canvas, flat white cards, hairlines, Hedvig serif
     headings, Geist Mono buttons and labels, a floating glass nav, dark banner and footer.
     The Red Keep's twist: a dragon-red accent and warm maroon darks. */
  --bg: #F5F5F5; --surface: #FFFFFF; --surface-2: #FAFAFA; --sunk: #F0F0F0;
  --line: #E5E5E5; --line-2: #D4D4D4; --ghost: #A2A2A2;
  --ink: #171717; --ink-2: #525252; --ink-3: #737373;
  --acc-dragon: #B4141F; --acc-ember: #C2410C; --acc-teal: #00544F; --acc-steel: #3A5C9A;
  --hi-dragon: #F2555A; --hi-ember: #F08A4B; --hi-teal: #58BDB2; --hi-steel: #8FAEEA;
  --gain: #395938; --loss: #7C4632;
  --tA: #00544F; --tB: #3A5C9A; --tC: #5E9586; --tD: #A3A3A3;
  --band: #171717; --band-ink: #F5F5F5; --band-ink-2: #D5D5D5; --band-ink-3: #A3A3A3; --band-line: rgba(255, 255, 255, .1);
  --glass: rgba(255, 255, 255, .62);
  --card-line: transparent;
  --scrim: rgba(24, 8, 10, .32);
  --shadow-panel: 0 14px 36px rgba(60, 8, 12, .16), 0 2px 6px rgba(60, 8, 12, .08);
  --shadow-btn: 0 1px 3px rgba(23, 23, 23, .12);
  --f-display: "Hedvig Letters Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r1: 4px; --r2: 8px; --r3: 10px;
  --gap: 16px; --pad: 20px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120C0D; --surface: #1B1415; --surface-2: #211819; --sunk: #2A2021;
    --line: #302627; --line-2: #463A3C; --ghost: #5E5052;
    --ink: #F3EDED; --ink-2: #C7BBBB; --ink-3: #94888A;
    --acc-dragon: #F2555A; --acc-ember: #F08A4B; --acc-teal: #58BDB2; --acc-steel: #8FAEEA;
    --gain: #8DBE8A; --loss: #E0916F;
    --tA: #58BDB2; --tB: #8FAEEA; --tC: #84B6A7; --tD: #6E6264;
    --band: #0B0607; --band-line: rgba(255, 255, 255, .08);
    --glass: rgba(27, 20, 21, .66);
    --card-line: rgba(255, 255, 255, .06);
    --scrim: rgba(0, 0, 0, .55);
    --shadow-panel: 0 14px 36px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
    --shadow-btn: 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #120C0D; --surface: #1B1415; --surface-2: #211819; --sunk: #2A2021;
  --line: #302627; --line-2: #463A3C; --ghost: #5E5052;
  --ink: #F3EDED; --ink-2: #C7BBBB; --ink-3: #94888A;
  --acc-dragon: #F2555A; --acc-ember: #F08A4B; --acc-teal: #58BDB2; --acc-steel: #8FAEEA;
  --gain: #8DBE8A; --loss: #E0916F;
  --tA: #58BDB2; --tB: #8FAEEA; --tC: #84B6A7; --tD: #6E6264;
  --band: #0B0607; --band-line: rgba(255, 255, 255, .08);
  --glass: rgba(27, 20, 21, .66);
  --card-line: rgba(255, 255, 255, .06);
  --scrim: rgba(0, 0, 0, .55);
  --shadow-panel: 0 14px 36px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
  --shadow-btn: 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

/* Tweakable look: accent, heading face and density live on the app root. */
.app { --accent: var(--acc-dragon); --accent-hi: var(--hi-dragon); }
.app[data-accent="ember"] { --accent: var(--acc-ember); --accent-hi: var(--hi-ember); }
.app[data-accent="teal"] { --accent: var(--acc-teal); --accent-hi: var(--hi-teal); }
.app[data-accent="steel"] { --accent: var(--acc-steel); --accent-hi: var(--hi-steel); }
.app { --accent-soft: color-mix(in srgb, var(--accent) 8%, transparent); --accent-line: color-mix(in srgb, var(--accent) 38%, transparent); }
.app[data-heading="sans"] { --f-display: var(--f-body); }
.app[data-density="compact"] { --gap: 12px; --pad: 15px; }

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--f-body); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--band); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.boot { font: 500 13px/1.5 var(--f-mono); color: var(--ink-3); padding: 48px 16px; text-align: center; }

/* ---------- type ---------- */
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font: 500 10px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.kicker { display: block; font: 600 12.5px/1.3 var(--f-mono); letter-spacing: -.01em; color: var(--ink-3); }
.display { font-family: var(--f-display); font-weight: 400; letter-spacing: -.015em; text-wrap: balance; }
.h2 { font-family: var(--f-display); font-weight: 400; font-size: 25px; line-height: 1.18; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.h3 { font-family: var(--f-display); font-weight: 400; font-size: 20px; line-height: 1.25; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--ink-3); font-size: 13px; line-height: 1.5; margin: 4px 0 0; max-width: 68ch; }
.neg { color: var(--loss); }
.pos { color: var(--gain); }
.faint { color: var(--ink-3); opacity: .7; }
.pill { display: inline-flex; align-items: center; font: 500 10px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: var(--r1); background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.pill-acc { background: var(--accent-soft); color: var(--accent); }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.inl { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.inl:hover { text-decoration-color: var(--accent); }

/* ---------- buttons and controls (Castle: Geist Mono 600, 4px radius) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 13px/1.2 var(--f-mono); letter-spacing: -.02em; background: var(--ink); color: var(--surface); border: 1px solid var(--ink); border-radius: var(--r1); padding: 10px 18px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, box-shadow .15s; }
.btn:hover { background: color-mix(in srgb, var(--ink) 84%, var(--surface)); border-color: color-mix(in srgb, var(--ink) 84%, var(--surface)); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-light { background: #FFFFFF; color: #171717; border-color: #FFFFFF; box-shadow: var(--shadow-btn); }
.btn-light:hover { background: #ECECEC; border-color: #ECECEC; }
.btn-outline-light { background: transparent; color: #FFFFFF; border-color: rgba(255, 255, 255, .55); }
.btn-outline-light:hover { background: rgba(255, 255, 255, .1); border-color: #FFFFFF; }
.btn-sm { padding: 7px 14px; }
.btn-lg { padding: 13px 24px; font-size: 14px; }
.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 13px/1.2 var(--f-mono); letter-spacing: -.02em; background: transparent; color: var(--ink); border: 1px solid var(--ghost); border-radius: var(--r1); padding: 8px 14px; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s, color .15s; }
.btn-ghost:hover { border-color: var(--ink); }
.btn-ghost.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.dot-live { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .5; display: inline-block; flex: none; }
.on > .dot-live { background: var(--accent); opacity: 1; animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-line); } 100% { box-shadow: 0 0 0 7px transparent; } }

.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r1); overflow: hidden; flex-wrap: nowrap; max-width: 100%; background: var(--surface); }
.seg button { font: 500 12px/1 var(--f-mono); letter-spacing: -.01em; padding: 8px 11px; background: none; border: 0; color: var(--ink-3); cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--ink); color: var(--surface); }

.in { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r1); padding: 9px 11px; font-size: 13px; min-width: 0; width: 100%; }
.in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.in::placeholder { color: var(--ink-3); }

/* ---------- banner, floating glass nav ---------- */
.banner { background: var(--band); color: var(--band-ink-2); font: 500 12px/1.4 var(--f-mono); letter-spacing: -.01em; text-align: center; padding: 11px max(16px, env(safe-area-inset-right, 0px)) 11px max(16px, env(safe-area-inset-left, 0px)); }
.banner-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-hi); margin-right: 10px; vertical-align: 1px; }
.banner-x { color: var(--band-ink-3); }

.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--nav-h); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.nav-in { pointer-events: auto; max-width: 1408px; margin: 0 auto; display: flex; align-items: center; gap: 8px 18px; padding: 7px 7px 7px 14px; border-radius: 6px; color: #FFFFFF; background: rgba(22, 9, 11, .34); border: 1px solid rgba(255, 255, 255, .1); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .25s, color .25s, border-color .25s, box-shadow .25s; }
.nav.scrolled .nav-in { color: var(--ink); background: var(--glass); border-color: var(--line); box-shadow: 0 8px 24px rgba(60, 8, 12, .07); }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; flex: none; }
.keep { fill: var(--accent); display: block; }
.nav:not(.scrolled) .keep, .foot .keep { fill: var(--accent-hi); }
.brand-name { font-family: var(--f-display); font-size: 19px; letter-spacing: -.01em; white-space: nowrap; }
.tabs { display: flex; gap: 2px; }
.tab { font: 500 14px/1 var(--f-mono); letter-spacing: -.02em; color: inherit; opacity: .74; background: none; border: 0; padding: 9px 12px; border-radius: var(--r1); cursor: pointer; white-space: nowrap; }
.tab:hover { opacity: 1; }
.tab.on { opacity: 1; background: rgba(255, 255, 255, .16); }
.nav.scrolled .tab.on { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.t-short { display: none; }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.nav-live { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--f-mono); letter-spacing: -.02em; color: inherit; background: none; border: 0; padding: 9px 12px; border-radius: var(--r1); cursor: pointer; opacity: .85; white-space: nowrap; }
.nav-live:hover, .nav-live.on { opacity: 1; }
.nav:not(.scrolled) .nav-live.on > .dot-live { background: var(--accent-hi); }

/* ---------- hero: full-bleed image, centred copy at the foot ---------- */
.hero { position: relative; margin-top: calc(-1 * var(--nav-h)); height: clamp(540px, 86vh, 820px); background: #1A0B0D; color: #FFFFFF; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 8, 10, .62) 0%, rgba(20, 8, 10, .14) 17%, rgba(20, 8, 10, 0) 32%, rgba(20, 8, 10, .16) 50%, rgba(20, 8, 10, .78) 78%, rgba(20, 8, 10, .92) 100%); }
.hero-copy { position: relative; z-index: 1; text-align: center; max-width: 860px; padding: 0 max(20px, env(safe-area-inset-right, 0px)) clamp(40px, 7vh, 76px) max(20px, env(safe-area-inset-left, 0px)); }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 500 13px/1.4 var(--f-mono); letter-spacing: -.01em; color: rgba(255, 255, 255, .8); }
.hero-eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--accent-hi); }
.hero-eyebrow::after { content: ""; width: 18px; height: 1px; background: var(--accent-hi); }
.hero-h { font-family: var(--f-display); font-weight: 400; font-size: clamp(42px, 5.6vw, 74px); line-height: 1.05; letter-spacing: -.02em; margin: 14px 0 0; text-wrap: balance; color: #FFFFFF; text-shadow: 0 2px 30px rgba(20, 8, 10, .35); }
.hero-sub { font: 500 18px/1.5 var(--f-body); color: rgba(255, 255, 255, .86); margin: 16px auto 0; max-width: 54ch; text-wrap: pretty; }
.hero-cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }

/* ---------- page ---------- */
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { scroll-margin-top: calc(var(--nav-h) + 4px); }
.intro { text-align: center; padding-block: 84px 34px; max-width: 900px; margin: 0 auto; }
.no-hero .intro { padding-top: 32px; }
.heading-xl { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 3.4vw, 40px); line-height: 1.2; letter-spacing: -.01em; color: var(--ink-2); margin: 0; text-wrap: balance; }
.heading-xl .accent { color: var(--accent); }
.intro-sub { font-size: 16px; line-height: 1.6; color: var(--ink-2); margin: 14px auto 0; max-width: 62ch; text-wrap: pretty; }

.layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; padding-bottom: 64px; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--nav-h) + 12px); max-height: calc(100vh - var(--nav-h) - 24px); overflow: auto; display: flex; flex-direction: column; gap: var(--gap); scrollbar-width: thin; padding-bottom: 4px; }
.main { min-width: 0; display: flex; flex-direction: column; gap: var(--gap); container-type: inline-size; }
@media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { position: static; max-height: none; overflow: visible; } }

.card { background: var(--surface); border: 1px solid var(--card-line); border-radius: var(--r1); padding: var(--pad); min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px 14px; margin-bottom: 16px; flex-wrap: wrap; }
.card-head > div:first-child { min-width: 0; flex: 1 1 240px; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); align-items: start; }
@container (min-width: 980px) {
  .duo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  /* The map follows you down the long event list, so hovering a row lights its dot. */
  .duo > .map-card { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--nav-h) + 12px); }
}

/* ---------- sidebar ---------- */
.side-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.side-total { text-align: right; }
.num-lg { display: block; font-family: var(--f-display); font-size: 27px; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
.samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.sample { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r1); padding: 7px 10px; cursor: pointer; text-align: left; line-height: 1.2; transition: border-color .15s, background .15s; }
.sample:hover { border-color: var(--ink-3); }
.sample.on { border-color: var(--accent); background: var(--accent-soft); }
.sample b { display: block; font-weight: 500; font-size: 13px; }
.sample span { display: block; font: 500 10.5px/1.3 var(--f-mono); letter-spacing: -.01em; color: var(--ink-3); margin-top: 3px; }
.sample-note { font-size: 12.5px; color: var(--ink-3); margin: 10px 0 0; line-height: 1.5; }

.holds { margin-top: 14px; border-top: 1px solid var(--line); }
.hold { display: grid; grid-template-columns: minmax(0, 1fr) 118px 62px 22px; gap: 8px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.hold-tk { min-width: 0; }
.tk { font-family: var(--f-mono); font-weight: 600; font-size: 12.5px; letter-spacing: 0; }
.tk-name { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.amt-box { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r1); background: var(--surface); }
.amt-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.amt-box input { width: 100%; min-width: 0; border: 0; background: none; padding: 6px 4px 6px 8px; font: 500 12.5px var(--f-mono); text-align: right; }
.amt-box input:focus { outline: none; }
.unit { border: 0; border-left: 1px solid var(--line-2); background: var(--surface-2); font: 500 11px/1 var(--f-mono); color: var(--ink-3); padding: 0 8px; align-self: stretch; cursor: pointer; border-radius: 0 var(--r1) var(--r1) 0; }
.unit:hover { color: var(--ink); }
.hold-v { text-align: right; line-height: 1.2; }
.hold-v b { display: block; font: 500 12.5px var(--f-mono); }
.hold-v span { font: 400 10.5px var(--f-mono); color: var(--ink-3); }
.x { width: 24px; height: 24px; border-radius: var(--r1); border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 17px; line-height: 1; flex: none; }
.x:hover { background: var(--sunk); color: var(--ink); }

.add { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 12px; }
.add .ac { position: relative; }
.add-row2 { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.ac-list { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--card-line); border-radius: var(--r3); box-shadow: var(--shadow-panel); }
.ac-list li { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px; border-radius: var(--r1); cursor: pointer; }
.ac-list li.on, .ac-list li:hover { background: var(--sunk); }
.ac-name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-px { font-size: 11px; color: var(--ink-3); }
.hint { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.universe { margin-top: 12px; font-size: 12.5px; color: var(--ink-3); }
.universe summary { cursor: pointer; }
.universe p { margin: 6px 0 0; font-family: var(--f-mono); font-size: 11px; line-height: 1.7; word-spacing: 4px; }

.lt-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.lt-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.lt-top .tk { flex: 0 0 auto; }
.lt-name { min-width: 0; flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lt-w { font-size: 12px; }
.bar { height: 4px; background: var(--sunk); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 2px; }
.lt-via { font-size: 10.5px; color: var(--ink-3); margin-top: 4px; }

.exp-row { display: grid; grid-template-columns: 116px minmax(0, 1fr) 56px; gap: 8px; align-items: center; padding: 3px 0; }
.exp-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exp-bar { position: relative; height: 10px; }
.exp-bar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line-2); }
.exp-bar i { position: absolute; top: 2px; height: 6px; border-radius: 2px; background: var(--ink-2); }

const TIERS = {

  B: { name: 'Contested', rule: 'Market readings disagree beyond their error bars. The disagreement is the insight.' },
  C: { name: 'Provisional', rule: 'Odds are observed, but the jump has only one market reading or the match is weak.' },

/* ---------- 6.1 Exposure engine: look-through, arrow, extras, fit ---------- */
function holdingValue(h) { const t = TICKERS[h.t]; if (!t || !(h.a > 0)) return 0; return h.u === 'usd' ? h.a : h.a * t.px; }

  const added = new Set(extras.map(e => e.k));

  rows.forEach(r => {
    const t = TICKERS[r.t]; if (t.r2 == null) return;

/* ---------- 4.1 Impact: the dot product, plus extras and the direct channel ---------- */

function eventDirect(ev, P) { return contributions(ev, P).reduce((s, x) => s + x.c, 0); }

/* ---------- 4.2-4.4 Odds, what-ifs, knock-ons, priced-in moves, swing ---------- */
function buildState(P, tw, live, whatIf) {
  const evs = EVENTS.map(e => ({ ...e, parents: [], children: [] }));
  const byId = Object.fromEntries(evs.map(e => [e.id, e]));
  const order = [...evs].sort((a, c) => parseDate(a.date) - parseDate(c.date) || EVENTS.findIndex(z => z.id === a.id) - EVENTS.findIndex(z => z.id === c.id));
  const links = tw.knock ? LINKS : [];
  links.forEach(([p, c, w]) => { byId[p].children.push({ id: c, w }); byId[c].parents.push({ id: p, w }); });
  evs.forEach(e => {
    const off = (live && live[e.id]) || 0;
    e.q0 = clamp(e.q + off, 0.005, 0.995); e.ph0 = clamp(e.ph + off, 0.005, 0.995);
  });
  order.forEach(e => {
    const wi = whatIf && whatIf[e.id];
    if (wi) { e.resolved = wi; e.qEff = wi === 'yes' ? 1 : 0; e.shift = e.qEff - e.q0; }
    else {
      let shift = 0;
      e.parents.forEach(p => { const pe = byId[p.id]; shift += p.w * (pe.qEff - pe.q0); });
      e.qEff = clamp(e.q0 + shift, 0.005, 0.995); e.shift = e.qEff - e.q0;
    }
    e.phEff = e.resolved ? e.qEff : clamp(e.ph0 + e.shift, 0.005, 0.995);
  });
  evs.forEach(e => { e.contrib = contributions(e, P); e.dD = e.contrib.reduce((s, x) => s + x.c, 0); });
  [...order].reverse().forEach(e => {
    e.knock = e.children.map(c => { const ce = byId[c.id]; return { id: c.id, w: c.w, d: ce.resolved ? 0 : c.w * ce.dT }; });
    e.dT = e.dD + e.knock.reduce((s, k) => s + k.d, 0);
  });

  evs.forEach(e => {
    const q = e.qEff;
    e.days = daysBetween(TODAY, e.date); e.inH = e.days <= H;
    e.priced = q * e.dT; e.ifYes = (1 - q) * e.dT; e.ifNo = -q * e.dT;
    e.swing = q * (1 - q) * e.dT * e.dT; e.swingPct = Math.abs(e.dT) * Math.sqrt(q * (1 - q));

}

/* ---------- 4.6 Evidence fusion: precision-weighted average and chi-square check ---------- */
function fuseReadings(src) {
  const rd = src.map(([kind, name, detail, k, sig]) => ({ kind, name, detail, k, sig, market: MARKET_KINDS.has(kind) }));
  let sw = 0, sx = 0; rd.forEach(r => { const w = 1 / (r.sig * r.sig); sw += w; sx += w * r.k; });
  const kbar = sx / sw;
  rd.forEach(r => { r.kn = r.k / kbar; r.sn = r.sig / kbar; r.w = (1 / (r.sig * r.sig)) / sw; });
  const mk = rd.filter(r => r.market);

  const dof = Math.max(mk.length - 1, 0);

  return { rd, nMarket: mk.length, chi2, dof, crit, agree: mk.length >= 2 && chi2 <= crit };
}

  const [a, b] = odds; const gap = Math.abs(a[1] - b[1]); const se = Math.sqrt(a[2] * a[2] + b[2] * b[2]);

/* ---------- 4.7 Scenario simulation over the event graph ---------- */
function simulate(S, P, tw, n) {

    parents: e.parents.filter(pp => idx.has(pp.id)).map(pp => ({ j: idx.get(pp.id), w: pp.w })), alpha: 0, beta: [],

  let vr = 0; for (let s = 0; s < n; s++) vr += (pnl[s] - mean) * (pnl[s] - mean);

}

/* ---------- The 3D map: macro axes and the portfolio's own axes ---------- */
const AXES3 = [
  { name: 'growth', w: [0.5, 0.15, 0, 0, 0.2, -0.35, 0, 0.3, 0, 0], ends: ['Weaker growth', 'Stronger growth'] },
  { name: 'risk', w: [0.25, 0, 0, 0, 0, -0.45, -0.55, 0, 0, -0.3], ends: ['Risk-off', 'Risk-on'] },
  { name: 'inflation', w: [0, 0.4, 0.6, 0, 0.45, 0, 0, 0, 0, 0.15], ends: ['Lower inflation', 'Higher inflation'] },
].map(a => { const nrm = Math.hypot(...a.w); return { ...a, w: a.w.map(v => v / nrm) }; });
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);

function powerIter(M, ortho) {
  let v = M.map((_, i) => 1 + 0.1 * i);
  for (let it = 0; it < 80; it++) {
    let w = M.map(row => dot(row, v));
    ortho.forEach(u => { const d = dot(w, u); w = w.map((x, i) => x - d * u[i]); });
    const nm = Math.hypot(...w) || 1; v = w.map(x => x / nm);
  }

}
function axisLabel(v) {
  const top = v.map((x, k) => [Math.abs(x), k, x]).sort((a, b) => b[0] - a[0]).slice(0, 2);
  const word = (k, s) => FACTORS[k].short + (s > 0 ? ' up' : ' down');
  return [top.map(([, k, x]) => word(k, -x)).join(', '), top.map(([, k, x]) => word(k, x)).join(', ')];
}
function mapGeometry(evs, P, mode) {
  if (mode === 'mine') {
    const nb = Math.hypot(...P.b) || 1; const u = P.b.map(v => v / nb);
    const M = Array.from({ length: NF }, () => new Array(NF).fill(0));
    const res = {};
    evs.forEach(e => {
      const wgt = e.qEff * (1 - e.qEff) + 0.02; const d0 = dot(e.d, u); const r = e.d.map((v, k) => v - d0 * u[k]); res[e.id] = r;
      for (let i = 0; i < NF; i++) for (let j = 0; j < NF; j++) M[i][j] += wgt * r[i] * r[j];
    });
    let v1 = powerIter(M, [u]); let v2 = powerIter(M, [u, v1]);
    const flip = v => { const k = v.reduce((bi, x, i) => Math.abs(x) > Math.abs(v[bi]) ? i : bi, 0); return v[k] < 0 ? v.map(x => -x) : v; };
    v1 = flip(v1); v2 = flip(v2);
    const raw = {}; evs.forEach(e => { raw[e.id] = [e.dT, dot(res[e.id], v1), dot(res[e.id], v2)]; });
    const mx = [0, 1, 2].map(i => Math.max(0.01, ...evs.map(e => Math.abs(raw[e.id][i]))));
    const pos = {}; evs.forEach(e => { const r = raw[e.id]; pos[e.id] = [r[0] / mx[0], r[1] / mx[1], r[2] / mx[2]]; });
    return { pos, arrow: [1, 0, 0], ends: { x: ['You lose', 'You gain'], y: axisLabel(v1), z: axisLabel(v2) } };
  }
  const raw = {}; evs.forEach(e => { raw[e.id] = AXES3.map(a => dot(a.w, e.d)); });
  const norms = evs.map(e => Math.hypot(...raw[e.id])).sort((a, b) => a - b);
  const ref = Math.max(0.6, norms[Math.floor(norms.length * 0.85)] || 1);
  const pos = {};
  evs.forEach(e => { let p = raw[e.id].map(v => v / ref); const nm = Math.hypot(...p); if (nm > 1.2) p = p.map(v => v * 1.2 / nm); pos[e.id] = p; });
  const a = AXES3.map(ax => dot(ax.w, P.b)); const na = Math.hypot(...a) || 1;
  return { pos, arrow: a.map(v => v / na), ends: { x: AXES3[0].ends, y: AXES3[1].ends, z: AXES3[2].ends } };
}

/* ---------- Odds history (illustrative): a bridge in log-odds space ---------- */
function oddsHistory(e, n = 120) {
  if (!e.hist) return null;
  const rng = mulberry32(hashStr(e.id)); const { h0, y, j = [] } = e.hist;
  const inc = new Array(n - 2).fill(0).map(() => (rng() - 0.5) * 0.18);
  j.forEach(([ago, size]) => { const k = n - 2 - ago; if (k >= 0 && k < inc.length) inc[k] += size; });
  const tot = inc.reduce((a, b) => a + b, 0); const corr = (logit(y) - logit(h0) - tot) / inc.length;
  const out = [h0]; let z = logit(h0);
  for (let i = 0; i < inc.length; i++) { z += inc[i] + corr; out.push(sigmoid(z)); }
  out.push(e.q);
  return out;
}

/* ---------- Historical replay (E8): engine's calls vs what happened ---------- */
function replayCompute(P, knock) {
  const R = REPLAY; const D = R.days.length;
  const real = R.days.map(day => day.f.reduce((s, f, k) => s + P.b[k] * f / FACTORS[k].typical, 0));
  const links = knock ? R.links : [];
  const qAt = (e, i) => (e.res != null && i >= e.res) ? null : (e.q[i] == null ? null : e.q[i]);
  const direct = Object.fromEntries(R.events.map(e => [e.id, dot(P.b, e.d)]));
  const dTotalAt = (id, i, seen = new Set()) => {
    if (seen.has(id)) return 0; seen.add(id);
    let s = direct[id];
    links.forEach(([p, c, w]) => { if (p !== id) return; const ce = R.events.find(z => z.id === c); if (qAt(ce, i) == null) return; s += w * dTotalAt(c, i, seen); });
    return s;
  };
  const states = R.days.map((day, i) => R.events.map(e => {
    const resolved = e.res != null && i >= e.res; const q = qAt(e, i);
    if (resolved) return { id: e.id, t: e.t, s: e.s, status: 'happened', on: R.days[e.res].d };
    if (q == null) return { id: e.id, t: e.t, s: e.s, status: 'unlisted' };
    const dT = dTotalAt(e.id, i);
    return { id: e.id, t: e.t, s: e.s, status: 'open', q, dT, ifYes: (1 - q) * dT, ifNo: -q * dT, swing: Math.abs(dT) * Math.sqrt(q * (1 - q)) };
  }));
  const calls = R.events.filter(e => e.res != null).map(e => {
    const i = e.res - 1; const q = qAt(e, i); const dT = dTotalAt(e.id, i);
    const pred = e.out ? (1 - q) * dT : -q * dT;
    return { id: e.id, t: e.t, s: e.s, day: e.res, date: R.days[e.res].d, q, dT, pred, real: real[e.res] };
  });

  return { real, cum, states, calls };
}

/* ---------- formatting ---------- */

const swingPct = v => '±' + Math.abs(v).toFixed(1) + '%';
const swingUsd = v => '±$' + compactNum(Math.abs(v));
const pct0 = v => Math.round(v * 100) + '%';

const tone = v => (v < -1e-9 ? 'neg' : v > 1e-9 ? 'pos' : '');
function horizonEnd(months) {
  const [y, m, d] = TODAY.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1 + months, d));
  return MONTHS[dt.getUTCMonth()] + ' ' + dt.getUTCDate() + ', ' + dt.getUTCFullYear();
}
function niceTicks(lo, hi, n = 5) {
  const span = hi - lo; if (!(span > 0)) return [lo];
  const step0 = span / n; const mag = Math.pow(10, Math.floor(Math.log10(step0))); const r = step0 / mag;
  const step = (r >= 5 ? 10 : r >= 2 ? 5 : 2) * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function parseAmt(s) {
  const m = String(s == null ? '' : s).trim().toLowerCase().replace(/[$,\s]/g, '').match(/^(\d*\.?\d+)([km]?)$/);
  if (!m) return NaN;
  return parseFloat(m[1]) * (m[2] === 'k' ? 1e3 : m[2] === 'm' ? 1e6 : 1);
}

const colorCache = new Map();
function toRgb(c) {
  if (colorCache.has(c)) return colorCache.get(c);
  const cv = document.createElement('canvas'); cv.width = cv.height = 1;
  const x = cv.getContext('2d'); x.fillStyle = '#000'; x.fillStyle = c; x.fillRect(0, 0, 1, 1);
  const d = x.getImageData(0, 0, 1, 1).data; const r = [d[0], d[1], d[2]];
  colorCache.set(c, r); return r;
}
const rgba = (c, a) => { const [r, g, b] = toRgb(c); return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')'; };

// Charts draw at their real width so axis text stays at its set size instead of scaling with the box.
function useWidth(ref, fallback) {
  const [w, setW] = useState(fallback);
  useEffect(() => {
    const el = ref.current; if (!el || typeof ResizeObserver !== 'function') return undefined;
    const ro = new ResizeObserver(es => { const cw = Math.round(es[0].contentRect.width); if (cw > 0) setW(cw); });
    ro.observe(el); return () => ro.disconnect();
  }, []);
  return w;
}

// True once the element's bottom edge has scrolled up past `offset` pixels from the top.
function useScrolledPast(ref, offset, enabled) {
  const [past, setPast] = useState(false);
  useEffect(() => {
    if (!enabled) return undefined;
    let raf = 0;
    const check = () => { raf = 0; const el = ref.current; if (el) setPast(el.getBoundingClientRect().bottom <= offset); };
    const on = () => { if (!raf) raf = requestAnimationFrame(check); };
    check();
    window.addEventListener('scroll', on, { passive: true }); window.addEventListener('resize', on);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('scroll', on); window.removeEventListener('resize', on); };
  }, [enabled, offset]);
  return past;
}

function AddHolding({ onAdd }) {
  const [q, setQ] = useState(''); const [amt, setAmt] = useState(''); const [unit, setUnit] = useState('usd');
  const [open, setOpen] = useState(false); const [hi, setHi] = useState(0); const [msg, setMsg] = useState('');
  const amtRef = useRef(null);
  const list = useMemo(() => {
    const s = q.trim().toUpperCase(); if (!s) return [];
    const all = Object.keys(TICKERS);
    const a = all.filter(k => k.startsWith(s));
    const b = all.filter(k => !k.startsWith(s) && TICKERS[k].n.toUpperCase().includes(s));
    return a.concat(b).slice(0, 6);
  }, [q]);
  const pick = k => { setQ(k); setOpen(false); setMsg(''); setTimeout(() => amtRef.current && amtRef.current.focus(), 0); };
  const submit = e => {
    if (e) e.preventDefault();
    const k = q.trim().toUpperCase();
    if (!TICKERS[k]) { setMsg(k ? k + ' isn’t in this prototype’s universe yet. The list below shows what is.' : 'Type a ticker first.'); return; }
    const n = parseAmt(amt);
    if (!(n > 0)) { setMsg('Enter how many ' + (unit === 'usd' ? 'dollars' : 'shares') + ' of ' + k + '.'); if (amtRef.current) amtRef.current.focus(); return; }
    onAdd({ t: k, u: unit, a: n }); setQ(''); setAmt(''); setMsg(''); setOpen(false);
  };
  const onKey = e => {
    const showing = open && list.length > 0;
    if (e.key === 'ArrowDown' && showing) { e.preventDefault(); setHi(i => (i + 1) % list.length); }
    else if (e.key === 'ArrowUp' && showing) { e.preventDefault(); setHi(i => (i - 1 + list.length) % list.length); }
    else if (e.key === 'Enter') { e.preventDefault(); if (showing) pick(list[Math.min(hi, list.length - 1)]); else if (TICKERS[q.trim().toUpperCase()]) pick(q.trim().toUpperCase()); else submit(); }
    else if (e.key === 'Escape') setOpen(false);
  };
  return html`<form className="add" onSubmit=${submit} autoComplete="off">
    <div className="ac">
      <label className="sr" htmlFor="add-tk">Ticker</label>
      <input id="add-tk" className="in" placeholder="Add a ticker, e.g. SPY or NVDA" value=${q} role="combobox" aria-expanded=${open && list.length > 0} aria-controls="add-list" aria-autocomplete="list"
        onChange=${e => { setQ(e.target.value); setOpen(true); setHi(0); setMsg(''); }} onFocus=${() => setOpen(true)} onBlur=${() => setTimeout(() => setOpen(false), 120)} onKeyDown=${onKey} />
      ${open && list.length > 0 && html`<ul className="ac-list" id="add-list" role="listbox">

      </ul>`}
    </div>
    <div className="add-row2">
      <input ref=${amtRef} className="in mono" inputMode="decimal" placeholder=${unit === 'usd' ? 'Amount, e.g. 25k' : 'Shares'} value=${amt} aria-label="Amount" onChange=${e => { setAmt(e.target.value); setMsg(''); }} />
      <div className="seg" role="group" aria-label="Units">
        <button type="button" className=${unit === 'usd' ? 'on' : ''} aria-pressed=${unit === 'usd'} onClick=${() => setUnit('usd')}>$</button>
        <button type="button" className=${unit === 'sh' ? 'on' : ''} aria-pressed=${unit === 'sh'} onClick=${() => setUnit('sh')}>Shares</button>
      </div>
      <button className="btn" type="submit">Add</button>
    </div>
    ${msg && html`<p className="hint" role="status">${msg}</p>`}

}

    const i = holdings.findIndex(x => x.t === h.t);
    if (i < 0) { onEdit(holdings.concat([{ ...h, id: h.t + Date.now() }])); return; }
    const cur = holdings[i]; const px = TICKERS[h.t].px;

function Pipeline({ P, S, sim, tw }) {
  const inH = S.evs.filter(e => e.inH);
  const matched = inH.filter(e => e.m).length;
  const nT = t => inH.filter(e => e.tier === t).length;
  const steps = [
    ['Look through', html`<b>${P.rows.length}</b> holdings → <b>${P.nUnderlying}</b> companies`, 'Funds are replaced by what they hold, so overlaps add up.'],
    ['Exposure', html`<b>${NF + P.extras.length}</b> factors · fit <b>${P.fit == null ? '–' : Math.round(P.fit * 100) + '%'}</b>`, 'Ten core factors, plus extras pulled in only when this portfolio needs them.'],
    ['Discover', html`<b>${inH.length}</b> events in ${tw.horizon} months`, 'Events that resolve inside your horizon. The real library keeps about 250, tagged from thousands of markets by Laya.'],
    ['Match', html`<b>${matched}</b> matched · <b>${inH.length - matched}</b> unpriced`, 'Each event is matched to a prediction market with the same resolution rule, or marked unpriced.'],
    ['Evidence', html`<b>${nT('A')}</b> confirmed · <b>${nT('B')}</b> contested`, 'Options, ETF windows and Hyperliquid’s weekend perps each measure the jump. The engine checks that they agree.'],
    ['Graph', tw.knock ? html`<b>${S.links.length}</b> knock-on links` : html`Knock-ons <b>off</b>`, 'Some events make others likelier. Their effects are added along the links.'],
    ['Simulate', html`<b>${sim.n.toLocaleString('en-US')}</b> runs · ${Math.max(1, Math.round(sim.ms || 0))} ms`, 'Joint scenarios over the event graph, at market odds.'],
  ];
  return html`<ol className="pipe" aria-label="How the engine works">${steps.map(([t, v, tip], i) => html`<li key=${t} className="pipe-step" title=${tip}><span className="label"><span className="pipe-n">${String(i + 1).padStart(2, '0')}</span>${t}</span><span className="pipe-v">${v}</span></li>`)}</ol>`;
}

  const X = v => m.l + (v + xm) / (2 * xm) * (W - m.l - m.r);
  const Y = q => H - m.b - q * (H - m.t - m.b);
  const maxSw = Math.max(1e-6, ...evs.map(e => e.swingPct));
  const R = e => 4 + 11 * Math.sqrt(e.swingPct / maxSw);
  const ranked = evs.slice().sort((a, b) => b.swing - a.swing);
  const lab = new Set((tw.labels === 'none' ? [] : ranked.slice(0, tw.labels === 'all' ? 99 : 5)).map(e => e.id));
  const levels = ranked.length ? [ranked[0].swingPct, ranked[0].swingPct / 2] : [];
  const contour = (c, s) => {
    const pts = []; for (let i = 1; i < 200; i++) { const q = i / 200; const x = s * c / Math.sqrt(q * (1 - q)); if (Math.abs(x) <= xm) pts.push(X(x).toFixed(1) + ',' + Y(q).toFixed(1)); }
    return pts.length > 1 ? 'M' + pts.join('L') : '';
  };
  const ticks = niceTicks(-xm, xm, 6);
  return html`<div className="flat" ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Events by what they would do to you and by their odds">
    ${[0, 0.25, 0.5, 0.75, 1].map(q => html`<g key=${'q' + q}><line x1=${m.l} x2=${W - m.r} y1=${Y(q)} y2=${Y(q)} style=${{ stroke: 'var(--line)' }} /><text x=${m.l - 8} y=${Y(q) + 3} textAnchor="end" className="ax">${q * 100}%</text></g>`)}
    ${ticks.map(v => html`<text key=${'x' + v} x=${X(v)} y=${H - m.b + 16} textAnchor="middle" className="ax">${fmtPct(v, 0)}</text>`)}
    <line x1=${X(0)} x2=${X(0)} y1=${m.t} y2=${H - m.b} style=${{ stroke: 'var(--line-2)' }} />
    ${levels.map((c, i) => html`<g key=${'c' + i}><path d=${contour(c, -1)} style=${{ fill: 'none', stroke: 'var(--ink-3)', strokeDasharray: '3 4', opacity: 0.55 }} /><path d=${contour(c, 1)} style=${{ fill: 'none', stroke: 'var(--ink-3)', strokeDasharray: '3 4', opacity: 0.55 }} /></g>`)}
    <text x=${m.l + 4} y=${H - 8} className="ax">← hurts you</text>
    <text x=${W - m.r} y=${H - 8} textAnchor="end" className="ax">helps you →</text>
    <text x=${(m.l + W - m.r) / 2} y=${H - 8} textAnchor="middle" className="ax">full move if it happens, % of portfolio</text>
    <text x=${m.l + 4} y=${m.t + 10} className="ax">odds ↑</text>
    ${ranked.slice().reverse().map(e => html`<g key=${e.id} className="dot" onMouseEnter=${() => setHover(e.id)} onMouseLeave=${() => setHover(null)} onClick=${() => onOpen(e.id)}>
      <${SvgDot} x=${X(e.dT)} y=${Y(e.qEff)} r=${R(e)} tier=${e.tier} color=${e.dT < 0 ? 'var(--loss)' : 'var(--gain)'} hl=${hover === e.id || sel === e.id} /></g>`)}
    ${ranked.filter(e => lab.has(e.id) || e.id === hover).map(e => { const x = X(e.dT), right = x < W - 140; return html`<text key=${'l' + e.id} x=${right ? x + R(e) + 6 : x - R(e) - 6} y=${Y(e.qEff) + 4} textAnchor=${right ? 'start' : 'end'} className=${cls('lbl', e.id === hover && 'on')}>${e.s}</text>`; })}
  </svg></div>`;
}

/* ---------- simulated outcomes ---------- */
function OutcomeCard({ sim, P, S, tw, onOpen }) {
  const V = P.V; const { lo, hi, bw, bins } = sim.hist; const mx = Math.max(1, ...bins);
  const hRef = useRef(null); const W = Math.max(300, useWidth(hRef, 600)), H = 180, m = { l: 8, r: 8, t: 14, b: 26 };
  const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
  const bh = c => c / mx * (H - m.t - m.b);
  const ticks = niceTicks(lo, hi, 6); const dp = ticks.length > 1 && Math.abs(ticks[1] - ticks[0]) < 1 ? 1 : 0;
  const drivers = sim.drivers.map(d => {
    const yes = d.tail >= d.base; const fb = yes ? d.base : 1 - d.base, ft = yes ? d.tail : 1 - d.tail;
    return { ...d, yes, fb, ft, lift: ft - fb };
  }).filter(d => d.lift > 0.03).sort((a, b) => b.lift - a.lift).slice(0, 3);
  return html`<section className="card" aria-labelledby="oc-h">
    <div className="card-head"><div><span className="kicker">Simulation · ${sim.n.toLocaleString('en-US')} joint scenarios</span><h3 className="h3" id="oc-h" style=${{ marginTop: 6 }}>Range of outcomes by ${horizonEnd(tw.horizon)}</h3>
      <p className="sub">Events are drawn together over the graph, so linked ones tend to happen together. ${tw.noise ? 'Includes everyday market noise.' : 'Event moves only, no everyday noise.'}</p></div></div>
    <div className="hist" ref=${hRef}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label=${'Histogram of outcomes. A 1 in 20 chance of ' + fmtPct(sim.p5) + ' or worse.'}>
      ${bins.map((c, i) => { const x0 = lo + i * bw; const tail = x0 + bw / 2 <= sim.p5; return c ? html`<rect key=${i} x=${X(x0) + 0.5} y=${H - m.b - bh(c)} width=${Math.max(0.6, X(x0 + bw) - X(x0) - 1)} height=${bh(c)} rx="1" style=${{ fill: tail ? 'var(--loss)' : 'var(--line-2)' }} />` : null; })}
      <line x1=${m.l} x2=${W - m.r} y1=${H - m.b} y2=${H - m.b} style=${{ stroke: 'var(--line-2)' }} />
      ${ticks.map(v => html`<text key=${'t' + v} x=${X(v)} y=${H - 8} textAnchor="middle" className="ax">${fmtPct(v, dp)}</text>`)}
      ${lo < 0 && hi > 0 && html`<line x1=${X(0)} x2=${X(0)} y1=${m.t} y2=${H - m.b} style=${{ stroke: 'var(--ink-3)', strokeDasharray: '2 3' }} />`}
      <line x1=${X(sim.p5)} x2=${X(sim.p5)} y1=${m.t} y2=${H - m.b} style=${{ stroke: 'var(--loss)', strokeWidth: 1.5 }} />
      <text x=${X(sim.p5) < 70 ? X(sim.p5) + 5 : X(sim.p5) - 5} y=${m.t + 8} textAnchor=${X(sim.p5) < 70 ? 'start' : 'end'} className="ax">1 in 20</text>
    </svg></div>
    <div className="stats">
      <div className="stat"><span className="label">Median</span><span className=${cls('v', tone(sim.p50))}>${fmtUsd(sim.p50 * V / 100, true)}</span></div>
      <div className="stat"><span className="label">Worst 1 in 20</span><span className=${cls('v', tone(sim.p5))}>${fmtUsd(sim.p5 * V / 100, true)}</span></div>
      <div className="stat"><span className="label">Best 1 in 20</span><span className=${cls('v', tone(sim.p95))}>${fmtUsd(sim.p95 * V / 100, true)}</span></div>
      <div className="stat"><span className="label">Worst 5% average</span><span className=${cls('v', tone(sim.es))}>${fmtUsd(sim.es * V / 100, true)}</span></div>
    </div>
    ${drivers.length > 0 && html`<ul className="drivers"><li className="label">What the worst 5% have in common</li>${drivers.map(d => html`<li key=${d.id}>
      <button className="inl" onClick=${() => onOpen(d.id)}>${S.byId[d.id].s}</button> ${d.yes ? 'happens' : 'doesn’t happen'} in <b>${pct0(d.ft)}</b> of the worst 5%, against ${pct0(d.fb)} overall.
      <div className="drv-bars" aria-hidden="true"><div className="drv-bar"><i style=${{ width: d.fb * 100 + '%', background: 'var(--ink-3)' }}></i></div><div className="drv-bar"><i style=${{ width: d.ft * 100 + '%', background: 'var(--loss)' }}></i></div></div></li>`)}</ul>`}
    <p className="note">${tw.odds === 'calibrated' ? 'With calibrated odds the average is ' + fmtPct(sim.mean, 2) + '. That is the engine’s edge over market prices, a hint rather than a forecast.' : 'The average is about zero (' + fmtPct(sim.mean, 2) + ') because market odds are already in today’s prices. What is left is the swing.'}</p>
  </section>`;
}

/* ---------- live feed / overnight changes ---------- */
function FeedCard({ live, setLive, feed, S, P, onOpen, hasLive, resetLive }) {
  const V = P.V;
  const overnight = useMemo(() => S.evs.filter(e => e.hist && e.inH && !e.resolved)
    .map(e => ({ e, dq: e.q0 - e.hist.y, usd: (e.q0 - e.hist.y) * e.dT * V / 100 }))
    .filter(x => Math.abs(x.dq) >= 0.005).sort((a, b) => Math.abs(b.usd) - Math.abs(a.usd)).slice(0, 6), [S, V]);
  return html`<section className="card" aria-labelledby="fd-h">
    <div className="card-head">
      <div><span className="kicker">${live ? 'Live · simulated odds' : 'Since yesterday'}</span><h3 className="h3" id="fd-h" style=${{ marginTop: 6 }}>${live ? 'Odds moving now' : 'What moved overnight'}</h3>
        <p className="sub">${live ? 'Each odds change is priced through your portfolio the moment it happens: the change in odds times what the event does to you.' : 'Overnight odds changes, priced for your portfolio: the change in odds times what the event does to you.'}</p></div>
      <button className=${cls('btn-ghost', live && 'on')} onClick=${() => setLive(!live)} aria-pressed=${live}><i className="dot-live"></i>${live ? 'Pause' : 'Go live'}</button>
    </div>
    ${live ? (feed.length ? html`<ul className="feed" aria-live="polite">${feed.slice(0, 8).map(f => html`<li key=${f.k}>
        <button className="inl f-t" onClick=${() => onOpen(f.id)}>${S.byId[f.id].s}</button><span className=${cls('f-v', tone(f.usd))}>${fmtUsd(f.usd, true)}</span>
        <span className="f-m">${f.time} · odds ${fmtOdds(f.q0)} → ${fmtOdds(f.q1)}</span></li>`)}</ul>` : html`<p className="sub">Waiting for the first odds change…</p>`)
      : html`<ul className="feed">${overnight.map(x => html`<li key=${x.e.id}>
        <button className="inl f-t" onClick=${() => onOpen(x.e.id)}>${x.e.s}</button><span className=${cls('f-v', tone(x.usd))}>${fmtUsd(x.usd, true)}</span>
        <span className="f-m">odds ${fmtOdds(x.e.hist.y)} → ${fmtOdds(x.e.q0)} (${fmtPts(x.dq)})</span></li>`)}</ul>`}
    ${!live && hasLive && html`<p className="list-foot sub" style=${{ marginLeft: 0 }}>Odds include your live session. <button className="link" onClick=${resetLive}>Back to snapshot odds</button></p>`}
  </section>`;
}

function AnalysisView(p) {
  const { P, S, sim, shown, beyond, tw, setTw, hover, setHover, sel, onOpen, whatIf, setWhatIf, live, setLive, feed, ripple, hasLive, resetLive } = p;

function Spark({ h, now }) {
  const ref = useRef(null);
  const W = Math.max(280, useWidth(ref, 520)), H = 72, n = h.length; const lo = Math.min(...h, now), hi = Math.max(...h, now); const pad = Math.max(0.01, (hi - lo) * 0.15);
  const X = i => 6 + i / (n - 1) * (W - 12); const Y = v => 6 + (1 - (v - lo + pad) / (hi - lo + 2 * pad)) * (H - 28);
  const d = h.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(i === n - 1 ? now : v).toFixed(1)).join('');
  return html`<div className="spark" ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label=${'Odds over the last 120 days, from ' + fmtOdds(h[0]) + ' to ' + fmtOdds(now)}>
    <path d=${d} style=${{ fill: 'none', stroke: 'var(--ink-2)', strokeWidth: 1.5, strokeLinejoin: 'round' }} />
    <circle cx=${X(n - 2)} cy=${Y(h[n - 2])} r="2.5" style=${{ fill: 'var(--ink-3)' }} />
    <circle cx=${X(n - 1)} cy=${Y(now)} r="3.5" style=${{ fill: 'var(--accent)' }} />
    <text x="6" y=${H - 4} className="ax">120 days ago · ${fmtOdds(h[0])}</text>
    <text x=${W - 6} y=${H - 4} textAnchor="end" className="ax">Today · ${fmtOdds(now)}</text>
  </svg></div>`;
}

function verdictText(f) {
  if (f.nMarket >= 2 && f.agree) return html`<span className="mk ok">✓</span><p><b>Market readings agree.</b> χ² ${f.chi2.toFixed(2)} is under the 5% cutoff of ${f.crit}, so the fused jump stands.</p>`;
  if (f.nMarket >= 2) return html`<span className="mk bad">!</span><p><b>Market readings disagree.</b> χ² ${f.chi2.toFixed(1)} is over the 5% cutoff of ${f.crit}. The engine shows the event as contested instead of averaging the gap away.</p>`;
  if (f.nMarket === 1) return html`<span className="mk mid">≈</span><p><b>One market reading.</b> Nothing to cross-check it against yet, so the jump is provisional.</p>`;
  return html`<span className="mk mid">≈</span><p><b>No market readings.</b> The jump comes from past events and the AI prior only.</p>`;
}

function Explain({ e, P, q, ifYes, ifNo }) {
  const [st, setSt] = useState({ s: 'idle', text: '' });
  const ctl = useRef(null);
  useEffect(() => { if (ctl.current) ctl.current.abort(); setSt({ s: 'idle', text: '' }); }, [e.id]);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  const go = async () => {
    const sample = await getSample(); if (!sample) { setSt({ s: 'off', text: '' }); return; }
    if (ctl.current) ctl.current.abort(); const ac = new AbortController(); ctl.current = ac;
    setSt({ s: 'think', text: '' });
    const hold = P.rows.slice().sort((a, b) => b.w - a.w).slice(0, 6).map(r => r.t + ' ' + (r.w * 100).toFixed(0) + '%').join(', ');
    const top = P.look.filter(o => o.kind === 'stock').slice(0, 5).map(o => o.name + ' ' + (o.w * 100).toFixed(1) + '%').join(', ');
    const drivers = e.contrib.slice(0, 4).map(c => c.name + ' ' + fmtPct(c.c, 2)).join('; ');
    const prompt = [
      'You explain one result from a portfolio scenario engine to the person who owns the portfolio.',
      'Write 3 or 4 short sentences of plain English: no lists, no headings, no preamble.',
      'Say why this event moves this portfolio the way the numbers say, which holdings or exposures drive it, and one thing worth watching. Use only the numbers given. Do not give advice to buy or sell.',
      '',
      'Portfolio (' + fmtUsdFull(P.V) + '): ' + hold + '. Largest look-through companies: ' + (top || 'none') + '.',
      'Event: ' + e.t + ', resolves ' + fmtDate(e.date) + '. Odds ' + fmtOdds(q) + '.',
      'Full move if it happens: ' + fmtPct(e.dT, 2) + ' of the portfolio (direct ' + fmtPct(e.dD, 2) + ', knock-on effects through other events ' + fmtPct(e.dT - e.dD, 2) + ').',
      'Net of what the odds already price in: ' + fmtPct(ifYes, 2) + ' if it happens, ' + fmtPct(ifNo, 2) + ' if it does not.',
      'Biggest drivers (exposure times the factor move): ' + drivers + '.',
      'Background: ' + e.why,
    ].join('\n');
    try {
      const r = await sample(prompt, { modelTier: 'quick', signal: ac.signal, onText: ({ text }) => setSt({ s: 'stream', text }) });
      if (!ac.signal.aborted) setSt({ s: 'done', text: r.text });
    } catch (err) {
      const code = err && err.code;
      if (code === 'cancelled' || ac.signal.aborted) return;
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'capability_disabled' || code === 'not_declared') setSt({ s: 'off', text: '' });
      else if (code === 'rate_limited' || code === 'queue_overflow') setSt({ s: 'err', text: 'Claude is busy right now. Try again in a minute.' });
      else setSt({ s: 'err', text: (err && err.text) || 'Claude could not answer this time.' });
    }
  };
  if (st.s === 'off') return null;
  const busy = st.s === 'think' || st.s === 'stream';
  return html`<div style=${{ marginTop: 14 }}>
    ${busy ? html`<button className="btn-ghost" onClick=${() => { if (ctl.current) ctl.current.abort(); setSt({ s: 'idle', text: '' }); }}>Stop</button>`
      : html`<button className="btn-ghost" onClick=${go}>${st.s === 'idle' ? 'Explain for my portfolio' : 'Explain again'}</button>`}
    ${st.s === 'think' && html`<p className="ai-out sub">Thinking…</p>`}
    ${st.text && html`<p className=${cls('ai-out', st.s === 'err' && 'sub')} aria-live="polite">${st.text}</p>`}
  </div>`;
}

/* ---------- historical replay ---------- */
function verdictOf(pred, real) {
  if (Math.abs(real) < 0.3 && Math.abs(pred) < 0.3) return ['ok', '✓', 'Both small'];
  if (Math.sign(pred) !== Math.sign(real)) return ['bad', '✕', 'Wrong direction'];
  const r = Math.abs(pred) / Math.abs(real);
  if (r >= 0.7 && r <= 1.4) return ['ok', '✓', 'Close'];
  return ['mid', '≈', r < 1 ? 'Right way, too small' : 'Right way, too big'];
}

function ReplayChart({ RC, day, setDay }) {
  const ref = useRef(null);
  const R = REPLAY, D = R.days.length, W = Math.max(300, useWidth(ref, 640)), H = 250, m = { l: 40, r: 12, t: 14, b: 30 };
  const vals = RC.real.concat(RC.cum, RC.calls.map(c => c.pred));
  const ym = Math.max(2, ...vals.map(Math.abs)) * 1.12;
  const cw = (W - m.l - m.r) / D; const every = cw < 46 ? 2 : 1; const X = i => m.l + (i + 0.5) * cw; const Y = v => m.t + (ym - v) / (2 * ym) * (H - m.t - m.b);
  const ticks = niceTicks(-ym, ym, 6);
  const cumPath = RC.cum.slice(0, day + 1).map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join('');
  return html`<div className="rp-chart" ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Daily moves of your portfolio, with the engine’s calls on the days events resolved">
    ${ticks.map(v => html`<g key=${'y' + v}><line x1=${m.l} x2=${W - m.r} y1=${Y(v)} y2=${Y(v)} style=${{ stroke: Math.abs(v) < 1e-9 ? 'var(--line-2)' : 'var(--line)' }} /><text x=${m.l - 6} y=${Y(v) + 3} textAnchor="end" className="ax">${fmtPct(v, 0)}</text></g>`)}
    ${RC.real.map((v, i) => html`<rect key=${'b' + i} x=${X(i) - cw * 0.28} y=${Math.min(Y(v), Y(0))} width=${cw * 0.56} height=${Math.max(1, Math.abs(Y(v) - Y(0)))} rx="1.5" style=${{ fill: v < 0 ? 'var(--loss)' : 'var(--gain)', opacity: i <= day ? (i === day ? 1 : 0.7) : 0.14, cursor: 'pointer' }} onClick=${() => setDay(i)} />`)}
    ${RC.calls.map(c => html`<rect key=${'p' + c.id} x=${X(c.day) - cw * 0.42} y=${Math.min(Y(c.pred), Y(0))} width=${cw * 0.84} height=${Math.max(1, Math.abs(Y(c.pred) - Y(0)))} rx="2" style=${{ fill: 'none', stroke: 'var(--ink)', strokeWidth: 1.4, strokeDasharray: '4 3', opacity: c.day <= day ? 1 : 0.25 }} />`)}
    <path d=${cumPath} style=${{ fill: 'none', stroke: 'var(--accent)', strokeWidth: 2, strokeLinejoin: 'round' }} />
    ${RC.cum.slice(0, day + 1).map((v, i) => html`<circle key=${'c' + i} cx=${X(i)} cy=${Y(v)} r=${i === day ? 4 : 2.5} style=${{ fill: 'var(--accent)' }} />`)}
    ${R.days.map((d, i) => (i % every === 0 || i === day ? html`<text key=${'d' + i} x=${X(i)} y=${H - 10} textAnchor="middle" className="ax" style=${{ fontWeight: i === day ? 700 : 500 }}>${fmtDate(d.d, false)}</text>` : null))}
  </svg></div>`;
}

function ReplayView({ P, tw }) {
  const R = REPLAY, D = R.days.length, V = P.V;
  const RC = useMemo(() => replayCompute(P, tw.knock), [P, tw.knock]);
  const [day, setDay] = useState(0); const [play, setPlay] = useState(false);
  useEffect(() => {
    if (!play) return undefined;
    const id = setInterval(() => setDay(d => { if (d >= D - 1) { setPlay(false); return d; } return d + 1; }), 1100);
    return () => clearInterval(id);
  }, [play]);
  const pick = i => { setPlay(false); setDay(i); };
  const resDays = new Set(RC.calls.map(c => c.day));
  const order = { open: 0, happened: 1, unlisted: 2 };
  const rows = RC.states[day].slice().sort((a, b) => order[a.status] - order[b.status] || (b.swing || 0) - (a.swing || 0));
  const real = RC.real[day], cum = RC.cum[day];
  const right = RC.calls.filter(c => verdictOf(c.pred, c.real)[0] !== 'bad').length;
  const worst = RC.calls.slice().sort((a, b) => Math.abs(b.real - b.pred) - Math.abs(a.real - a.pred))[0];
  const togglePlay = () => { if (!play && day >= D - 1) setDay(0); setPlay(!play); };
  let summary = '';
  if (worst) {
    summary = 'For this portfolio the engine got the direction right ' + right + ' of ' + RC.calls.length + ' times. Its biggest miss was “' + worst.s + '”: it expected ' + fmtPct(worst.pred) + ' and the day brought ' + fmtPct(worst.real) + '. ';
    summary += Math.abs(worst.real) > Math.abs(worst.pred)
      ? 'On stress days everything moves together more than usual, so exposures measured on normal days understate the hit. The design’s fix is a second set of exposures fitted on stress periods.'
      : 'Part of that move had already happened in the days before, as the odds rose.';
  }
  return html`<${Frag}>
    <section className="card" aria-labelledby="rp-h">
      <div className="card-head">
        <div><span className="kicker">Historical replay · a resolved episode</span><h2 className="h2" id="rp-h" style=${{ marginTop: 6 }}>${R.title}</h2><p className="sub">${R.sub} Each day, the engine only sees the odds as of the previous close. Change the portfolio on the left and the replay updates.</p></div>
        <div className="rp-ctl"><button className="btn" onClick=${togglePlay}>${play ? 'Pause' : day >= D - 1 ? 'Replay' : 'Play'}</button></div>
      </div>
      <div className="rp-time"><div className="rp-days" role="group" aria-label="Trading days">${R.days.map((d, i) => html`<button key=${d.d} className=${cls('rp-day', i < day && 'past', i === day && 'on', resDays.has(i) && 'res')} aria-pressed=${i === day} onClick=${() => pick(i)}>${fmtDate(d.d, false)}</button>`)}</div></div>
      <p className="rp-note"><span className="label">${fmtDate(R.days[day].d)}</span><b className=${tone(real)}>${fmtUsd(real * V / 100, true)} (${fmtPct(real)})</b><span>${R.days[day].note}</span><span className="sub" style=${{ margin: 0 }}>Running total ${fmtPct(cum)}</span></p>
    </section>
    <div className="duo">
      <section className="card"><div className="card-head"><div><span className="kicker">Your portfolio, day by day</span><h3 className="h3" style=${{ marginTop: 6 }}>Moves against the engine’s calls</h3></div></div>
        <${ReplayChart} RC=${RC} day=${day} setDay=${pick} />
        <div className="legend"><span><i className="sw" style=${{ background: 'var(--loss)', borderRadius: 2 }}></i>Your portfolio that day</span><span><i className="sw" style=${{ background: 'none', border: '1.5px dashed var(--ink)', borderRadius: 2 }}></i>The engine’s call the evening before</span><span><i className="ln"></i>Running total</span></div>
      </section>
      <section className="card"><div className="card-head"><div><span className="kicker">At the close of ${fmtDate(R.days[day].d, false)}</span><h3 className="h3" style=${{ marginTop: 6 }}>What the engine saw</h3></div></div>
        <ul className="rp-list">${rows.map(s => html`<li key=${s.id} className=${s.status !== 'open' ? 'done' : ''}>
          <span>${s.t}<small>${s.status === 'open' ? 'If it happens ' + fmtPct(s.ifYes) + ' · if not ' + fmtPct(s.ifNo) : s.status === 'happened' ? 'Happened ' + fmtDate(s.on, false) : 'No market yet'}</small></span>
          <span className="mono" style=${{ textAlign: 'right' }}>${s.status === 'open' ? fmtOdds(s.q) : ''}</span>
          <span className="cell">${s.status === 'open' ? swingUsd(s.swing * V / 100) : ''}${s.status === 'open' && html`<small>${swingPct(s.swing)}</small>`}</span></li>`)}</ul>
      </section>
    </div>
    <section className="card"><div className="card-head"><div><span className="kicker">Calls against outcomes</span><h3 className="h3" style=${{ marginTop: 6 }}>Did the engine get it right?</h3></div></div>
      <div className="scroll-x"><table className="calls"><thead><tr><th>Event</th><th>Resolved</th><th>Odds before</th><th>Engine said</th><th>The day</th><th>Verdict</th></tr></thead><tbody>
        ${RC.calls.map(c => { const [k, mk, txt] = verdictOf(c.pred, c.real); return html`<tr key=${c.id}><td>${c.t}</td><td className="n">${fmtDate(c.date, false)}</td><td className="n">${fmtOdds(c.q)}</td><td className=${cls('n', tone(c.pred))}>${fmtPct(c.pred)}<br /><small>${fmtUsd(c.pred * V / 100, true)}</small></td><td className=${cls('n', tone(c.real))}>${fmtPct(c.real)}<br /><small>${fmtUsd(c.real * V / 100, true)}</small></td><td><span className=${'mk ' + k}>${mk}</span> ${txt}</td></tr>`; })}
      </tbody></table></div>
      ${summary && html`<p className="note">${summary}</p>`}
    </section>
    <p className="sub" style=${{ maxWidth: '90ch' }}>Factor moves are approximate daily closes from April 2025. The odds paths are illustrative reconstructions, not archived prices. In the real system this test runs on every resolved event, and its results set how much each evidence source is trusted.</p>
  <//>`;
}

const DEFAULT_TWEAKS = { odds: 'market', knock: true, horizon: 6, tiers: 'ABCD', topN: 12, sims: 4000, noise: false, theme: 'auto', accent: 'dragon', heading: 'serif', density: 'comfortable', hero: true, view: 'macro', rotate: true, labels: 'top', links: true };
const TWEAK_OPTS = {
  odds: ['market', 'calibrated'], knock: [true, false], horizon: [3, 6, 12], tiers: ['ABCD', 'ABC', 'AB'], topN: [8, 12, 'all'], sims: [2000, 4000, 10000], noise: [false, true],
  theme: ['auto', 'light', 'dark'], accent: ['dragon', 'ember', 'teal', 'steel'], heading: ['serif', 'sans'], density: ['comfortable', 'compact'], hero: [true, false],
  view: ['macro', 'mine', 'flat'], rotate: [true, false], labels: ['top', 'all', 'none'], links: [true, false],
};
function cleanTweaks(t) { const o = {}; if (t && typeof t === 'object') for (const k in TWEAK_OPTS) if (TWEAK_OPTS[k].includes(t[k])) o[k] = t[k]; return o; }

function TweaksSheet({ tw, setTw, onClose }) {
  const [copied, setCopied] = useState(null); const closeRef = useRef(null);
  useEffect(() => { if (closeRef.current) closeRef.current.focus({ preventScroll: true }); }, []);
  useEffect(() => { const k = ev => { if (ev.key === 'Escape') onClose(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [onClose]);
  const set = (k, v) => setTw({ ...tw, [k]: v });
  const Row = (label, help, k, opts) => html`<div className="tw-row"><span>${label}${help && html`<small>${help}</small>`}</span>
    <div className="seg" role="group" aria-label=${label}>${opts.map(([v, l]) => html`<button key=${String(v)} className=${tw[k] === v ? 'on' : ''} aria-pressed=${tw[k] === v} onClick=${() => set(k, v)}>${l}</button>`)}</div></div>`;
  const json = JSON.stringify(tw, null, 2);
  const copy = () => {
    try { navigator.clipboard.writeText(json).then(() => setCopied('ok'), () => setCopied('manual')); } catch (e) { setCopied('manual'); }
  };
  return html`<${Frag}>
    <div className="scrim" onClick=${onClose}></div>
    <aside className="sheet" role="dialog" aria-modal="true" aria-labelledby="tw-h">
      <div className="dr-head"><h2 className="h3" id="tw-h">Tweaks</h2><button ref=${closeRef} className="x" onClick=${onClose} aria-label="Close">×</button></div>
      <div className="tw-body">
        <div className="tw-group"><span className="label">Model</span>
          ${Row('Odds', 'Calibrated shades long shots down', 'odds', [['market', 'Market'], ['calibrated', 'Calibrated']])}
          ${Row('Knock-on effects', 'Events that make others likelier', 'knock', [[true, 'On'], [false, 'Off']])}
          ${Row('Horizon', 'Events resolving after it are repriced', 'horizon', [[3, '3 mo'], [6, '6 mo'], [12, '12 mo']])}
          ${Row('Events listed', null, 'topN', [[8, '8'], [12, '12'], ['all', 'All']])}
          ${Row('Tiers shown', 'Hide events with weaker evidence', 'tiers', [['ABCD', 'All'], ['ABC', 'A–C'], ['AB', 'A–B']])}
          ${Row('Scenarios', null, 'sims', [[2000, '2k'], [4000, '4k'], [10000, '10k']])}
          ${Row('Everyday noise', 'Adds normal market moves to the simulation', 'noise', [[false, 'Off'], [true, 'On']])}
        </div>
        <div className="tw-group"><span className="label">Look</span>
          ${Row('Theme', null, 'theme', [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']])}
          ${Row('Accent', null, 'accent', [['dragon', 'Dragon'], ['ember', 'Ember'], ['teal', 'Teal'], ['steel', 'Steel']])}
          ${Row('Headings', null, 'heading', [['serif', 'Serif'], ['sans', 'Sans']])}
          ${Row('Density', null, 'density', [['comfortable', 'Roomy'], ['compact', 'Compact']])}
          ${Row('Hero image', 'Hide it to open straight on the engine', 'hero', [[true, 'On'], [false, 'Off']])}
        </div>
        <div className="tw-group"><span className="label">Map</span>
          ${Row('View', null, 'view', [['macro', 'Macro'], ['mine', 'Mine'], ['flat', '2D']])}
          ${Row('Auto-rotate', null, 'rotate', [[true, 'On'], [false, 'Off']])}
          ${Row('Labels', null, 'labels', [['top', 'Top 5'], ['all', 'All'], ['none', 'None']])}
          ${Row('Knock-on links', null, 'links', [[true, 'On'], [false, 'Off']])}
        </div>
        <div className="tw-group"><span className="label">Keep these settings</span>
          <p className="sub">Settings and your portfolio are saved in this browser. Copy the settings to share them or paste them into a chat.</p>
          <div className="btnrow"><button className="btn" onClick=${copy}>${copied === 'ok' ? 'Copied' : 'Copy settings'}</button><button className="btn-ghost" onClick=${() => setTw({ ...DEFAULT_TWEAKS })}>Reset to defaults</button></div>
          ${copied === 'manual' && html`<textarea className="in copybox" readOnly value=${json} onFocus=${e => e.target.select()} aria-label="Settings as JSON"></textarea>`}
        </div>
      </div>
    </aside>
  <//>`;
}

/* ---------- shell ---------- */
function Footer() {
  return html`<footer className="foot"><div className="foot-in">
    <div className="foot-brand"><${KeepMark} size=${18} /><span className="brand-name">The Red Keep</span><span className="foot-tag">Scenario Analysis Engine</span></div>
    <div className="foot-txt">
      <p>An independent take-home by Ashwin, built for Castle. Not affiliated with or endorsed by Castle.</p>
      <p>Everything here is illustrative: prices, odds, exposures, market matches and evidence readings are made up for the prototype, shaped like the real system’s inputs. Nothing here is investment advice.</p>
    </div>
  </div></footer>`;
}

function EmptyState({ onPick }) {
  return html`<section className="card empty"><span className="kicker">Nothing to analyse yet</span>
    <h2 className="h2" style=${{ marginTop: 8 }}>Add a holding, or start from a famous portfolio.</h2>
    <p className="sub">Type a ticker in the panel, or pick one of these.</p>
    <${SampleChips} sampleId=${null} onPick=${onPick} /></section>`;
}

class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (!this.state.err) return this.props.children;
    return html`<div className="wrap" style=${{ paddingBlock: 40 }}><div className="card empty"><span className="kicker">Something broke</span>
      <h2 className="h2" style=${{ marginTop: 8 }}>The keep took a hit.</h2><p className="sub">${String((this.state.err && this.state.err.message) || this.state.err)}</p>
      <div className="btnrow"><button className="btn" onClick=${() => { try { localStorage.removeItem(LS_KEY); } catch (e) { /* ignore */ } location.reload(); }}>Reset and reload</button></div></div></div>`;
  }
}

function validHoldings(h) {
  if (!Array.isArray(h)) return null;
  const out = h.filter(x => x && TICKERS[x.t] && (x.u === 'usd' || x.u === 'sh') && typeof x.a === 'number' && isFinite(x.a) && x.a >= 0)
    .map((x, i) => ({ id: String(x.id || x.t + i), t: x.t, u: x.u, a: x.a }));
  return out;
}

function App() {
  const saved = useMemo(loadSaved, []);
  const [holdings, setHoldings] = useState(() => (saved && validHoldings(saved.holdings)) || sampleToHoldings(SAMPLES[0]));
  const [sampleId, setSampleId] = useState(() => (saved && 'sampleId' in saved ? saved.sampleId : 'tech'));
  const [tw, setTw] = useState(() => ({ ...DEFAULT_TWEAKS, ...cleanTweaks(saved && saved.tweaks) }));
  const [tab, setTab] = useState(() => (saved && saved.tab === 'replay' ? 'replay' : 'analysis'));
  const [sel, setSel] = useState(null);
  const [hover, setHover] = useState(null);
  const [whatIf, setWhatIf] = useState({});
  const [live, setLive] = useState(false);
  const [liveOdds, setLiveOdds] = useState({});
  const [feed, setFeed] = useState([]);
  const [ripple, setRipple] = useState(null);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [aiOK, setAiOK] = useState(false);
  const heroRef = useRef(null);
  const pastHero = useScrolledPast(heroRef, 36, tw.hero);

  useEffect(() => { saveState({ holdings, sampleId, tweaks: tw, tab }); }, [holdings, sampleId, tw, tab]);
  useEffect(() => { let on = true; getSample().then(s => { if (on) setAiOK(!!s); }); return () => { on = false; }; }, []);
  useEffect(() => {
    const r = document.documentElement;
    if (tw.theme === 'light' || tw.theme === 'dark') r.setAttribute('data-theme', tw.theme);
    else if (HOST_THEME) r.setAttribute('data-theme', HOST_THEME); else r.removeAttribute('data-theme');
  }, [tw.theme]);

  const P = useMemo(() => analyzePortfolio(holdings), [holdings]);
  const S = useMemo(() => buildState(P, tw, liveOdds, whatIf), [P, tw.knock, tw.horizon, liveOdds, whatIf]);
  const sim = useMemo(() => { const t0 = performance.now(); const r = simulate(S, P, tw, tw.sims); r.ms = performance.now() - t0; return r; }, [S, P, tw.odds, tw.horizon, tw.sims, tw.noise]);
  const shown = useMemo(() => S.evs.filter(e => e.inH && !e.resolved && tw.tiers.includes(e.tier)).sort((a, b) => b.swing - a.swing), [S, tw.tiers]);
  const beyond = S.evs.filter(e => !e.inH).length;

  // Simulated live odds: a random walk in log-odds with a pull back to the snapshot.
  const ctx = useRef({}); ctx.current = { S, P, liveOdds };
  useEffect(() => {
    if (!live) return undefined;
    const tick = () => {
      const { S: S0, P: P0, liveOdds: prev } = ctx.current;
      const cands = S0.evs.filter(e => e.hist && !e.resolved); if (!cands.length) return;
      const e = cands[Math.floor(Math.random() * cands.length)];
      const qPrev = clamp(e.q + (prev[e.id] || 0), 0.005, 0.995);
      const z = logit(qPrev) + (Math.random() - 0.5) * 0.24 - 0.12 * (logit(qPrev) - logit(e.q));
      const q1 = clamp(sigmoid(z), 0.01, 0.99);
      const next = { ...prev, [e.id]: q1 - e.q }; ctx.current.liveOdds = next;
      const t = new Date();
      setLiveOdds(next);
      setFeed(f => [{ k: t.getTime() + e.id, id: e.id, q0: qPrev, q1, usd: (q1 - qPrev) * e.dT * P0.V / 100, time: t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) }].concat(f).slice(0, 30));
      setRipple({ id: e.id, t: performance.now() });
    };
    tick(); const id = setInterval(tick, 2200);
    return () => clearInterval(id);
  }, [live]);

  const loadSample = useCallback(id => { const s = SAMPLES.find(x => x.id === id); if (!s) return; setHoldings(sampleToHoldings(s)); setSampleId(id); setWhatIf({}); }, []);
  const editHoldings = useCallback(h => { setHoldings(h); setSampleId(null); }, []);
  const openEv = useCallback(id => setSel(id), []);
  const closeEv = useCallback(() => setSel(null), []);
  const closeTweaks = useCallback(() => setTweaksOpen(false), []);
  const resetLive = useCallback(() => { setLiveOdds({}); setFeed([]); }, []);
  // Switching views from the nav or the hero lands on the top of the app, just under the nav.
  const goTab = useCallback(k => {
    setTab(k);
    requestAnimationFrame(() => {
      const el = document.getElementById('app'); if (!el) return;
      // With the hero on, land just past it; without it the nav sits in the flow above the app.
      const navOffset = document.querySelector('.hero') ? 0 : 64;
      window.scrollTo({ top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - navOffset), behavior: REDUCED ? 'auto' : 'smooth' });
    });
  }, []);
  const selEv = sel ? S.byId[sel] : null;
  const hasLive = Object.keys(liveOdds).length > 0;

  return html`<div className=${cls('app', !tw.hero && 'no-hero')} data-accent=${tw.accent} data-heading=${tw.heading} data-density=${tw.density}>
    <${Banner} />
    <${Nav} tab=${tab} goTab=${goTab} live=${live} setLive=${setLive} openTweaks=${() => setTweaksOpen(true)} solid=${!tw.hero || pastHero} />
    ${tw.hero && html`<${Hero} tw=${tw} goTab=${goTab} heroRef=${heroRef} />`}
    <div className="wrap" id="app">
      <${Intro} tab=${tab} />
      <div className="layout">
        <aside className="side" aria-label="Portfolio">
          <${PortfolioCard} holdings=${holdings} P=${P} sampleId=${sampleId} onPick=${loadSample} onEdit=${editHoldings} />
          ${P.V > 0 && html`<${LookThrough} P=${P} />`}
          ${P.V > 0 && html`<${Exposure} P=${P} />`}
        </aside>
        <main className="main" id="main">
          ${P.V <= 0 ? html`<${EmptyState} onPick=${loadSample} />`
            : tab === 'analysis' ? html`<${AnalysisView} P=${P} S=${S} sim=${sim} shown=${shown} beyond=${beyond} tw=${tw} setTw=${setTw} hover=${hover} setHover=${setHover} sel=${sel} onOpen=${openEv} whatIf=${whatIf} setWhatIf=${setWhatIf} live=${live} setLive=${setLive} feed=${feed} ripple=${ripple} hasLive=${hasLive} resetLive=${resetLive} />`
            : html`<${ReplayView} P=${P} tw=${tw} />`}
        </main>
      </div>
    </div>
    <${Footer} />
    ${selEv && html`<${Drawer} e=${selEv} S=${S} P=${P} tw=${tw} sampleId=${sampleId} whatIf=${whatIf} setWhatIf=${setWhatIf} onOpen=${openEv} onClose=${closeEv} aiOK=${aiOK} />`}
    ${tweaksOpen && html`<${TweaksSheet} tw=${tw} setTw=${setTw} onClose=${closeTweaks} />`}
  </div>`;
}

(function boot() {
  const el = document.getElementById('root');
  if (!html || !window.ReactDOM) { el.innerHTML = '<p class="boot">The app’s libraries did not load. Check the connection and reload.</p>'; return; }
  ReactDOM.createRoot(el).render(html`<${Boundary}><${App} /><//>`);
})();

</script>
</body>
</html>
