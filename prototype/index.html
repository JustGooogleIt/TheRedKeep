    };

    const loop = now => {
      raf = 0; if (!visible) return;
      const L0 = live.current; st.frame++;
      if (st.frame % 60 === 0) readCol();
      let moving = false;
      if (L0.tw.rotate && !REDUCED && !st.drag && !L0.hover && now - st.last > 2600) { st.yaw += 0.0019; moving = true; }
      for (const e of L0.evs) {
        const tg = L0.geo.pos[e.id]; if (!tg) continue;
        let cu = st.cur[e.id];
        if (!cu) { cu = st.cur[e.id] = REDUCED ? tg.slice() : [0, 0, 0]; }
        for (let i = 0; i < 3; i++) { const d = tg[i] - cu[i]; if (Math.abs(d) > 1e-4) { cu[i] += d * 0.12; moving = true; } else cu[i] = tg[i]; }
      }
      const ta = L0.geo.arrow;
      if (!st.arrow) st.arrow = ta.slice();
      else for (let i = 0; i < 3; i++) { const d = ta[i] - st.arrow[i]; if (Math.abs(d) > 1e-4) { st.arrow[i] += d * 0.12; moving = true; } else st.arrow[i] = ta[i]; }

    io.observe(wrap);

    const hit = (x, y) => { let best = null, bd = 1e9; st.pts.forEach(p => { const d = Math.hypot(p.x - x, p.y - y); if (d < p.r + 6 && d < bd) { bd = d; best = p; } }); return best; };
    const pos = ev => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
    const onDown = ev => {
      if (ev.button != null && ev.button !== 0) return;
      const [x, y] = pos(ev); st.drag = { x, y, moved: 0 };
      try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* capture is best effort */ }
    };
    const onMove = ev => {
      const [x, y] = pos(ev);
      if (st.drag) {
        const dx = x - st.drag.x, dy = y - st.drag.y; st.drag.x = x; st.drag.y = y; st.drag.moved += Math.abs(dx) + Math.abs(dy);
        if (st.drag.moved > 4) { st.yaw += dx * 0.0085; st.pitch = clamp(st.pitch + dy * 0.006, -0.05, 1.1); st.dirty = true; st.last = performance.now(); cv.style.cursor = 'grabbing'; }
        return;
      }
      const p = hit(x, y); const id = p ? p.e.id : null; cv.style.cursor = p ? 'pointer' : 'grab';
      if (id !== live.current.hover && (id || st.hoverFromMap)) { st.hoverFromMap = !!id; live.current.setHover(id); }
    };
    const onUp = ev => {
      const d = st.drag; st.drag = null; cv.style.cursor = 'grab'; st.last = performance.now();
      try { cv.releasePointerCapture(ev.pointerId); } catch (e) { /* already released */ }
      if (d && d.moved <= 4) { const [x, y] = pos(ev); const p = hit(x, y); if (p) live.current.onOpen(p.e.id); }

    const onCancel = () => { st.drag = null; };

    cv.addEventListener('pointercancel', onCancel); cv.addEventListener('pointerleave', onLeave);

  const hv = hover ? evs.find(e => e.id === hover) : null; const V = P.V;
  return html`<div className="map-wrap" ref=${wrapRef}>
    <canvas ref=${cvRef} role="img" aria-label=${'3D map of ' + evs.length + ' events. The ranked list has the same data.'}></canvas>
    <div className="map-tip" ref=${tipRef} aria-hidden="true">${hv && html`<${Frag}><b>${hv.t}</b>
      <div className="row"><span>Odds</span><span>${fmtOdds(hv.qEff)}</span></div>
      <div className="row"><span>If it happens</span><span>${fmtUsd(hv.ifYes * V / 100, true)}</span></div>
      <div className="row"><span>If not</span><span>${fmtUsd(hv.ifNo * V / 100, true)}</span></div>
      <div className="row"><span>Swing</span><span>${swingUsd(hv.swingPct * V / 100)}</span></div><//>`}</div>
    <span className="map-hint">Drag to turn · click a dot</span>
    <div className="map-tools"><button className="btn-ghost" onClick=${() => stRef.current.reset && stRef.current.reset()}>Reset view</button></div>
  </div>`;
}

/* ---------- the flat view: impact against odds, with equal-swing curves ---------- */
function SvgDot({ x, y, r, tier, color, hl }) {
  const solid = tier === 'A' || tier === 'B';
  return html`<g>
    ${solid ? html`<circle cx=${x} cy=${y} r=${r} style=${{ fill: color, stroke: 'var(--surface)', strokeWidth: 1.5 }} />`
      : html`<circle cx=${x} cy=${y} r=${Math.max(1, r - 0.9)} style=${{ fill: color, fillOpacity: 0.14, stroke: color, strokeWidth: 1.8, strokeDasharray: tier === 'D' ? '3 2.5' : 'none' }} />`}
    ${tier === 'B' && html`<circle cx=${x} cy=${y} r=${r * 0.52} style=${{ fill: 'none', stroke: 'var(--surface)', strokeWidth: Math.max(1.2, r * 0.18) }} />`}
    ${hl && html`<circle cx=${x} cy=${y} r=${r + 4} style=${{ fill: 'none', stroke: 'var(--accent)', strokeWidth: 2 }} />`}
  </g>`;
}

function Scatter2D({ evs, hover, setHover, sel, onOpen, tw }) {
  const ref = useRef(null); const W = Math.max(300, useWidth(ref, 640)), H = Math.round(clamp(W * 0.66, 300, 440)), m = { l: 44, r: 16, t: 14, b: 44 };
  const xm = Math.max(1, ...evs.map(e => Math.abs(e.dT))) * 1.12;
  const X = v => m.l + (v + xm) / (2 * xm) * (W - m.l - m.r);
  const Y = q => H - m.b - q * (H - m.t - m.b);
  const maxSw = Math.max(1e-6, ...evs.map(e => e.swingPct));
  const R = e => 4 + 11 * Math.sqrt(e.swingPct / maxSw);
  const ranked = evs.slice().sort((a, b) => b.swing - a.swing);
  const lab = new Set((tw.labels === 'none' ? [] : ranked.slice(0, tw.labels === 'all' ? 99 : 5)).map(e => e.id));
  const levels = ranked.length ? [ranked[0].swingPct, ranked[0].swingPct / 2] : [];
  const contour = (c, s) => {
    const pts = []; for (let i = 1; i < 200; i++) { const q = i / 200; const x = s * c / Math.sqrt(q * (1 - q)); if (Math.abs(x) <= xm) pts.push(X(x).toFixed(1) + ',' + Y(q).toFixed(1)); }
    return pts.length > 1 ? 'M' + pts.join('L') : '';
  };
  const ticks = niceTicks(-xm, xm, 6);
  return html`<div className="flat" ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Events by what they would do to you and by their odds">
    ${[0, 0.25, 0.5, 0.75, 1].map(q => html`<g key=${'q' + q}><line x1=${m.l} x2=${W - m.r} y1=${Y(q)} y2=${Y(q)} style=${{ stroke: 'var(--line)' }} /><text x=${m.l - 8} y=${Y(q) + 3} textAnchor="end" className="ax">${q * 100}%</text></g>`)}
    ${ticks.map(v => html`<text key=${'x' + v} x=${X(v)} y=${H - m.b + 16} textAnchor="middle" className="ax">${fmtPct(v, 0)}</text>`)}
    <line x1=${X(0)} x2=${X(0)} y1=${m.t} y2=${H - m.b} style=${{ stroke: 'var(--line-2)' }} />
    ${levels.map((c, i) => html`<g key=${'c' + i}><path d=${contour(c, -1)} style=${{ fill: 'none', stroke: 'var(--ink-3)', strokeDasharray: '3 4', opacity: 0.55 }} /><path d=${contour(c, 1)} style=${{ fill: 'none', stroke: 'var(--ink-3)', strokeDasharray: '3 4', opacity: 0.55 }} /></g>`)}
    <text x=${m.l + 4} y=${H - 8} className="ax">← hurts you</text>
    <text x=${W - m.r} y=${H - 8} textAnchor="end" className="ax">helps you →</text>
    <text x=${(m.l + W - m.r) / 2} y=${H - 8} textAnchor="middle" className="ax">full move if it happens, % of portfolio</text>
    <text x=${m.l + 4} y=${m.t + 10} className="ax">odds ↑</text>
    ${ranked.slice().reverse().map(e => html`<g key=${e.id} className="dot" onMouseEnter=${() => setHover(e.id)} onMouseLeave=${() => setHover(null)} onClick=${() => onOpen(e.id)}>
      <${SvgDot} x=${X(e.dT)} y=${Y(e.qEff)} r=${R(e)} tier=${e.tier} color=${e.dT < 0 ? 'var(--loss)' : 'var(--gain)'} hl=${hover === e.id || sel === e.id} /></g>`)}
    ${ranked.filter(e => lab.has(e.id) || e.id === hover).map(e => { const x = X(e.dT), right = x < W - 140; return html`<text key=${'l' + e.id} x=${right ? x + R(e) + 6 : x - R(e) - 6} y=${Y(e.qEff) + 4} textAnchor=${right ? 'start' : 'end'} className=${cls('lbl', e.id === hover && 'on')}>${e.s}</text>`; })}

/* ---------- the ranked list ---------- */

    </button></li>`)}</ul>
    <p className="list-foot sub">Showing ${list.length} of ${shown.length} events in the next ${tw.horizon} months.${beyond === 1 ? ' One more resolves after that, so the simulation reprices it instead of resolving it.' : beyond > 1 ? ' ' + beyond + ' more resolve after that, so the simulation reprices them instead of resolving them.' : ''}${list.length < shown.length ? html` <button className="link" onClick=${() => setTw({ ...tw, topN: 'all' })}>Show all ${shown.length}</button>` : ''}</p>
  </section>`;

/* ---------- simulated outcomes ---------- */
function OutcomeCard({ sim, P, S, tw, onOpen }) {
  const V = P.V; const { lo, hi, bw, bins } = sim.hist; const mx = Math.max(1, ...bins);
  const hRef = useRef(null); const W = Math.max(300, useWidth(hRef, 600)), H = 180, m = { l: 8, r: 8, t: 14, b: 26 };
  const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
  const bh = c => c / mx * (H - m.t - m.b);
  const ticks = niceTicks(lo, hi, 6); const dp = ticks.length > 1 && Math.abs(ticks[1] - ticks[0]) < 1 ? 1 : 0;
  const drivers = sim.drivers.map(d => {
    const yes = d.tail >= d.base; const fb = yes ? d.base : 1 - d.base, ft = yes ? d.tail : 1 - d.tail;
    return { ...d, yes, fb, ft, lift: ft - fb };
  }).filter(d => d.lift > 0.03).sort((a, b) => b.lift - a.lift).slice(0, 3);
  return html`<section className="card" aria-labelledby="oc-h">
    <div className="card-head"><div><span className="kicker">Simulation · ${sim.n.toLocaleString('en-US')} joint scenarios</span><h3 className="h3" id="oc-h" style=${{ marginTop: 6 }}>Range of outcomes by ${horizonEnd(tw.horizon)}</h3>
      <p className="sub">Events are drawn together over the graph, so linked ones tend to happen together. ${tw.noise ? 'Includes everyday market noise.' : 'Event moves only, no everyday noise.'}</p></div></div>
    <div className="hist" ref=${hRef}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label=${'Histogram of outcomes. A 1 in 20 chance of ' + fmtPct(sim.p5) + ' or worse.'}>
      ${bins.map((c, i) => { const x0 = lo + i * bw; const tail = x0 + bw / 2 <= sim.p5; return c ? html`<rect key=${i} x=${X(x0) + 0.5} y=${H - m.b - bh(c)} width=${Math.max(0.6, X(x0 + bw) - X(x0) - 1)} height=${bh(c)} rx="1" style=${{ fill: tail ? 'var(--loss)' : 'var(--line-2)' }} />` : null; })}
      <line x1=${m.l} x2=${W - m.r} y1=${H - m.b} y2=${H - m.b} style=${{ stroke: 'var(--line-2)' }} />
      ${ticks.map(v => html`<text key=${'t' + v} x=${X(v)} y=${H - 8} textAnchor="middle" className="ax">${fmtPct(v, dp)}</text>`)}
      ${lo < 0 && hi > 0 && html`<line x1=${X(0)} x2=${X(0)} y1=${m.t} y2=${H - m.b} style=${{ stroke: 'var(--ink-3)', strokeDasharray: '2 3' }} />`}
      <line x1=${X(sim.p5)} x2=${X(sim.p5)} y1=${m.t} y2=${H - m.b} style=${{ stroke: 'var(--loss)', strokeWidth: 1.5 }} />
      <text x=${X(sim.p5) < 70 ? X(sim.p5) + 5 : X(sim.p5) - 5} y=${m.t + 8} textAnchor=${X(sim.p5) < 70 ? 'start' : 'end'} className="ax">1 in 20</text>
    </svg></div>
    <div className="stats">
      <div className="stat"><span className="label">Median</span><span className=${cls('v', tone(sim.p50))}>${fmtUsd(sim.p50 * V / 100, true)}</span></div>
      <div className="stat"><span className="label">Worst 1 in 20</span><span className=${cls('v', tone(sim.p5))}>${fmtUsd(sim.p5 * V / 100, true)}</span></div>
      <div className="stat"><span className="label">Best 1 in 20</span><span className=${cls('v', tone(sim.p95))}>${fmtUsd(sim.p95 * V / 100, true)}</span></div>
      <div className="stat"><span className="label">Worst 5% average</span><span className=${cls('v', tone(sim.es))}>${fmtUsd(sim.es * V / 100, true)}</span></div>
    </div>
    ${drivers.length > 0 && html`<ul className="drivers"><li className="label">What the worst 5% have in common</li>${drivers.map(d => html`<li key=${d.id}>
      <button className="inl" onClick=${() => onOpen(d.id)}>${S.byId[d.id].s}</button> ${d.yes ? 'happens' : 'doesn’t happen'} in <b>${pct0(d.ft)}</b> of the worst 5%, against ${pct0(d.fb)} overall.
      <div className="drv-bars" aria-hidden="true"><div className="drv-bar"><i style=${{ width: d.fb * 100 + '%', background: 'var(--ink-3)' }}></i></div><div className="drv-bar"><i style=${{ width: d.ft * 100 + '%', background: 'var(--loss)' }}></i></div></div></li>`)}</ul>`}
    <p className="note">${tw.odds === 'calibrated' ? 'With calibrated odds the average is ' + fmtPct(sim.mean, 2) + '. That is the engine’s edge over market prices, a hint rather than a forecast.' : 'The average is about zero (' + fmtPct(sim.mean, 2) + ') because market odds are already in today’s prices. What is left is the swing.'}</p>
  </section>`;
}

/* ---------- live feed / overnight changes ---------- */
function FeedCard({ live, setLive, feed, S, P, onOpen, hasLive, resetLive }) {
  const V = P.V;
  const overnight = useMemo(() => S.evs.filter(e => e.hist && e.inH && !e.resolved)
    .map(e => ({ e, dq: e.q0 - e.hist.y, usd: (e.q0 - e.hist.y) * e.dT * V / 100 }))
    .filter(x => Math.abs(x.dq) >= 0.005).sort((a, b) => Math.abs(b.usd) - Math.abs(a.usd)).slice(0, 6), [S, V]);
  return html`<section className="card" aria-labelledby="fd-h">
    <div className="card-head">
      <div><span className="kicker">${live ? 'Live · simulated odds' : 'Since yesterday'}</span><h3 className="h3" id="fd-h" style=${{ marginTop: 6 }}>${live ? 'Odds moving now' : 'What moved overnight'}</h3>
        <p className="sub">${live ? 'Each odds change is priced through your portfolio the moment it happens: the change in odds times what the event does to you.' : 'Overnight odds changes, priced for your portfolio: the change in odds times what the event does to you.'}</p></div>
      <button className=${cls('btn-ghost', live && 'on')} onClick=${() => setLive(!live)} aria-pressed=${live}><i className="dot-live"></i>${live ? 'Pause' : 'Go live'}</button>
    </div>
    ${live ? (feed.length ? html`<ul className="feed" aria-live="polite">${feed.slice(0, 8).map(f => html`<li key=${f.k}>
        <button className="inl f-t" onClick=${() => onOpen(f.id)}>${S.byId[f.id].s}</button><span className=${cls('f-v', tone(f.usd))}>${fmtUsd(f.usd, true)}</span>
        <span className="f-m">${f.time} · odds ${fmtOdds(f.q0)} → ${fmtOdds(f.q1)}</span></li>`)}</ul>` : html`<p className="sub">Waiting for the first odds change…</p>`)
      : html`<ul className="feed">${overnight.map(x => html`<li key=${x.e.id}>
        <button className="inl f-t" onClick=${() => onOpen(x.e.id)}>${x.e.s}</button><span className=${cls('f-v', tone(x.usd))}>${fmtUsd(x.usd, true)}</span>
        <span className="f-m">odds ${fmtOdds(x.e.hist.y)} → ${fmtOdds(x.e.q0)} (${fmtPts(x.dq)})</span></li>`)}</ul>`}
    ${!live && hasLive && html`<p className="list-foot sub" style=${{ marginLeft: 0 }}>Odds include your live session. <button className="link" onClick=${resetLive}>Back to snapshot odds</button></p>`}
  </section>`;
}

/* ==========================================================================
   UI · Part 3: the dragon story between the hero and the engine.
   Modelled on the manifesto on castle.tech, where a short text lights up word
   by word over knights drawn in dark green. Here the drawing is the Crimson
   Flight dragon, ported from its study (scene.js): each frame paints a
   low-resolution colour scene into an offscreen buffer, then prints it as a
   fixed grid of digits. A clock drives the wingbeats, body lift, tail wave and
   flame flicker, so they keep moving when scrolling stops; scroll moves the
   story along, grows the fire and brings the dragon up out of the dark.
   Everything the component touches is reached through refs, and every frame,
   observer and listener it starts is stopped when it unmounts.
   ========================================================================== */
// The story, in three chapters. {braces} mark the words that light up in crimson.
// Every claim matches DESIGN.md: look-through (6.1), priced in (3, 4.2), the event graph (4.4),
// the market quorum (4.6) and ranking by swing (4.3).
const DRAGON_STORY = [
  { ch: 0, text: 'Tariffs. Recessions. A surprise from the Fed. Every portfolio has {dragons}, and none of them show up on your statement.' },
  { ch: 0, text: 'You don’t really own QQQ. You own a hundred companies, a bet on interest rates and a quiet exposure to China.' },
  { ch: 0, big: true, text: 'Here be dragons.' },
  { ch: 1, text: 'Up close, every dragon is {made} {of} {numbers}: the odds that it comes, how hard it hits, and how much of that the market already expects.' },
  { ch: 1, text: 'If markets give tariffs a 40% chance, 40% of the damage is already in the price. The Red Keep counts only {the} {surprise}.' },
  { ch: 1, text: 'Dragons rarely fly alone. Tariffs make a recession likelier, so it follows the chain and counts each blow once.' },
  { ch: 1, text: 'It trusts a number only when two markets agree.' },
  { ch: 1, text: 'And it ranks every dragon by how far it could still {swing} you, not by how loud its headline is.' },
  { ch: 2, text: 'Every castle needs a {keep}: the tallest tower, the one you climb to see what’s coming.' },
  { ch: 2, big: true, text: 'This one watches for dragons.' },
];
const DRAGON_CHAPTERS = ['What you really own', 'Made of numbers', 'The keep'];
const DRAGON_STILL_PHASE = 0;          // the wing pose shown when motion is reduced
const DRAGON_DIGITS = '0123456789'.split('');
// The faint castle behind the dragon: the area of citadel.png that scene.js samples, which leaves out
// the artwork's own dragon. build.py inlines it as a data URL, so the canvas can always read it back.
const DRAGON_CITADEL = typeof RK_CITADEL === 'string' ? RK_CITADEL : 'citadel.webp';
const clamp01 = x => Math.max(0, Math.min(1, x));

/* Owns the two canvases. The drawing below follows scene.js line for line;
   only its globals became arguments (progress, clock, wing phase, brightness, image),
   plus where the dragon sits (cx, cy, as shares of the width and height; scene.js uses .5 and .57). */
function makeDragonPainter(canvas) {
  const ctx = canvas.getContext('2d', { alpha: false });
  const buffer = document.createElement('canvas'), b = buffer.getContext('2d', { willReadFrequently: true });
  const mix = (a, z, t) => a + (z - a) * t;
  let W = 0, H = 0, cols = 0, rows = 0, cell = 9;

  function resize(w, h) {
    W = w; H = h; cell = W < 650 ? 6 : 7;
    cols = Math.ceil(W / cell); rows = Math.ceil(H / (cell * 1.35));
    const d = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * d); canvas.height = Math.round(H * d); ctx.setTransform(d, 0, 0, d, 0, 0);
    buffer.width = cols; buffer.height = rows;
  }

  function shape(path, fill, stroke, width = 1) {
    const p = new Path2D(path);
    if (fill) { b.fillStyle = fill; b.fill(p); }
    if (stroke) { b.strokeStyle = stroke; b.lineWidth = width; b.stroke(p); }
  }

  // Dorsal anatomy: long neck, narrow torso, articulated wing fingers and tapered tail.
  function dragon(x, y, size, phase) {
    b.save(); b.translate(x, y); b.scale(size, size);
    // Each joint has its own phase: the shoulder drives, the wrist follows,
    // and the outer fingers flex last. The span stays open throughout the stroke.
    for (const side of [-1, 1]) {
      b.save(); b.scale(side, 1);
      const drive = Math.sin(phase), wristBeat = Math.sin(phase - .28), tipBeat = Math.sin(phase - .56);
      const elbow = { x: 35, y: -11 + drive * 12 };
      const wrist = { x: 69 + 3 * Math.cos(phase), y: -21 + wristBeat * 28 };
      const tip = { x: 143 - 7 * Math.cos(phase), y: -25 + tipBeat * 62 };
      const fingers = [tip, { x: 115, y: 22 + Math.sin(phase - .68) * 49 }, { x: 79, y: 43 + Math.sin(phase - .52) * 33 }, { x: 40, y: 36 + Math.sin(phase - .32) * 15 }];
      const [, f1, f2, f3] = fingers;
      const outline = `M 6 -4 Q 19 ${elbow.y - 6} ${elbow.x} ${elbow.y} Q 52 ${wrist.y - 8} ${wrist.x} ${wrist.y} Q 108 ${tip.y - 10} ${tip.x} ${tip.y} Q ${f1.x - 5} ${mix(tip.y, f1.y, .6)} ${f1.x} ${f1.y} Q ${f2.x + 14} ${f2.y - 20} ${f2.x} ${f2.y} Q ${f3.x + 17} ${f3.y - 16} ${f3.x} ${f3.y} Q 20 11 6 13 Z`;
      const membrane = b.createLinearGradient(12, wrist.y - 20, 90, 46);
      membrane.addColorStop(0, '#4d1735'); membrane.addColorStop(.3, '#db426a'); membrane.addColorStop(.65, '#862c50'); membrane.addColorStop(1, '#43132e');
      shape(outline, membrane, '#df799c', .7);
      b.save(); b.clip(new Path2D(outline));
      // Thin light and shadow bands move with the flexing membrane.
      for (let j = 0; j < 170; j++) { const xx = 13 + (j * 37.73) % 129, yy = -85 + (j * 13.19) % 195; b.fillStyle = j % 3 ? '#f69fb72b' : '#21071755'; b.fillRect(xx, yy, .8, 1.1); }
      for (let i = 0; i < fingers.length; i++) {
        const f = fingers[i];
        for (let j = 1; j < 5; j++) { const t = j / 5; shape(`M ${mix(8, f.x, t)} ${mix(8, f.y, t)} Q ${mix(wrist.x, f.x, t)} ${mix(wrist.y, f.y, t) + 4} ${f.x} ${f.y}`, null, '#f094b240', .55); }
      }
      b.restore();
      // The strong upper arm and four supporting fingers remain visible at every angle.
      shape(`M 6 -4 Q 19 ${elbow.y - 6} ${elbow.x} ${elbow.y} Q 52 ${wrist.y - 8} ${wrist.x} ${wrist.y} Q 108 ${tip.y - 10} ${tip.x} ${tip.y}`, null, '#efacc2', 1.7);
      for (let i = 1; i < fingers.length; i++) { const f = fingers[i]; shape(`M ${wrist.x} ${wrist.y} Q ${mix(wrist.x, f.x, .55)} ${mix(wrist.y, f.y, .55) - 5} ${f.x} ${f.y}`, null, '#ef99b4', .9); }
      shape(`M 7 5 Q 25 ${elbow.y + 7} ${elbow.x} ${elbow.y + 2} Q 53 ${wrist.y + 2} ${wrist.x} ${wrist.y}`, null, '#4c1836', 2.3);
      shape(`M ${wrist.x - 1} ${wrist.y} L ${wrist.x + 1} ${wrist.y - 9} L ${wrist.x + 5} ${wrist.y + 1}`, '#edb0c3', null);
      b.restore();
    }
    // A continuous taper follows a broad, trailing S-curve. Motion travels
    // down its length, so the tip follows the hips instead of wagging as a unit.
    function tailPoint(t) {
      const wave = phase * .58;
      // No fixed sideways bend: the entire curve crosses the centerline.
      // Increasing amplitude and delayed phase let the tip trail the hips.
      const xx = (Math.sin(wave - t * 2.6) * 30 + Math.sin(wave - t * 4.3) * 5) * t ** 1.25;
      return { x: xx, y: 28 + 57 * t - 5 * t * t + Math.cos(wave - t * 2.6) * 1.6 * t };
    }
    const spine = [], left = [], right = [];
    for (let i = 0; i <= 70; i++) {
      const t = i / 70, pt = tailPoint(t), next = tailPoint(Math.min(1, t + .002)), prev = tailPoint(Math.max(0, t - .002));
      const dx = next.x - prev.x, dy = next.y - prev.y, len = Math.hypot(dx, dy) || 1, nx = dy / len, ny = -dx / len, r = 5.4 * (1 - t) ** 1.3 + .06;
      spine.push({ ...pt, nx, ny, r, t }); left.push({ x: pt.x - nx * r, y: pt.y - ny * r }); right.push({ x: pt.x + nx * r, y: pt.y + ny * r });
    }
    b.beginPath(); left.forEach((pt, i) => (i ? b.lineTo(pt.x, pt.y) : b.moveTo(pt.x, pt.y))); right.slice().reverse().forEach(pt => b.lineTo(pt.x, pt.y)); b.closePath();
    const tailShade = b.createLinearGradient(-6, 35, 29, 78);
    tailShade.addColorStop(0, '#bd5b80'); tailShade.addColorStop(.35, '#67213f'); tailShade.addColorStop(.65, '#cc6d93'); tailShade.addColorStop(1, '#45152e');
    b.fillStyle = tailShade; b.fill(); b.strokeStyle = '#ce7d9c'; b.lineWidth = .5; b.stroke();
    // A narrow illuminated ridge and small diminishing dorsal scales.
    b.beginPath(); spine.forEach((pt, i) => (i ? b.lineTo(pt.x - pt.nx * pt.r * .2, pt.y - pt.ny * pt.r * .2) : b.moveTo(pt.x, pt.y))); b.strokeStyle = '#eea5bd'; b.lineWidth = .62; b.stroke();
    for (let i = 4; i < 59; i += 5) {
      const pt = spine[i], tp = spine[i + 2], h = (1 - pt.t) * 2.7;
      shape(`M ${pt.x} ${pt.y} L ${pt.x - pt.nx * h} ${pt.y - pt.ny * h - 1.6} L ${tp.x} ${tp.y}`, '#d78fab', null);
      shape(`M ${left[i].x} ${left[i].y} Q ${pt.x} ${pt.y + 1.5} ${right[i].x} ${right[i].y}`, null, '#f3adc642', .4);
    }
    const body = b.createLinearGradient(-9, 0, 9, 0);
    body.addColorStop(0, '#2c0b20'); body.addColorStop(.4, '#be567e'); body.addColorStop(.56, '#f4acc2'); body.addColorStop(.7, '#9a355a'); body.addColorStop(1, '#230917');
    shape('M -3 -47 C -3 -34 -8 -24 -8 -9 C -14 1 -10 18 -7 30 Q -4 39 0 40 Q 6 35 7 27 C 9 15 13 1 7 -9 C 6 -24 3 -34 3 -47 Z', body, '#bd6a8f', .6);
    // Long folded hind legs and separated hooked talons.
    for (const side of [-1, 1]) { b.save(); b.scale(side, 1); shape('M 6 15 Q 16 23 11 36 L 15 45 L 12 43 L 10 46 L 10 41 L 7 43 L 7 37 Q 8 29 4 26 Z', '#73304f', '#d98fa6', .6); b.restore(); }
    // Segmented scales and a pale dorsal ridge bring depth through the numerical shading.
    for (let j = 0; j < 24; j++) {
      const yy = -42 + j * 3.2, ww = yy < -12 ? 2.2 : yy > 27 ? 3 : 6.1;
      shape(`M ${-ww} ${yy} Q 0 ${yy + 3} ${ww} ${yy}`, null, j % 2 ? '#f29ab6' : '#662144', .44);
      shape(`M 0 ${yy} L -1.5 ${yy + 3} L 1 ${yy + 2}`, '#f2a9bd', null);
    }
    shape('M -3 -47 L -5 -53 L -3 -59 L -1 -62 L 2 -62 L 4 -58 L 5 -53 L 3 -47 Z', body, '#ed9db5', .6);
    shape('M -4 -53 L -9 -49 L -5 -59 M 4 -53 L 9 -49 L 5 -59', null, '#eaa6be', 1);
    b.fillStyle = '#ffc5ad'; b.fillRect(-3, -57, 1, .8); b.fillRect(2, -57, 1, .8);
    b.restore();
    return { x, y: y - 62 * size };
  }

  function paint({ p, clock, phase, bright, citadel, cx = .5, cy = .57 }) {
    if (!cols || !rows) return;
    b.globalAlpha = 1; b.fillStyle = '#12050c'; b.fillRect(0, 0, cols, rows);
    const sky = b.createLinearGradient(0, 0, 0, rows);
    sky.addColorStop(0, '#30111f'); sky.addColorStop(.55, '#321322'); sky.addColorStop(1, '#0c0308');
    b.fillStyle = sky; b.fillRect(0, 0, cols, rows);
    // The castle drifts slightly as you scroll (citadel is already cropped to the castle area).
    if (citadel) {
      b.save(); b.globalAlpha = .19;
      const cw = cols * 1.1, ch = rows * .78;
      b.drawImage(citadel, 0, 0, citadel.naturalWidth, citadel.naturalHeight, -cols * .04 - p * cols * .035, rows * .37 - p * rows * .025, cw, ch);
      b.globalCompositeOperation = 'multiply'; b.fillStyle = '#ba4b6d'; b.fillRect(0, rows * .37, cols, rows);
      b.restore();
    }
    const veil = b.createLinearGradient(0, rows * .35, 0, rows * .52);
    veil.addColorStop(0, '#321322'); veil.addColorStop(1, '#32132200');
    b.fillStyle = veil; b.fillRect(0, rows * .35, cols, rows * .18);
    // One finely articulated dragon holds the center while scrolling brings it closer.
    const size = Math.min(cols / 340, rows / 205) * (1 + p * .055);
    const x = cols * (cx + Math.sin(p * 2) * .012), y = rows * cy - Math.sin(clock * 2.65 - .4) * 1.25;
    const mouth = dragon(x, y, size, phase);
    const fire = clamp01((p - .08) / .77);
    if (fire > 0) {
      const length = rows * .10 + rows * .45 * fire, width = 1 + fire * 5.5;
      const glow = b.createRadialGradient(mouth.x, mouth.y - length * .55, 0, mouth.x, mouth.y - length * .55, length * .8);
      glow.addColorStop(0, '#da244744'); glow.addColorStop(1, '#da244700');
      b.fillStyle = glow; b.fillRect(0, 0, cols, rows);
      // Nested rising tongues: narrow at the mouth, billowing into a growing plume.
      for (let layer = 0; layer < 3; layer++) {
        b.beginPath(); b.moveTo(mouth.x - .65, mouth.y);
        for (let i = 0; i <= 36; i++) {
          const t = i / 36, yy = mouth.y - t * length, envelope = Math.sin(Math.PI * t * .92) * width * (1 - layer * .28);
          const curl = Math.sin(t * 12 - clock * 4 + layer) * t * 2 + Math.sin(t * 28 - clock * 6) * t;
          b.lineTo(mouth.x - envelope + curl, yy);
        }
        for (let i = 36; i >= 0; i--) {
          const t = i / 36, envelope = Math.sin(Math.PI * t * .92) * width * (1 - layer * .28);
          const curl = Math.sin(t * 12 - clock * 4 + layer) * t * 2 + Math.sin(t * 25 - clock * 5) * t;
          b.lineTo(mouth.x + envelope + curl, mouth.y - t * length);
        }
        b.closePath(); b.fillStyle = ['#a92249', '#f24b65', '#ffb39b'][layer]; b.fill();
      }
      for (let i = 0; i < 65; i++) {
        const t = (clock * .23 + i * .071) % 1, side = Math.sin(i * 9.31);
        const xx = mouth.x + side * (3 + t * width * 2) + Math.sin(clock + i) * t * 2, yy = mouth.y - t * length * 1.2;
        b.globalAlpha = (1 - t) * fire; b.fillStyle = i % 4 ? '#ef4564' : '#ffc1a5'; b.fillRect(xx, yy, .5, .7);
      }
      b.globalAlpha = 1;
    }
    // Print the buffer as digits on a grid that never moves: brighter pixels get denser digits.
    const pix = b.getImageData(0, 0, cols, rows).data;
    ctx.fillStyle = '#11040b'; ctx.fillRect(0, 0, W, H);
    ctx.font = `${cell + 1}px "Courier New",monospace`; ctx.textBaseline = 'top';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const k = (r * cols + c) * 4, R = pix[k], G = pix[k + 1], B = pix[k + 2];
        const lum = (R * .36 + G * .45 + B * .19) / 255, density = clamp01(lum * 1.6);
        const noise = ((c * 73 + r * 37) % 101) / 101;
        const digit = Math.floor(clamp01(density * .7 + noise * .3) * 9);
        const red = Math.min(255, (R * .9 + 22) * bright), green = Math.min(210, (G * .65 + 5) * bright), blue = Math.min(230, (B * .77 + 8) * bright);
        ctx.fillStyle = `rgb(${red | 0},${green | 0},${blue | 0})`;
        ctx.fillText(DRAGON_DIGITS[digit], c * cell, r * cell * 1.35);
      }
    }
  }

  return { resize, paint };
}

/* One paragraph of the story, split into words so each can light up in turn. */
function storyWords(text) {
  const out = [];
  text.split(' ').forEach((tok, i) => {
    const m = tok.match(/^([^{]*)\{([^}]+)\}(.*)$/);
    if (i) out.push(' ');
    out.push(m ? html`<span className="dragon-w" key=${i}>${m[1]}<b>${m[2]}</b>${m[3]}</span>` : html`<span className="dragon-w" key=${i}>${tok}</span>`);
  });
  return out;
}

/* The story: a tall section whose sticky, full-viewport stage holds the dragon, with the
   text gliding up over it. Scrolling the section's length runs the story from 0 to 1.
   The composition lives in the stylesheet as custom properties on .dragon, so each layout
   (wide, tall, short) sets its own; they are read again on every resize. All are shares
   of the stage: the dragon's centre, where the text column's top starts, where its last line
   ends, and the line that words light up as they rise past. */
const STORY_LOOK = { '--dragon-x': .5, '--dragon-y': .57, '--story-start': .84, '--story-end': .54, '--story-light': .78 };   // fallbacks
const STORY_DIM = .12;     // opacity of a word that has not lit up yet, as on castle.tech
function storyLook(el) {
  const cs = getComputedStyle(el), o = {};
  for (const k in STORY_LOOK) { const v = parseFloat(cs.getPropertyValue(k)); o[k] = Number.isFinite(v) ? v : STORY_LOOK[k]; }
  return { x: o['--dragon-x'], y: o['--dragon-y'], start: o['--story-start'], end: o['--story-end'], light: o['--story-light'] };
}

function DragonScene({ tw, rootRef: outerRef }) {
  // The app may pass its own ref for the section (it uses it to darken the nav over the story).
  const ownRef = useRef(null), rootRef = outerRef || ownRef;
  const stageRef = useRef(null), canvasRef = useRef(null), colRef = useRef(null);
  const barRef = useRef(null), chapterNoRef = useRef(null), chapterNameRef = useRef(null);
  const look = useRef(null); look.current = { boost: tw.glow === 'bright', citadel: tw.citadel !== false };
  const redraw = useRef(null);
  useEffect(() => { if (redraw.current) redraw.current(); }, [tw.glow, tw.citadel]);

  useEffect(() => {
    const root = rootRef.current, stage = stageRef.current, canvas = canvasRef.current, col = colRef.current;
    const bar = barRef.current, chapterNo = chapterNoRef.current, chapterName = chapterNameRef.current;
    if (!root || !stage || !canvas || !col || !canvas.getContext) return undefined;
    const painter = makeDragonPainter(canvas);
    const mq = typeof matchMedia === 'function' ? matchMedia('(prefers-reduced-motion: reduce)') : null;
    let reduce = !!(mq && mq.matches);
    let raf = 0, visible = true, dirty = true, progress = 0, goal = 0, paintedAt = -1, chapter = 0, img = null;
    let stageH = 0, travel = 1, lines = [], at = storyLook(root);

    const size = () => painter.resize(stage.clientWidth || window.innerWidth, stage.clientHeight || window.innerHeight);
    // Where each paragraph sits in the column, and how far the column travels. The section is
    // exactly as tall as that travel, so the text moves at the speed of the page.
    function layout() {
      at = storyLook(root);
      stageH = stage.clientHeight || window.innerHeight;
      lines = Array.from(col.children, el => {
        const words = Array.from(el.children);
        return { top: el.offsetTop, h: el.offsetHeight, ch: +el.dataset.ch || 0, words, shown: words.map(() => -1), k: -1 };
      });
      travel = Math.max(1, col.offsetHeight + (at.start - at.end) * stageH);
      root.style.height = Math.round(stageH + travel) + 'px';
    }
    // All layout reads happen here, once per frame, before anything is written.
    const measure = () => { goal = clamp01(-root.getBoundingClientRect().top / travel); };
    // The castle backdrop is optional: load it the first time it is switched on.
    const citadel = () => {
      if (!look.current.citadel) return null;
      if (!img) { img = new Image(); img.decoding = 'async'; img.onload = () => { dirty = true; schedule(); }; img.src = DRAGON_CITADEL; }
      return img.complete && img.naturalWidth ? img : null;
    };
    function paint(now) {
      const p = progress, clock = reduce ? 0 : now / 1000;
      // The dragon comes up out of the dark over the first half of the story, to the study's own brightness.
      const t = clamp01(p / .5), rise = .78 + .22 * t * t * (3 - 2 * t);
      painter.paint({ p, clock, phase: reduce ? DRAGON_STILL_PHASE : clock * 2.65 + p * .6, bright: (look.current.boost ? 1.35 : 1) * rise, citadel: citadel(), cx: at.x, cy: at.y });
    }
    // The text, chapter marker and progress rail follow the same eased progress as the canvas.
    function place() {
      const p = progress, y = at.start * stageH - p * travel;
      col.style.transform = `translate3d(0,${y.toFixed(1)}px,0)`;
      let n = lines.length ? lines[0].ch : 0;
      for (const L of lines) {
        const top = y + L.top;
        // The chapter is the one being read: its paragraph has risen a fifth of the stage past the light line.
        if (top < (at.light - .2) * stageH) n = L.ch;
        // Words light up in reading order as their paragraph rises past the light line.
        const k = reduce ? L.words.length : clamp01((at.light * stageH - top) / Math.max(L.h * 1.15, .2 * stageH)) * L.words.length;
        if (k === L.k) continue;
        L.k = k;
        L.words.forEach((w, i) => {
          const o = clamp01(k - i);
          if (o !== L.shown[i]) { L.shown[i] = o; w.style.opacity = o >= 1 ? '' : (STORY_DIM + (1 - STORY_DIM) * o).toFixed(3); }
        });
      }
      bar.style.transform = `scaleX(${p})`;
      if (n !== chapter) { chapter = n; chapterNo.textContent = `0${n + 1} / 03`; chapterName.textContent = DRAGON_CHAPTERS[n]; }
    }
    function frame(now) {
      raf = 0; measure();
      if (reduce) { progress = goal; dirty = false; paint(0); place(); return; }   // one still frame, no loop
      progress += (goal - progress) * .10;
      if (dirty || now - paintedAt > 30) { paintedAt = now; dirty = false; paint(now); }
      place();
      if (visible) raf = requestAnimationFrame(frame);
    }
    function schedule() { if (!raf && visible) raf = requestAnimationFrame(frame); }
    function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
    // Repaint at once after a resize, because resizing clears the canvas.
    const onResize = () => { size(); layout(); measure(); if (reduce) progress = goal; paint(reduce ? 0 : performance.now()); place(); };
    // The text reflows (a font arrives, the width changes): only the story's layout needs redoing.
    const onReflow = () => { layout(); measure(); place(); };
    const onScroll = () => { if (reduce) schedule(); };   // the running loop reads the scroll position itself
    const onMotionPref = () => { reduce = !!(mq && mq.matches); stop(); lines.forEach(L => { L.k = -1; }); dirty = true; schedule(); };
    const ro = typeof ResizeObserver === 'function'
      ? new ResizeObserver(entries => { if (entries.some(e => e.target === stage)) onResize(); else onReflow(); })
      : null;
    const io = typeof IntersectionObserver === 'function'
      ? new IntersectionObserver(entries => { visible = entries[entries.length - 1].isIntersecting; if (visible) { dirty = true; schedule(); } else stop(); })
      : null;

    size(); layout(); measure(); progress = goal; paint(reduce ? 0 : performance.now()); place();
    if (ro) { ro.observe(stage); ro.observe(col); } else window.addEventListener('resize', onResize);
    if (io) io.observe(root);
    window.addEventListener('scroll', onScroll, { passive: true });
    if (mq) { if (mq.addEventListener) mq.addEventListener('change', onMotionPref); else mq.addListener(onMotionPref); }
    redraw.current = () => { dirty = true; schedule(); };
    schedule();
    return () => {
      stop(); redraw.current = null;
      if (ro) ro.disconnect(); else window.removeEventListener('resize', onResize);
      if (io) io.disconnect();
      window.removeEventListener('scroll', onScroll);
      if (mq) { if (mq.removeEventListener) mq.removeEventListener('change', onMotionPref); else mq.removeListener(onMotionPref); }
      if (img) { img.onload = null; img = null; }
    };
  }, []);

  return html`<section className="dragon" ref=${rootRef} aria-label="Why The Red Keep starts with the dragons">
    <div className="dragon-stage" ref=${stageRef}>
      <canvas className="dragon-canvas" ref=${canvasRef} role="img" aria-label="A slender dragon drawn in crimson numbers beats its wings and breathes a plume of fire upward that grows as you scroll."></canvas>
      <div className="dragon-shade" aria-hidden="true"></div>
      <div className="dragon-copy">
        <div className="dragon-col" ref=${colRef}>
          ${DRAGON_STORY.map((b, i) => html`<p key=${i} className=${cls('dragon-p', b.big && 'big')} data-ch=${b.ch}>${storyWords(b.text)}</p>`)}
        </div>
      </div>
      <div className="dragon-hud" aria-hidden="true">
        <div className="dragon-chapter"><b ref=${chapterNoRef}>01 / 03</b><span ref=${chapterNameRef}>${DRAGON_CHAPTERS[0]}</span></div>
        <div className="dragon-rail"><i ref=${barRef}></i></div>
      </div>
    </div>
  </section>`;
}

/* ==========================================================================
   UI · Part 3: the event card, historical replay, tweaks, and the app shell.
   ========================================================================== */
const REL = { same: 'Same event', sum: 'Sum of outcomes', implies: 'Stricter market · lower bound', ladder: 'Ladder', bound: 'Bounded by related markets' };

function SplitBar({ dT, q }) {
  const ref = useRef(null);
  const W = Math.max(280, useWidth(ref, 520)), a = 8, b = W - 8, x1 = a + q * (b - a);
  return html`<div className="split" ref=${ref}><svg viewBox=${'0 0 ' + W + ' 62'} role="img" aria-label=${'Of the full ' + fmtPct(dT) + ' move, ' + fmtPct(q * dT) + ' is already priced in and ' + fmtPct((1 - q) * dT) + ' would still be a surprise.'}>
    <defs><pattern id="rk-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" style=${{ fill: 'var(--ink-3)', opacity: 0.6 }} /></pattern></defs>
    <text x=${a} y="11" className="ax">Full move if it happens · ${fmtPct(dT)}</text>
    <rect x=${a} y="20" width=${Math.max(0, x1 - a - 1)} height="16" rx="2" style=${{ fill: 'url(#rk-hatch)' }} />
    <rect x=${x1 + 1} y="20" width=${Math.max(0, b - x1 - 1)} height="16" rx="2" style=${{ fill: dT < 0 ? 'var(--loss)' : 'var(--gain)' }} />
    <text x=${a} y="54" className="ax">Priced in at ${fmtOdds(q)} · ${fmtPct(q * dT)}</text>
    <text x=${b} y="54" textAnchor="end" className="ax">Surprise if it happens · ${fmtPct((1 - q) * dT)}</text>
  </svg></div>`;
}

function Spark({ h, now, from }) {
  const ref = useRef(null);
  const W = Math.max(280, useWidth(ref, 520)), H = 72, n = h.length; const lo = Math.min(...h, now), hi = Math.max(...h, now); const pad = Math.max(0.01, (hi - lo) * 0.15);
  const X = i => 6 + i / (n - 1) * (W - 12); const Y = v => 6 + (1 - (v - lo + pad) / (hi - lo + 2 * pad)) * (H - 28);
  const d = h.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(i === n - 1 ? now : v).toFixed(1)).join('');
  return html`<div className="spark" ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label=${'Odds from ' + (from || '120 days ago') + ', ' + fmtOdds(h[0]) + ', to today, ' + fmtOdds(now)}>
    <path d=${d} style=${{ fill: 'none', stroke: 'var(--ink-2)', strokeWidth: 1.5, strokeLinejoin: 'round' }} />
    <circle cx=${X(n - 2)} cy=${Y(h[n - 2])} r="2.5" style=${{ fill: 'var(--ink-3)' }} />
    <circle cx=${X(n - 1)} cy=${Y(now)} r="3.5" style=${{ fill: 'var(--accent)' }} />
    <text x="6" y=${H - 4} className="ax">${from || '120 days ago'} · ${fmtOdds(h[0])}</text>
    <text x=${W - 6} y=${H - 4} textAnchor="end" className="ax">Today · ${fmtOdds(now)}</text>
  </svg></div>`;
}

function ErrBar({ k, s, market }) {
  const X = v => 6 + clamp(v / 2, 0, 1) * 188;
  return html`<svg viewBox="0 0 200 22" aria-hidden="true">
    <line x1="6" x2="194" y1="11" y2="11" style=${{ stroke: 'var(--line)' }} />

    <line x1=${X(k - s)} x2=${X(k + s)} y1="11" y2="11" style=${{ stroke: 'var(--ink-2)', strokeWidth: 2 }} />
    <line x1=${X(k - s)} x2=${X(k - s)} y1="7" y2="15" style=${{ stroke: 'var(--ink-2)', strokeWidth: 1.5 }} />
    <line x1=${X(k + s)} x2=${X(k + s)} y1="7" y2="15" style=${{ stroke: 'var(--ink-2)', strokeWidth: 1.5 }} />

function verdictText(f) {
  const vague = Math.max((f.nAll ?? f.nMarket) - f.nMarket, 0);
  if (f.agree === false && f.dof) return html`<span className="mk bad">!</span><p><b>Market readings disagree.</b> χ² ${f.chi2.toFixed(1)} is over the 5% cutoff of ${f.crit}. The engine shows the event as contested instead of averaging the gap away.</p>`;
  if (f.nMarket >= 2 && f.agree) return html`<span className="mk ok">✓</span><p><b>Market readings agree.</b> χ² ${f.chi2.toFixed(2)} is under the 5% cutoff of ${f.crit}, so the fused jump stands.</p>`;
  if (f.nMarket >= 2) return html`<span className="mk mid">≈</span><p><b>Market readings of different factors.</b> They don’t share a factor, so they can’t check each other yet and the jump is provisional.</p>`;
  if (f.nMarket === 1 && vague) return html`<span className="mk mid">≈</span><p><b>One precise market reading.</b> The ${vague === 1 ? 'other market reading’s error bar is' : 'other market readings’ error bars are'} over half the jump, too wide to confirm it, so the jump is provisional.</p>`;
  if (f.nMarket === 1) return html`<span className="mk mid">≈</span><p><b>One market reading.</b> Nothing to cross-check it against yet, so the jump is provisional.</p>`;
  if (vague) return html`<span className="mk mid">≈</span><p><b>${vague === 1 ? 'One market reading, too vague to count.' : 'Market readings too vague to count.'}</b> ${vague === 1 ? 'Its error bar is' : 'Their error bars are'} over half the jump, too wide to confirm it, so the jump is provisional.</p>`;
  return html`<span className="mk mid">≈</span><p><b>No market readings.</b> The jump comes from past events and the AI prior only.</p>`;
}

function Explain({ e, P, q, ifYes, ifNo }) {
  const [st, setSt] = useState({ s: 'idle', text: '' });
  const ctl = useRef(null);
  useEffect(() => { if (ctl.current) ctl.current.abort(); setSt({ s: 'idle', text: '' }); }, [e.id]);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  const go = async () => {
    const sample = await getSample(); if (!sample) { setSt({ s: 'off', text: '' }); return; }
    if (ctl.current) ctl.current.abort(); const ac = new AbortController(); ctl.current = ac;
    setSt({ s: 'think', text: '' });
    const hold = P.rows.slice().sort((a, b) => b.w - a.w).slice(0, 6).map(r => r.t + ' ' + (r.w * 100).toFixed(0) + '%').join(', ');
    const top = P.look.filter(o => o.kind === 'stock').slice(0, 5).map(o => o.name + ' ' + (o.w * 100).toFixed(1) + '%').join(', ');
    const drivers = e.contrib.slice(0, 4).map(c => c.name + ' ' + fmtPct(c.c, 2)).join('; ');
    const prompt = [
      'You explain one result from a portfolio scenario engine to the person who owns the portfolio.',
      'Write 3 or 4 short sentences of plain English: no lists, no headings, no preamble.',
      'Say why this event moves this portfolio the way the numbers say, which holdings or exposures drive it, and one thing worth watching. Use only the numbers given. Do not give advice to buy or sell.',
      '',
      'Portfolio (' + fmtUsdFull(P.V) + '): ' + hold + '. Largest look-through companies: ' + (top || 'none') + '.',
      'Event: ' + e.t + ', resolves ' + fmtDate(e.date) + '. Odds ' + fmtOdds(q) + '.',
      'Full move if it happens: ' + fmtPct(e.dT, 2) + ' of the portfolio (direct ' + fmtPct(e.dD, 2) + ', knock-on effects through other events ' + fmtPct(e.dT - e.dD, 2) + ').',
      'Net of what the odds already price in: ' + fmtPct(ifYes, 2) + ' if it happens, ' + fmtPct(ifNo, 2) + ' if it does not.',
      'Biggest drivers (exposure times the factor move): ' + drivers + '.',
      'Background: ' + e.why,
    ].join('\n');
    try {
      const r = await sample(prompt, { modelTier: 'quick', signal: ac.signal, onText: ({ text }) => setSt({ s: 'stream', text }) });
      if (!ac.signal.aborted) setSt({ s: 'done', text: r.text });
    } catch (err) {
      const code = err && err.code;
      if (code === 'cancelled' || ac.signal.aborted) return;
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'capability_disabled' || code === 'not_declared') setSt({ s: 'off', text: '' });
      else if (code === 'rate_limited' || code === 'queue_overflow') setSt({ s: 'err', text: 'Claude is busy right now. Try again in a minute.' });
      else setSt({ s: 'err', text: (err && err.text) || 'Claude could not answer this time.' });
    }
  };
  if (st.s === 'off') return null;
  const busy = st.s === 'think' || st.s === 'stream';
  return html`<div style=${{ marginTop: 14 }}>
    ${busy ? html`<button className="btn-ghost" onClick=${() => { if (ctl.current) ctl.current.abort(); setSt({ s: 'idle', text: '' }); }}>Stop</button>`
      : html`<button className="btn-ghost" onClick=${go}>${st.s === 'idle' ? 'Explain for my portfolio' : 'Explain again'}</button>`}
    ${st.s === 'think' && html`<p className="ai-out sub">Thinking…</p>`}
    ${st.text && html`<p className=${cls('ai-out', st.s === 'err' && 'sub')} aria-live="polite">${st.text}</p>`}
  </div>`;
}

/* A backend snapshot checks the related prices against the rules of probability (DESIGN.md 6.6). */
function cohText(c) {
  if (!c.flags.length) return html`<span className="mk ok">✓</span><p><b>Related prices add up.</b> ${c.n === 1 ? 'One check' : c.n + ' checks'} against the rules of probability, all within the markets’ spreads.</p>`;
  return html`<span className="mk bad">!</span><p><b>Related prices don’t add up.</b> ${c.flags.join(' ')} ${c.contested
    ? 'The odds rest on these prices, so the event counts as contested.'
    : 'The odds don’t rest on these prices, so they stand, but one of the related markets is probably mispriced.'}</p>`;
}

/* If a parent at odds q happens, a child's odds move by w · (1 − q): w is P(child | parent) − P(child | not parent). */
function knockPts(w, q) { const p = Math.round(Math.abs(w) * (1 - q) * 100); return p + (p === 1 ? ' point' : ' points'); }
function capNote(e, other) { const n = e.coh && e.coh.caps && e.coh.caps[other]; return n ? html`<span className="sub" style=${{ display: 'block' }}>${n}</span>` : ''; }

  return html`<${Frag}>

            <div>if it happens: (1 − ${q.toFixed(2)}) × ${fmtPct(e.dT, 2)} = ${fmtPct(ifYes, 2)}</div>
            <div>if it doesn’t: ${MINUS}${q.toFixed(2)} × ${fmtPct(e.dT, 2)} = ${fmtPct(ifNo, 2)}</div>

          ${sampleId === 'qqq' && e.id === 'tariff' && html`<p className="note">This is the worked example in DESIGN.md section 3: a −8.5% full move, −5.1% if it happens and +3.4% if it doesn’t.</p>`}

            <table className="cmp"><thead><tr><th></th><th>The event</th><th>The market</th><th></th></tr></thead><tbody>${e.m.cmp.map(([k, a, b, s]) => html`<tr key=${k}><td className="label">${k}</td><td>${a}</td><td>${b}</td><td><span className=${'mk ' + ['bad', 'mid', 'ok'][s]} title=${['Differs', 'Close', 'Same'][s]}>${['✕', '≈', '✓'][s]}</span></td></tr>`)}</tbody></table>
            ${e.m.ladder && html`<p className="sub">${e.m.ladder}</p>`}
