<style>
:root {
  /* UI layer read from castle.tech: grey canvas, flat white cards, hairlines, Hedvig serif
     headings, Geist Mono buttons and labels, a floating glass nav, dark banner and footer.
     The Red Keep's twist: a dragon-red accent and warm maroon darks. */
  --bg: #F5F5F5; --surface: #FFFFFF; --surface-2: #FAFAFA; --sunk: #F0F0F0;
  --line: #E5E5E5; --line-2: #D4D4D4; --ghost: #A2A2A2;
  --ink: #171717; --ink-2: #525252; --ink-3: #737373;
  --acc-dragon: #B4141F; --acc-ember: #C2410C; --acc-teal: #00544F; --acc-steel: #3A5C9A;
  --hi-dragon: #F2555A; --hi-ember: #F08A4B; --hi-teal: #58BDB2; --hi-steel: #8FAEEA;
  --gain: #395938; --loss: #7C4632;
  --tA: #00544F; --tB: #3A5C9A; --tC: #5E9586; --tD: #A3A3A3;
  --band: #171717; --band-ink: #F5F5F5; --band-ink-2: #D5D5D5; --band-ink-3: #A3A3A3; --band-line: rgba(255, 255, 255, .1);
  --glass: rgba(255, 255, 255, .62);
  --card-line: transparent;
  --scrim: rgba(24, 8, 10, .32);
  --shadow-panel: 0 14px 36px rgba(60, 8, 12, .16), 0 2px 6px rgba(60, 8, 12, .08);
  --shadow-btn: 0 1px 3px rgba(23, 23, 23, .12);
  --f-display: "Hedvig Letters Serif", "Iowan Old Style", Georgia, serif;
  --f-body: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r1: 4px; --r2: 8px; --r3: 10px;
  --gap: 20px; --pad: 24px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120C0D; --surface: #1B1415; --surface-2: #211819; --sunk: #2A2021;
    --line: #302627; --line-2: #463A3C; --ghost: #5E5052;
    --ink: #F3EDED; --ink-2: #C7BBBB; --ink-3: #94888A;
    --acc-dragon: #F2555A; --acc-ember: #F08A4B; --acc-teal: #58BDB2; --acc-steel: #8FAEEA;
    --gain: #8DBE8A; --loss: #E0916F;
    --tA: #58BDB2; --tB: #8FAEEA; --tC: #84B6A7; --tD: #6E6264;
    --band: #0B0607; --band-line: rgba(255, 255, 255, .08);
    --glass: rgba(27, 20, 21, .66);
    --card-line: rgba(255, 255, 255, .06);
    --scrim: rgba(0, 0, 0, .55);
    --shadow-panel: 0 14px 36px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
    --shadow-btn: 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #120C0D; --surface: #1B1415; --surface-2: #211819; --sunk: #2A2021;
  --line: #302627; --line-2: #463A3C; --ghost: #5E5052;
  --ink: #F3EDED; --ink-2: #C7BBBB; --ink-3: #94888A;
  --acc-dragon: #F2555A; --acc-ember: #F08A4B; --acc-teal: #58BDB2; --acc-steel: #8FAEEA;
  --gain: #8DBE8A; --loss: #E0916F;
  --tA: #58BDB2; --tB: #8FAEEA; --tC: #84B6A7; --tD: #6E6264;
  --band: #0B0607; --band-line: rgba(255, 255, 255, .08);
  --glass: rgba(27, 20, 21, .66);
  --card-line: rgba(255, 255, 255, .06);
  --scrim: rgba(0, 0, 0, .55);
  --shadow-panel: 0 14px 36px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
  --shadow-btn: 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

/* Tweakable look: accent, heading face and density live on the app root. */
.app { --accent: var(--acc-dragon); --accent-hi: var(--hi-dragon); }
.app[data-accent="ember"] { --accent: var(--acc-ember); --accent-hi: var(--hi-ember); }
.app[data-accent="teal"] { --accent: var(--acc-teal); --accent-hi: var(--hi-teal); }
.app[data-accent="steel"] { --accent: var(--acc-steel); --accent-hi: var(--hi-steel); }
.app { --accent-soft: color-mix(in srgb, var(--accent) 8%, transparent); --accent-line: color-mix(in srgb, var(--accent) 38%, transparent); }
.app[data-heading="sans"] { --f-display: var(--f-body); }
.app[data-density="compact"] { --gap: 12px; --pad: 15px; }

* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.55 var(--f-body); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--band); }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.boot { font: 500 13px/1.5 var(--f-mono); color: var(--ink-3); padding: 48px 16px; text-align: center; }

/* ---------- type ---------- */
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font: 500 10px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.kicker { display: block; font: 600 12.5px/1.3 var(--f-mono); letter-spacing: -.01em; color: var(--ink-3); }
.display { font-family: var(--f-display); font-weight: 400; letter-spacing: -.015em; text-wrap: balance; }
.h2 { font-family: var(--f-display); font-weight: 400; font-size: 25px; line-height: 1.18; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.h3 { font-family: var(--f-display); font-weight: 400; font-size: 20px; line-height: 1.25; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.sub { color: var(--ink-2); font-size: 13.5px; line-height: 1.6; margin: 8px 0 0; max-width: 68ch; }
.neg { color: var(--loss); }
.pos { color: var(--gain); }
.faint { color: var(--ink-3); opacity: .7; }
.pill { display: inline-flex; align-items: center; font: 500 10px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: var(--r1); background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.pill-acc { background: var(--accent-soft); color: var(--accent); }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.inl { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.inl:hover { text-decoration-color: var(--accent); }

/* ---------- buttons and controls (Castle: Geist Mono 600, 4px radius) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 13px/1.2 var(--f-mono); letter-spacing: -.02em; background: var(--ink); color: var(--surface); border: 1px solid var(--ink); border-radius: var(--r1); padding: 10px 18px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, box-shadow .15s; }
.btn:hover { background: color-mix(in srgb, var(--ink) 84%, var(--surface)); border-color: color-mix(in srgb, var(--ink) 84%, var(--surface)); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-light { background: #FFFFFF; color: #171717; border-color: #FFFFFF; box-shadow: var(--shadow-btn); }
.btn-light:hover { background: #ECECEC; border-color: #ECECEC; }
.btn-outline-light { background: transparent; color: #FFFFFF; border-color: rgba(255, 255, 255, .55); }
.btn-outline-light:hover { background: rgba(255, 255, 255, .1); border-color: #FFFFFF; }
.btn-sm { padding: 7px 14px; }
.btn-lg { padding: 13px 24px; font-size: 14px; }
.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 13px/1.2 var(--f-mono); letter-spacing: -.02em; background: transparent; color: var(--ink); border: 1px solid var(--ghost); border-radius: var(--r1); padding: 8px 14px; cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s, color .15s; }
.btn-ghost:hover { border-color: var(--ink); }
.btn-ghost.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.dot-live { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .5; display: inline-block; flex: none; }
.on > .dot-live { background: var(--accent); opacity: 1; animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--accent-line); } 100% { box-shadow: 0 0 0 7px transparent; } }

.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r1); overflow: hidden; flex-wrap: nowrap; max-width: 100%; background: var(--surface); }
.seg button { font: 500 12px/1 var(--f-mono); letter-spacing: -.01em; padding: 8px 11px; background: none; border: 0; color: var(--ink-3); cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--ink); color: var(--surface); }

.in { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r1); padding: 9px 11px; font-size: 13px; min-width: 0; width: 100%; }
.in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.in::placeholder { color: var(--ink-3); }

/* ---------- banner, floating glass nav ---------- */
.banner { background: var(--band); color: var(--band-ink-2); font: 500 12px/1.4 var(--f-mono); letter-spacing: -.01em; text-align: center; padding: 11px max(16px, env(safe-area-inset-right, 0px)) 11px max(16px, env(safe-area-inset-left, 0px)); }
.banner-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-hi); margin-right: 10px; vertical-align: 1px; }
.banner-x { color: var(--band-ink-3); }
.banner-btn { margin-left: 12px; padding: 2px 9px; border: 1px solid currentColor; border-radius: 999px; background: none; color: var(--band-ink-2); font: inherit; cursor: pointer; }
.banner-btn:hover { color: var(--accent-hi); }
.banner-btn:focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; }

.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--nav-h); padding: 12px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.nav-in { pointer-events: auto; max-width: 1408px; margin: 0 auto; display: flex; align-items: center; gap: 8px 18px; padding: 7px 7px 7px 14px; border-radius: 6px; color: #FFFFFF; background: rgba(22, 9, 11, .34); border: 1px solid rgba(255, 255, 255, .1); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .25s, color .25s, border-color .25s, box-shadow .25s; }
.nav.scrolled .nav-in { color: var(--ink); background: var(--glass); border-color: var(--line); box-shadow: 0 8px 24px rgba(60, 8, 12, .07); }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; flex: none; }
.keep { fill: var(--accent); display: block; }
.nav:not(.scrolled) .keep, .foot .keep { fill: var(--accent-hi); }
.brand-name { font-family: var(--f-display); font-size: 19px; letter-spacing: -.01em; white-space: nowrap; }
.tabs { display: flex; gap: 2px; }
.tab { font: 500 14px/1 var(--f-mono); letter-spacing: -.02em; color: inherit; opacity: .74; background: none; border: 0; padding: 9px 12px; border-radius: var(--r1); cursor: pointer; white-space: nowrap; }
.tab:hover { opacity: 1; }
.tab.on { opacity: 1; background: rgba(255, 255, 255, .16); }
.nav.scrolled .tab.on { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.t-short { display: none; }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.nav-live { display: inline-flex; align-items: center; gap: 8px; font: 500 14px/1 var(--f-mono); letter-spacing: -.02em; color: inherit; background: none; border: 0; padding: 9px 12px; border-radius: var(--r1); cursor: pointer; opacity: .85; white-space: nowrap; }
.nav-live:hover, .nav-live.on { opacity: 1; }
.nav:not(.scrolled) .nav-live.on > .dot-live { background: var(--accent-hi); }
/* Three tabs and the live-odds switch fit in full down to about 960px. Below that the tabs take their
   short names, and below 820px the switch leaves the nav (the overnight card keeps its own). */
@media (max-width: 960px) { .t-long { display: none; } .t-short { display: inline; } }
@media (max-width: 820px) { .nav-live { display: none; } }

/* ---------- hero: full-bleed image, centred copy at the foot ---------- */
.hero { position: relative; margin-top: calc(-1 * var(--nav-h)); height: clamp(540px, 86vh, 820px); background: #1A0B0D; color: #FFFFFF; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
.hero-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 8, 10, .62) 0%, rgba(20, 8, 10, .14) 17%, rgba(20, 8, 10, 0) 32%, rgba(20, 8, 10, .16) 50%, rgba(20, 8, 10, .78) 78%, rgba(20, 8, 10, .92) 100%); }
.hero-copy { position: relative; z-index: 1; text-align: center; max-width: 860px; padding: 0 max(20px, env(safe-area-inset-right, 0px)) clamp(40px, 7vh, 76px) max(20px, env(safe-area-inset-left, 0px)); }
.hero-eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 500 13px/1.4 var(--f-mono); letter-spacing: -.01em; color: rgba(255, 255, 255, .8); }
.hero-eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--accent-hi); }
.hero-eyebrow::after { content: ""; width: 18px; height: 1px; background: var(--accent-hi); }
.hero-h { font-family: var(--f-display); font-weight: 400; font-size: clamp(42px, 5.6vw, 74px); line-height: 1.05; letter-spacing: -.02em; margin: 14px 0 0; text-wrap: balance; color: #FFFFFF; text-shadow: 0 2px 30px rgba(20, 8, 10, .35); }
.hero-sub { font: 500 18px/1.5 var(--f-body); color: rgba(255, 255, 255, .86); margin: 16px auto 0; max-width: 54ch; text-wrap: pretty; }
.hero-cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }

/* ---------- dragon story (ui-dragon.js), between the hero and the app. Every rule is scoped to .dragon. ----------
   Modelled on the manifesto on castle.tech: a sticky full-viewport stage with the text gliding
   up over the drawing and lighting up word by word. The palette is the Crimson Flight study's;
   the type is the site's. The custom properties place the dragon and the text (shares of the
   stage); ui-dragon.js reads them on every resize, and sets the section's height to match. */
.dragon { --dragon-x: .6; --dragon-y: .57; --story-start: .84; --story-end: .54; --story-light: .78;
  position: relative; height: 340vh; background: #13040A; color: #F6E9E4; }
.dragon .dragon-stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; background: #16050D; }
.dragon .dragon-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* A little darker on the left, where the text runs; the dragon keeps its colour. */
.dragon .dragon-shade { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(90deg, #13040AB3 0%, #13040A80 26%, #13040A1F 44%, #13040A00 54%),
    linear-gradient(180deg, #13040A80, #13040A00 18%, #13040A00 82%, #13040A99); }
/* The column is moved by script; the mask fades it in at the bottom and out under the nav. */
.dragon .dragon-copy { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, transparent 8%, #000 24%, #000 80%, transparent 90%);
  mask-image: linear-gradient(180deg, transparent 8%, #000 24%, #000 80%, transparent 90%); }
.dragon .dragon-col { position: absolute; top: 0; left: 8%; width: min(520px, 38%); will-change: transform; }
.dragon .dragon-p { font: 500 21px/1.5 var(--f-mono); letter-spacing: -.03em; color: #F6E9E4; margin: 0 0 1.5em; text-wrap: pretty; text-shadow: 0 1px 2px #16020D, 0 0 18px #16020D; }
.dragon .dragon-p.big { font-family: var(--f-display); font-weight: 400; font-size: clamp(40px, 4.6vw, 68px); line-height: 1.04; letter-spacing: -.02em; color: #FFF4EF; margin: .5em 0 .85em; width: 140%; text-wrap: balance; text-shadow: 0 2px 26px #16020D; }
.dragon .dragon-p:last-child { margin-bottom: 0; }
.dragon .dragon-p b { font-weight: inherit; color: #FF5A78; }
.dragon .dragon-hud { position: absolute; inset: 0; pointer-events: none; font: 500 10px/1.5 var(--f-mono); letter-spacing: .2em; text-transform: uppercase; }
.dragon .dragon-chapter { position: absolute; bottom: 41px; left: 4%; right: calc(4% + 150px); display: flex; gap: 24px; color: #C3A0A9; white-space: nowrap; }
.dragon .dragon-chapter b { font-weight: 500; color: #F23B61; }
.dragon .dragon-chapter span { overflow: hidden; text-overflow: ellipsis; }
.dragon .dragon-rail { position: absolute; right: 4%; bottom: 47px; width: 120px; height: 2px; background: #69404E; }
.dragon .dragon-rail i { display: block; height: 100%; background: #EF3458; transform-origin: 0 50%; transform: scaleX(0); }
/* Narrower landscape screens: the dragon moves in a little and the column widens. */
@media (max-width: 1180px) and (min-aspect-ratio: 1/1) {
  .dragon { --dragon-x: .58; }
  .dragon .dragon-col { left: 7%; width: 42%; }
  .dragon .dragon-p { font-size: 18px; }
}
/* Tall screens (phones, tablets held upright): the dragon flies in the upper half and the
   story reads underneath it, centred, like subtitles. */
@media (max-aspect-ratio: 1/1) {
  .dragon { --dragon-x: .5; --dragon-y: .36; --story-start: .97; --story-end: .72; --story-light: .92; }
  .dragon .dragon-shade { background: linear-gradient(180deg, #13040A99, #13040A00 16%, #13040A00 44%, #13040AC7 60%, #13040AEB 76%, #13040AF2); }
  .dragon .dragon-copy { -webkit-mask-image: linear-gradient(180deg, transparent 50%, #000 61%, #000 87%, transparent 93%);
    mask-image: linear-gradient(180deg, transparent 50%, #000 61%, #000 87%, transparent 93%); }
  .dragon .dragon-col { left: max(8%, calc(50% - 310px)); width: min(84%, 620px); text-align: center; }
  .dragon .dragon-p { font-size: clamp(16px, 2.6vw, 23px); }
  .dragon .dragon-p.big { width: auto; font-size: clamp(36px, 6.4vw, 60px); }
}
@media (max-width: 650px) {
  .dragon .dragon-col { left: 6%; width: 88%; }
  .dragon .dragon-p { font-size: 16px; line-height: 1.5; letter-spacing: -.02em; }
  .dragon .dragon-p.big { font-size: 36px; }
  .dragon .dragon-hud { font-size: 8px; }
  .dragon .dragon-chapter { left: 6%; right: calc(6% + 86px); gap: 12px; bottom: 30px; }
  .dragon .dragon-rail { right: 6%; width: 70px; bottom: 33px; }
}
/* Short windows, such as a phone held sideways: smaller type and a lower HUD. */
@media (max-height: 560px) and (min-aspect-ratio: 1/1) {
  .dragon { --story-end: .56; }
  .dragon .dragon-copy { -webkit-mask-image: linear-gradient(180deg, transparent 16%, #000 30%, #000 80%, transparent 88%);
    mask-image: linear-gradient(180deg, transparent 16%, #000 30%, #000 80%, transparent 88%); }
  .dragon .dragon-p { font-size: 15px; }
  .dragon .dragon-p.big { font-size: clamp(30px, 4.4vw, 44px); }
  .dragon .dragon-chapter { bottom: 20px; }

}

/* ---------- page ---------- */
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { scroll-margin-top: calc(var(--nav-h) + 4px); }
.intro { text-align: center; padding-block: 84px 34px; max-width: 900px; margin: 0 auto; }
.no-hero .intro { padding-top: 32px; }
.heading-xl { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 3.4vw, 40px); line-height: 1.2; letter-spacing: -.01em; color: var(--ink-2); margin: 0; text-wrap: balance; }
.heading-xl .accent { color: var(--accent); }
.intro-sub { font-size: 16px; line-height: 1.6; color: var(--ink-2); margin: 14px auto 0; max-width: 62ch; text-wrap: pretty; }
.intro-link { margin-top: 16px; font: 600 13px/1.2 var(--f-mono); letter-spacing: -.02em; }

.layout { display: grid; grid-template-columns: 372px minmax(0, 1fr); gap: 24px; align-items: start; padding-bottom: 72px; }
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--nav-h) + 12px); max-height: calc(100vh - var(--nav-h) - 24px); overflow: auto; display: flex; flex-direction: column; gap: var(--gap); scrollbar-width: thin; padding-bottom: 4px; }
.main { min-width: 0; display: flex; flex-direction: column; gap: var(--gap); container-type: inline-size; }
@media (max-width: 1100px) { .layout { grid-template-columns: minmax(0, 1fr); } .side { position: static; max-height: none; overflow: visible; } }

.card { background: var(--surface); border: 1px solid var(--card-line); border-radius: var(--r1); padding: var(--pad); min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 16px; margin-bottom: 20px; flex-wrap: wrap; }
.card-head > div:first-child { min-width: 0; flex: 1 1 240px; }
.duo { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap); align-items: start; }
@container (min-width: 980px) {
  .duo { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  /* The map follows you down the long event list, so hovering a row lights its dot. */
  .duo > .map-card { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--nav-h) + 12px); }
}

/* ---------- sidebar ---------- */
.side-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.side-total { text-align: right; }
.num-lg { display: block; font-family: var(--f-display); font-size: 27px; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
.samples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.sample { border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r1); padding: 8px 12px; cursor: pointer; text-align: left; line-height: 1.2; transition: border-color .15s, background .15s; }
.sample:hover { border-color: var(--ink-3); }
.sample.on { border-color: var(--accent); background: var(--accent-soft); }
.sample b { display: block; font-weight: 500; font-size: 13px; }
.sample span { display: block; font: 500 10.5px/1.3 var(--f-mono); letter-spacing: -.01em; color: var(--ink-3); margin-top: 4px; }
.sample-note { font-size: 13px; color: var(--ink-2); margin: 14px 0 0; line-height: 1.55; }

.holds { margin-top: 18px; border-top: 1px solid var(--line); }
.hold { display: grid; grid-template-columns: minmax(0, 1fr) 118px 62px 22px; gap: 8px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.hold-tk { min-width: 0; }
.tk { font-family: var(--f-mono); font-weight: 600; font-size: 12.5px; letter-spacing: 0; }
.tk-name { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.amt-box { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: var(--r1); background: var(--surface); }
.amt-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.amt-box input { width: 100%; min-width: 0; border: 0; background: none; padding: 6px 4px 6px 8px; font: 500 12.5px var(--f-mono); text-align: right; }

.unit { border: 0; border-left: 1px solid var(--line-2); background: var(--surface-2); font: 500 11px/1 var(--f-mono); color: var(--ink-3); padding: 0 8px; align-self: stretch; cursor: pointer; border-radius: 0 var(--r1) var(--r1) 0; }
.unit:hover { color: var(--ink); }
.hold-v { text-align: right; line-height: 1.2; }
.hold-v b { display: block; font: 500 12.5px var(--f-mono); }
.hold-v span { font: 400 10.5px var(--f-mono); color: var(--ink-3); }
.x { width: 24px; height: 24px; border-radius: var(--r1); border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 17px; line-height: 1; flex: none; }
.x:hover { background: var(--sunk); color: var(--ink); }

.add { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 16px; }
.add .ac { position: relative; }
.add-row2 { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.ac-list { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 6px); list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--card-line); border-radius: var(--r3); box-shadow: var(--shadow-panel); }
.ac-list li { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px; border-radius: var(--r1); cursor: pointer; }

.ac-name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ac-px { font-size: 11px; color: var(--ink-3); }
.hint { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.universe { margin-top: 16px; font-size: 12.5px; color: var(--ink-3); }
.universe summary { cursor: pointer; }
.universe p { margin: 6px 0 0; font-family: var(--f-mono); font-size: 11px; line-height: 1.7; word-spacing: 4px; }

.lt-list { list-style: none; margin: 0; padding: 0; }
.lt-list > li { padding: 13px 0; border-top: 1px solid var(--line); }
.lt-list > li:first-child { border-top: 0; padding-top: 0; }
.lt-list > li:last-child { padding-bottom: 0; }
.lt-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.lt-top .tk { flex: 0 0 auto; }
.lt-name { min-width: 0; flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lt-w { font-size: 12px; }
.bar { height: 4px; background: var(--sunk); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 2px; }
.lt-via { font-size: 11px; line-height: 1.45; color: var(--ink-3); margin-top: 7px; }

.exp-row { display: grid; grid-template-columns: 116px minmax(0, 1fr) 56px; gap: 8px; align-items: center; padding: 5px 0; }
.exp-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exp-bar { position: relative; height: 10px; }
.exp-bar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line-2); }
.exp-bar i { position: absolute; top: 2px; height: 6px; border-radius: 2px; background: var(--ink-2); }
.exp-bar i.neg { background: var(--ink-3); }
.exp-v { text-align: right; font-size: 11.5px; }
.fit { display: flex; align-items: center; gap: 14px; margin-top: 20px; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r1); }
.fit-v { font-family: var(--f-display); font-size: 24px; line-height: 1; }
.fit p { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.exp-note { margin: 16px 0 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.55; }
.pill-demo { margin-left: 8px; vertical-align: 1px; }

/* ---------- engine column ---------- */
.pipe { list-style: none; margin: 0; padding: 0; display: flex; overflow-x: auto; background: var(--band); color: var(--band-ink); border: 1px solid var(--card-line); border-radius: var(--r1); scrollbar-width: thin; }
.pipe-step { flex: 1 0 136px; padding: 16px 18px 17px; border-right: 1px solid var(--band-line); min-width: 0; }
.pipe-step:last-child { border-right: 0; }
.pipe .label { color: var(--band-ink-3); }
.pipe-n { color: var(--accent-hi); margin-right: 4px; }
.pipe-v { display: block; font-size: 13px; line-height: 1.45; margin-top: 8px; color: var(--band-ink-2); }
.pipe-v b { font-weight: 600; color: var(--band-ink); font-variant-numeric: tabular-nums; }

.whatif { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 12px 16px; border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: var(--r1); }
.whatif p { margin: 0; flex: 1 1 320px; font-size: 13.5px; }

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); }
@container (max-width: 820px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--card-line); border-radius: var(--r1); padding: 18px 20px; min-width: 0; text-align: left; color: inherit; font: inherit; }
.tile > .label { display: block; }
button.tile { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; width: 100%; cursor: pointer; position: relative; transition: box-shadow .15s; }
button.tile:hover { box-shadow: var(--shadow-panel); }
button.tile::after { content: "→"; position: absolute; top: 16px; right: 18px; font: 500 13px var(--f-mono); color: var(--accent); }
.tile-v { font-family: var(--f-display); font-size: 30px; line-height: 1.1; margin-top: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-v.small { font-size: 21px; white-space: normal; line-height: 1.2; }
.tile-s { font-size: 13px; color: var(--ink-2); margin-top: 10px; line-height: 1.5; }
.mix { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 12px; gap: 2px; }
.mix i { display: block; height: 100%; }

.map-wrap { position: relative; height: 440px; border-radius: var(--r1); background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.map-wrap canvas { width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
.map-tip { position: absolute; left: 0; top: 0; pointer-events: none; background: var(--ink); color: var(--surface); border-radius: var(--r2); padding: 10px 12px; font-size: 12px; line-height: 1.4; width: 224px; box-shadow: var(--shadow-panel); z-index: 2; opacity: 0; transition: opacity .12s; }
.map-tip.show { opacity: 1; }
.map-tip b { display: block; font-weight: 500; margin-bottom: 5px; }
.map-tip .row { display: flex; justify-content: space-between; gap: 10px; font-family: var(--f-mono); font-size: 11px; }
.map-tip .tip-note { margin: 7px 0 0; font-size: 11px; line-height: 1.4; opacity: 0.85; }
.map-tools { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; }
.map-tools .btn-ghost { background: var(--surface); padding: 6px 10px; font-size: 12px; }
.map-hint { position: absolute; left: 12px; bottom: 12px; font: 500 10px/1.3 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 20px; margin-top: 16px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.legend .sw.bubble { width: 16px; height: 10px; background: color-mix(in srgb, var(--ink-3) 14%, transparent); border: 1px solid var(--ink-3); }
.legend .arrow { display: inline-block; width: 18px; height: 2px; background: var(--accent); margin-right: 8px; vertical-align: 3px; position: relative; }
.legend .arrow::after { content: ""; position: absolute; right: -2px; top: -3px; border: 4px solid transparent; border-left: 6px solid var(--accent); border-right: 0; }
.legend .ln { display: inline-block; width: 18px; height: 2px; background: var(--accent); margin-right: 6px; vertical-align: 3px; }
.legend .tick { display: inline-block; width: 14px; height: 2.5px; background: var(--ink); border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
.lg-t { display: inline-flex; align-items: center; }

.flat svg { width: 100%; height: auto; display: block; }
.flat .dot { cursor: pointer; }
.ax { font: 500 10px var(--f-mono); fill: var(--ink-3); }
.lbl { font: 500 11.5px var(--f-body); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.lbl.on { fill: var(--ink); font-weight: 600; }

.list-card { container-type: inline-size; }
.ev-head, .ev-row { display: grid; grid-template-columns: 22px repeat(3, minmax(0, 1fr)) 24px; gap: 10px 12px; align-items: center; }
/* Narrower than 640px (phones, and the column beside the map), each event takes two lines: the title
   across the width, its numbers underneath, so a long title never shrinks to a word per line. */
.ev-rank { grid-area: 1 / 1; align-self: start; padding-top: 2px; }
.ev-main { grid-area: 1 / 2 / 2 / 5; }
.ev-c-tier { grid-area: 1 / 5; align-self: start; justify-self: end; }
.ev-c-odds { grid-area: 2 / 2; }
.ev-c-yes { grid-area: 2 / 3; }
.ev-c-sw { grid-area: 2 / 4; }
/* :where keeps this as weak as the wide layout's reset below, so the reset wins there. */
.ev-head > :where(.ev-c-odds, .ev-c-yes, .ev-c-sw) { grid-row: 1; }
.ev-c-no, .ev-h-wide { display: none; }
.ev-head { padding: 0 6px 10px; }
.ev-row .cell { text-align: left; }
.ev-row .oddsbar { max-width: 56px; }
@container (min-width: 640px) {
  .ev-head, .ev-row { grid-template-columns: 18px minmax(0, 1fr) 52px 92px 84px 80px 108px; gap: 10px; }
  .ev-head > *, .ev-row > * { grid-area: auto; align-self: center; justify-self: stretch; padding-top: 0; }
  .ev-c-no, .ev-h-wide { display: block; }
  .ev-row .cell, .ev-head > .ev-c-odds, .ev-head > .ev-c-yes, .ev-head > .ev-c-no, .ev-head > .ev-c-sw { text-align: right; }
  .ev-row .oddsbar { max-width: none; }
  .ev-row .tier span { display: inline; }
}
.ev-list { list-style: none; margin: 0; padding: 0; }
.ev-row { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 6px; cursor: pointer; border-radius: 0; color: inherit; }
.ev-row:hover, .ev-row.hov { background: var(--surface-2); }
.ev-row.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.ev-rank { font-size: 11px; color: var(--ink-3); }
.ev-main { min-width: 0; }
.ev-title { display: block; font-weight: 500; line-height: 1.3; }
.ev-meta { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell { text-align: right; line-height: 1.25; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.cell small { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.oddsbar { display: block; height: 3px; background: var(--sunk); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.oddsbar i { display: block; height: 100%; background: var(--ink-2); }
.list-foot { margin: 16px 6px 0; }

.tier { display: inline-flex; align-items: center; gap: 7px; font: 500 11px/1 var(--f-mono); color: var(--ink-2); white-space: nowrap; }
.tier b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: var(--r1); font-weight: 600; font-size: 11px; }
.tier span { display: none; }
.tier.show span { display: inline; }
.tA b { background: var(--tA); color: var(--surface); }
.tB b { background: repeating-linear-gradient(135deg, var(--tB) 0 3px, color-mix(in srgb, var(--tB) 62%, var(--surface)) 3px 5px); color: var(--surface); }
.tC b { border: 1.5px solid var(--tC); color: var(--tC); }
.tD b { border: 1.5px dashed var(--tD); color: var(--ink-3); }

.hist svg { width: 100%; height: auto; display: block; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 14px; margin-top: 20px; align-items: end; }
@container (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat .v { display: block; font: 500 15px var(--f-mono); margin-top: 6px; font-variant-numeric: tabular-nums; }
.drivers { list-style: none; margin: 22px 0 0; padding: 20px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; }
.drivers li { font-size: 13.5px; line-height: 1.5; }
.drv-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.drv-key { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); }
.drv-key i { display: inline-block; width: 14px; height: 5px; border-radius: 3px; }
.drv-key i + span { margin-right: 8px; }
.drv-bars { display: grid; grid-template-columns: 1fr; gap: 4px; margin-top: 8px; }
.drv-bar { height: 5px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.drv-bar i { display: block; height: 100%; border-radius: 3px; }
.note { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r1); padding: 12px 14px; margin: 18px 0 0; line-height: 1.55; }

.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.feed li:first-child { border-top: 0; }
.feed .f-t { font-weight: 500; font-size: 13px; }
.feed .f-m { grid-column: 1 / -1; font-size: 11.5px; color: var(--ink-3); font-family: var(--f-mono); }
.feed .f-v { font: 500 12.5px var(--f-mono); text-align: right; }

.empty { text-align: left; padding: 36px; }
.empty .samples { margin-top: 18px; }

/* ---------- floating panels: event card and tweaks ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; animation: fade .18s ease; }
.drawer, .sheet { position: fixed; z-index: 51; top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: min(600px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--card-line); border-radius: var(--r3); box-shadow: var(--shadow-panel); display: flex; flex-direction: column; overflow: hidden; animation: slide .24s cubic-bezier(.2, .7, .2, 1); }
.sheet { width: min(420px, calc(100% - 24px)); }
@keyframes slide { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.dr-head { padding: 12px 14px 12px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dr-body { overflow: auto; overscroll-behavior: contain; padding: 6px 24px 32px; flex: 1; }
.dr-title { font-size: 30px; line-height: 1.12; margin: 16px 0 12px; }
.dr-sec { padding-block: 26px; border-top: 1px solid var(--line); }
.dr-sec:first-of-type { border-top: 0; }
.dr-sec > .label { display: block; margin-bottom: 14px; font: 600 12.5px/1.3 var(--f-mono); letter-spacing: -.01em; text-transform: none; color: var(--ink-3); }
.tierline { display: flex; gap: 12px; align-items: flex-start; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.tierline p { margin: 0; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.three .v { display: block; font-family: var(--f-display); font-size: 26px; line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.three .s { display: block; font: 400 11.5px var(--f-mono); color: var(--ink-3); margin-top: 4px; }
.formula { font: 400 12px/1.65 var(--f-mono); color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r1); padding: 11px 13px; margin-top: 16px; overflow-x: auto; white-space: nowrap; }
.split svg { width: 100%; height: auto; display: block; margin-top: 16px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.odds-big { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.odds-big .v { font-family: var(--f-display); font-size: 36px; line-height: 1; }
.venues { list-style: none; margin: 12px 0 0; padding: 0; }
.venues li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; }
.venues li span:last-child { font-family: var(--f-mono); }
.spark svg { width: 100%; height: auto; display: block; margin-top: 12px; }
.quote { margin: 12px 0 0; padding: 10px 13px; border-left: 2px solid var(--accent); background: var(--surface-2); font-size: 13px; color: var(--ink-2); border-radius: 0 var(--r1) var(--r1) 0; }
.quote b { color: var(--ink); font-weight: 500; }
.cmp { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 12.5px; }
.cmp th { text-align: left; font: 500 10px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 0 8px 6px 0; }
.cmp td { padding: 9px 10px 9px 0; border-top: 1px solid var(--line); vertical-align: top; }
.cmp td:last-child { width: 20px; text-align: right; padding-right: 0; }
.mk { font: 600 12px var(--f-mono); }
.mk.ok { color: var(--gain); } .mk.mid { color: var(--ink-3); } .mk.bad { color: var(--loss); }
.scorebar { display: inline-block; width: 70px; height: 5px; border-radius: 3px; background: var(--sunk); overflow: hidden; vertical-align: 1px; margin-left: 6px; }
.scorebar i { display: block; height: 100%; background: var(--accent); }
.miss { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.miss li { font-size: 12.5px; line-height: 1.5; padding: 11px 13px; border: 1px dashed var(--line-2); border-radius: var(--r1); }
.miss li b { font-weight: 500; display: block; margin: 2px 0 3px; }
.miss li span { color: var(--ink-3); }
.ev-src { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) 58px; gap: 8px 12px; align-items: center; }
.ev-src .nm { font-size: 12.5px; line-height: 1.3; padding: 6px 0; }
.ev-src .nm small { display: block; color: var(--ink-3); font-size: 11px; line-height: 1.45; margin-top: 2px; }
.ev-src .vv { font: 500 12px var(--f-mono); text-align: right; }
.ev-src svg { width: 100%; height: 22px; display: block; overflow: visible; }
.verdict { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; font-size: 13px; line-height: 1.55; padding: 12px 14px; border-radius: var(--r1); background: var(--surface-2); border: 1px solid var(--line); }
.verdict p { margin: 0; }
.contrib { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: 12.5px; }
.contrib .why2 { font: 400 10.5px/1.4 var(--f-mono); color: var(--ink-3); display: block; margin-top: 2px; }
.cbar { position: relative; height: 8px; }
.cbar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--line-2); }
.cbar i { position: absolute; top: 1px; height: 6px; border-radius: 2px; background: var(--gain); }
.cbar i.neg { background: var(--loss); }
.knock { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.knock li { font-size: 13px; line-height: 1.55; padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r1); }
.knock li button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; font-weight: 500; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.knock li button:hover { text-decoration-color: var(--accent); }
.ai-out { margin-top: 12px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; }
.hedge { font-size: 13.5px; line-height: 1.6; color: var(--ink-2); }
.hedge p { margin: 0 0 10px; }

/* ---------- tweaks ---------- */
.tw-body { overflow: auto; overscroll-behavior: contain; padding: 4px 20px 28px; }
.tw-group { padding-block: 18px; border-top: 1px solid var(--line); }
.tw-group:first-child { border-top: 0; }
.tw-group > .label { display: block; margin-bottom: 4px; font: 600 12.5px/1.3 var(--f-mono); letter-spacing: -.01em; text-transform: none; color: var(--ink-3); }
.tw-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; flex-wrap: wrap; }
.tw-row > span { font-size: 13px; }
.tw-row small { display: block; font-size: 12px; line-height: 1.45; color: var(--ink-3); margin-top: 3px; }
.copybox { width: 100%; height: 120px; margin-top: 10px; font: 400 11px var(--f-mono); }

/* ---------- replay ---------- */
.rp-ctl { display: flex; gap: 8px; align-items: center; }
.rp-time { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
.rp-days { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: thin; padding-bottom: 2px; }
.rp-day { flex: 1 0 58px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r1); padding: 9px 4px; cursor: pointer; font: 500 11px/1 var(--f-mono); color: var(--ink-3); position: relative; }
.rp-day.past { color: var(--ink-2); background: var(--surface-2); }
.rp-day.on { border-color: var(--ink); color: var(--surface); background: var(--ink); }
.rp-day.res::after { content: ""; position: absolute; top: 3px; right: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.rp-day.on.res::after { background: var(--accent-hi); }
.rp-note { margin: 20px 0 0; font-size: 14px; line-height: 1.55; display: flex; gap: 8px 14px; align-items: baseline; flex-wrap: wrap; }
.rp-list { list-style: none; margin: 0; padding: 0; }
.rp-list li { display: grid; grid-template-columns: minmax(0, 1fr) 44px 92px; gap: 12px; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); font-size: 13px; }
.rp-list li.done { color: var(--ink-3); }
.rp-list small { display: block; font-size: 11px; line-height: 1.45; color: var(--ink-3); margin-top: 4px; font-family: var(--f-mono); }
.calls { width: 100%; border-collapse: collapse; font-size: 13px; }
.calls th { text-align: left; font: 500 10px/1.2 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 0 12px 10px 0; white-space: nowrap; }
.calls td { padding: 13px 12px 13px 0; border-top: 1px solid var(--line); vertical-align: top; }
.calls td.n { font-family: var(--f-mono); white-space: nowrap; }
.calls small { font-size: 11px; color: var(--ink-3); }
.calls small a { color: inherit; }
.calls td:first-child { min-width: 150px; }
.rp-rank { margin: 10px 0 0; padding-left: 20px; font-size: 13px; line-height: 1.55; }
.rp-rank li { margin: 8px 0; }
.scroll-x { overflow-x: auto; }
.rp-chart svg { width: 100%; height: auto; display: block; }

.rp-how { margin: 0; font-size: 13.5px; line-height: 1.65; color: var(--ink-2); max-width: 90ch; }
.rp-how-l { display: block; margin: 22px 0 0; }
.rp-how-list { margin: 10px 0 0; padding-left: 18px; font-size: 13.5px; line-height: 1.6; color: var(--ink-2); max-width: 90ch; }
.rp-how-list li + li { margin-top: 8px; }

/* ---------- methodology (ui-method.js): one reading column, no portfolio panel ---------- */
.method { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--gap); padding-bottom: 72px; container-type: inline-size; }
.m-p { margin: 18px 0 0; font-size: 14px; line-height: 1.65; color: var(--ink-2); max-width: 70ch; }
.m-p.m-first { margin-top: 0; }
.m-p b { color: var(--ink); font-weight: 600; }
.m-three { margin-top: 20px; }
.m-three .label { display: block; }
.method .formula { white-space: normal; }
.m-steps { list-style: none; margin: 0; padding: 0; }
.m-step { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 10px 32px; padding: 26px 0; border-top: 1px solid var(--line); }
.m-step:first-child { border-top: 0; padding-top: 0; }
.m-step:last-child { padding-bottom: 4px; }
.m-step-h { display: flex; align-items: baseline; gap: 12px; }
.m-n { font: 600 13px/1 var(--f-mono); color: var(--accent); flex: none; }
.m-step-t { font-family: var(--f-display); font-weight: 400; font-size: 20px; line-height: 1.25; letter-spacing: -.01em; margin: 0; }
.m-step-b > * { margin: 0; }
.m-step-b > * + * { margin-top: 14px; }
.m-step-b > p { font-size: 14px; line-height: 1.65; color: var(--ink-2); max-width: 66ch; }
.m-step-b .m-where { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 12.5px; line-height: 1.4; color: var(--ink-3); }
.m-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.m-chip { display: inline-flex; align-items: baseline; gap: 7px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r1); background: var(--surface-2); font-size: 12.5px; line-height: 1.3; }
.m-chip small { font: 500 10.5px/1.3 var(--f-mono); color: var(--ink-3); }
.m-tiers { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.m-tiers li { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 6px 14px; align-items: start; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
.m-tests { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
.m-tile { background: var(--surface-2); border: 1px solid var(--line); }
.m-tile .tile-v small { font-size: 16px; color: var(--ink-3); }
.m-sub-l { display: block; margin: 30px 0 0; }
.m-limits { list-style: none; margin: 10px 0 0; padding: 0; }
.m-limits li { padding: 14px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.6; color: var(--ink-2); }
.m-limits li:first-child { border-top: 0; padding-top: 4px; }
.m-limits li:last-child { padding-bottom: 0; }
.m-limits b { color: var(--ink); font-weight: 600; margin-right: 4px; }
@container (max-width: 700px) {
  .m-step { grid-template-columns: minmax(0, 1fr); }
  .m-tests { grid-template-columns: minmax(0, 1fr); }
}
@container (max-width: 480px) {
  .m-tiers li { grid-template-columns: minmax(0, 1fr); }
  /* Labels that wrap to two lines keep the three numbers level. */
  .m-three .label { min-height: 2.6em; }
}

/* ---------- footer: full-bleed dark, as on castle.tech ---------- */
.foot { background: var(--band); color: var(--band-ink-2); }
.foot-in { max-width: 1440px; margin: 0 auto; padding: 44px max(16px, env(safe-area-inset-right, 0px)) calc(52px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); gap: 20px 48px; }
.foot-brand { display: flex; align-items: center; gap: 10px; color: var(--band-ink); align-self: start; flex-wrap: wrap; }
.foot-tag { font: 500 12px var(--f-mono); color: var(--band-ink-3); }
.foot-txt p { margin: 0 0 10px; font-size: 13px; line-height: 1.65; color: var(--band-ink-3); max-width: 80ch; }
.foot-txt p:first-child { color: var(--band-ink-2); }

/* ---------- small screens ---------- */
@media (max-width: 760px) {
  .foot-in { grid-template-columns: minmax(0, 1fr); }
  .hero { height: clamp(540px, 88vh, 720px); }
  .hero-img { object-position: 68% 30%; }
  .hero-sub { font-size: 16px; }
  .intro { padding-block: 80px 26px; }
  .hero-shade { background: linear-gradient(180deg, rgba(20, 8, 10, .6) 0%, rgba(20, 8, 10, .1) 16%, rgba(20, 8, 10, .14) 34%, rgba(20, 8, 10, .72) 60%, rgba(20, 8, 10, .93) 100%); }
  .intro-sub { font-size: 15px; }
}
@media (max-width: 560px) {
  .banner-x { display: none; }
  .brand-name { display: none; }
  .tab { padding: 9px 10px; font-size: 13px; }
  .nav-in { gap: 6px; padding-left: 10px; }
  .card { padding: 18px; }
  .hold { grid-template-columns: minmax(0, 1fr) 104px 58px 24px; }
  .three .v { font-size: 21px; }
  .hero-eyebrow::before, .hero-eyebrow::after { display: none; }
  .drawer, .sheet { top: 0; right: 0; bottom: 0; width: 100%; border-radius: 0; border: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .dr-body { padding: 4px max(16px, env(safe-area-inset-left, 0px)) 28px; }
  .map-wrap { height: 340px; }
  .hero-cta .btn { padding: 11px 14px; font-size: 13px; }
}
@media (max-width: 400px) {
  .tabs { gap: 0; }
  .tab { padding: 9px 7px; }
  .nav-in { gap: 4px; padding-left: 8px; }
  .nav .btn-sm { padding: 7px 10px; }
}
@media (max-width: 340px) {
  .tab, .nav .btn-sm { font-size: 12px; }
  .tab { padding: 9px 6px; }
  .nav .btn-sm { padding: 7px 8px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.m-tests > .m-tile:last-child:nth-child(odd) { grid-column: 1 / -1; }

/* ---------- 6.1 Exposure engine: look-through, arrow, extras, fit ---------- */
function holdingValue(h) { const t = TICKERS[h.t]; if (!t || !(h.a > 0)) return 0; return h.u === 'usd' ? h.a : h.a * t.px; }

/* A portfolio's out-of-sample fit, estimated from each holding's own (r2, or r2x with the extras it uses). Factor-driven
   moves add up across holdings, while each holding's own moves partly cancel, so a mix usually fits better than its
   holdings do on average. This treats the factors, and the holdings' own moves, as uncorrelated; a holding the factors
   don't explain at all (cash) adds nothing either way. One holding alone gets its own fit back. */
function fitEstimate(rows, added) {
  const bp = new Array(NF).fill(0), xp = {};
  let own = 0, n = 0;
  rows.forEach(r => {
    const t = TICKERS[r.t];
    const ext = added && t.x ? Object.keys(t.x).filter(k => added.has(k)) : [];
    const r2 = ext.length ? (t.r2x ?? t.r2) : t.r2;
    let sys = 0;  // the holding's factor-driven variance, in typical moves
    for (let k = 0; k < NF; k++) { bp[k] += r.w * t.b[k]; sys += t.b[k] ** 2; }
    ext.forEach(k => { xp[k] = (xp[k] || 0) + r.w * t.x[k]; sys += t.x[k] ** 2; });
    if (r2 == null) return;
    n++;
    if (r2 > 0) own += r.w ** 2 * sys * (1 - Math.min(r2, 1)) / Math.max(r2, 0.01);
  });

  return n && sp + own > 0 ? sp / (sp + own) : null;
}

/* Holdings as the engine received them, so a portfolio it analyzed finds its measured fit (dataset.js). */
function holdingsKey(rows) {
  return rows.filter(r => TICKERS[r.t] && r.a > 0).map(r => r.t + ':' + r.u + ':' + +r.a).sort().join(',');
}

/* ---------- 4.1 Impact: the dot product, plus extras and the direct channel ---------- */
function contributions(ev, P) {
  const out = [];

  if (ev.x) for (const e in ev.x) if (P.added.has(e)) { const ex = EXTRAS.find(z => z.k === e); out.push({ key: e, name: ex.name, move: ev.x[e], exp: P.xRaw[e] || 0, c: (P.xRaw[e] || 0) * ev.x[e], extra: true, unit: ex }); }
  if (ev.dir) for (const st in ev.dir) { const w = P.stockW[st] || 0; if (w > 0) out.push({ key: 'dir:' + st, name: (NAMES[st] || st) + ' (own line)', move: ev.dir[st], exp: w, c: w * ev.dir[st], direct: true }); }

// null on a factor with no reading). On a portfolio the error is √(b'Σb), the factors' errors added with how they
// move together, so a hedge's errors can cancel and a bet on co-moving factors piles them up.

/* ---------- 4.2-4.4 Odds, what-ifs, knock-ons, priced-in moves, swing ---------- */
function buildState(P, tw, live, whatIf) {

  const byId = Object.fromEntries(evs.map(e => [e.id, e]));
  const order = [...evs].sort((a, c) => parseDate(a.date) - parseDate(c.date) || EVENTS.findIndex(z => z.id === a.id) - EVENTS.findIndex(z => z.id === c.id));
  const links = tw.knock ? LINKS : [];
  links.forEach(([p, c, w]) => { byId[p].children.push({ id: c, w }); byId[c].parents.push({ id: p, w }); });
  evs.forEach(e => {

    const wi = whatIf && whatIf[e.id];
    if (wi) { e.resolved = wi; e.qEff = wi === 'yes' ? 1 : 0; e.shift = e.qEff - e.q0; }
    else {
      let shift = 0;
      e.parents.forEach(p => { const pe = byId[p.id]; shift += p.w * (pe.qEff - pe.q0); });
      e.qEff = clamp(e.q0 + shift, 0.005, 0.995); e.shift = e.qEff - e.q0;
    }
    e.phEff = e.resolved ? e.qEff : clamp(e.ph0 + e.shift, 0.005, 0.995);

    e.knock = e.children.map(c => { const ce = byId[c.id]; return { id: c.id, w: c.w, d: ce.resolved ? 0 : c.w * ce.dT }; });
    e.dT = e.dD + e.knock.reduce((s, k) => s + k.d, 0);
    // Its variance, each event's jump measured apart from the others': every event the knock-ons reach adds its own
    // jump's variance times its weight squared, the weight summed over all the paths that reach it (two paths to one
    // event carry the same error, so their weights add before squaring).
    e.reach = { [e.id]: 1 };

      const ce = byId[k.id]; if (ce.resolved) return;

/* ---------- 4.6 Evidence fusion: precision-weighted average and chi-square check ---------- */
function fuseReadings(src) {
  const rd = src.map(([kind, name, detail, k, sig]) => ({ kind, name, detail, k, sig, market: MARKET_KINDS.has(kind) }));
  let sw = 0, sx = 0; rd.forEach(r => { const w = 1 / (r.sig * r.sig); sw += w; sx += w * r.k; });
  const kbar = sx / sw;
  rd.forEach(r => { r.kn = r.k / kbar; r.sn = r.sig / kbar; r.w = (1 / (r.sig * r.sig)) / sw; r.precise = r.market && Math.abs(r.sn) <= QUORUM_SE; });
  const mk = rd.filter(r => r.market);
  let chi2 = 0; mk.forEach(r => { chi2 += Math.pow((r.kn - 1) / r.sn, 2); });
  const dof = Math.max(mk.length - 1, 0);

  // Every market reading takes part in the χ² check, so a vague one can still contest the jump; only precise ones confirm it.

/* ---------- 4.7 Scenario simulation over the event graph ---------- */
function simulate(S, P, tw, n) {

    parents: e.parents.filter(pp => idx.has(pp.id)).map(pp => ({ j: idx.get(pp.id), w: pp.w })), alpha: 0, beta: [],

  // Logistic link per child; slopes match w to first order, intercept solved so the
  // event's overall probability matches its odds.
  prm.forEach(r => {
    if (!r.inH || !r.parents.length) return;
    const pv = Math.max(r.p * (1 - r.p), 0.02);
    r.beta = r.parents.map(pp => pp.w / pv);
    const k = r.parents.length; const confs = [];
    for (let mask = 0; mask < (1 << k); mask++) {
      let pr = 1, z = 0;
      for (let t = 0; t < k; t++) { const par = prm[r.parents[t].j]; const x = (mask >> t) & 1; pr *= x ? par.p : 1 - par.p; z += r.beta[t] * (x - par.q); }
      confs.push([pr, z]);
    }
    let lo = -30, hi = 30;
    for (let it = 0; it < 60; it++) { const mid = (lo + hi) / 2; const f = confs.reduce((s, [pr, z]) => s + pr * sigmoid(mid + z), 0); if (f > r.p) hi = mid; else lo = mid; }
    r.alpha = (lo + hi) / 2;
  });
  const weeks = tw.horizon * 4.345;
  const noiseSd = tw.noise ? Math.sqrt(P.b.reduce((s, v) => s + v * v, 0)) * Math.sqrt(weeks) : 0;
  const rng = mulberry32(7);
  const pnl = new Float64Array(n); const X = new Float32Array(n * m);
  for (let s = 0; s < n; s++) {
    let tot = 0; const base = s * m;
    for (let i = 0; i < m; i++) {
      const r = prm[i];
      if (r.inH) {
        let p = r.p;
        if (r.parents.length) { let z = r.alpha; for (let t = 0; t < r.parents.length; t++) { const pj = r.parents[t].j; z += r.beta[t] * (X[base + pj] - prm[pj].q); } p = sigmoid(z); }
        const x = rng() < p ? 1 : 0; X[base + i] = x; tot += r.dD * (x - r.q);
      } else {
        // Resolves after the horizon: it does not happen or fail, its odds just move.
        let sh = 0; for (const pp of r.parents) sh += pp.w * (X[base + pp.j] - prm[pp.j].q);
        const qq = clamp(r.q + sh, 0.001, 0.999); X[base + i] = qq; tot += r.dD * (qq - r.q);
      }

    if (noiseSd) tot += noiseSd * gauss(rng);

  }
  const ix = Array.from({ length: n }, (_, i) => i).sort((a, c) => pnl[a] - pnl[c]);
  const at = p => pnl[ix[Math.min(n - 1, Math.max(0, Math.floor(p * (n - 1))))]];
  let mean = 0; for (let s = 0; s < n; s++) mean += pnl[s]; mean /= n;
  let vr = 0; for (let s = 0; s < n; s++) vr += (pnl[s] - mean) * (pnl[s] - mean);
  const sd = Math.sqrt(vr / n);
  const k5 = Math.max(1, Math.floor(0.05 * n));
  let es = 0; for (let i = 0; i < k5; i++) es += pnl[ix[i]]; es /= k5;
  const drivers = [];
  prm.forEach((r, i) => {
    if (!r.inH) return;
    let all = 0, tail = 0;
    for (let s = 0; s < n; s++) all += X[s * m + i];
    for (let t = 0; t < k5; t++) tail += X[ix[t] * m + i];
    drivers.push({ id: r.id, base: all / n, tail: tail / k5, dD: r.dD });
  });
  // Histogram over the central 99.6% of outcomes.
  let lo = at(0.002), hi = at(0.998); if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.04; lo -= pad; hi += pad;
  const nb = 38; const bins = new Array(nb).fill(0); const bw = (hi - lo) / nb;
  for (let s = 0; s < n; s++) { const bi = Math.floor((pnl[s] - lo) / bw); if (bi >= 0 && bi < nb) bins[bi]++; }
  return { n, mean, sd, es, p5: at(0.05), p50: at(0.5), p95: at(0.95), drivers, hist: { lo, hi, bw, bins } };
}

/* ---------- The 3D map: macro axes and the portfolio's own axes ---------- */
const AXES3 = [
  { name: 'growth', w: [0.5, 0.15, 0, 0, 0.2, -0.35, 0, 0.3, 0, 0], ends: ['Weaker growth', 'Stronger growth'] },
  { name: 'risk', w: [0.25, 0, 0, 0, 0, -0.45, -0.55, 0, 0, -0.3], ends: ['Risk-off', 'Risk-on'] },
  { name: 'inflation', w: [0, 0.4, 0.6, 0, 0.45, 0, 0, 0, 0, 0.15], ends: ['Lower inflation', 'Higher inflation'] },
].map(a => { const nrm = Math.hypot(...a.w); return { ...a, w: a.w.map(v => v / nrm) }; });
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);

function powerIter(M, ortho) {
  let v = M.map((_, i) => 1 + 0.1 * i);
  for (let it = 0; it < 80; it++) {
    let w = M.map(row => dot(row, v));
    ortho.forEach(u => { const d = dot(w, u); w = w.map((x, i) => x - d * u[i]); });
    const nm = Math.hypot(...w) || 1; v = w.map(x => x / nm);
  }
  return v;
}
function axisLabel(v) {
  const top = v.map((x, k) => [Math.abs(x), k, x]).sort((a, b) => b[0] - a[0]).slice(0, 2);
  const word = (k, s) => FACTORS[k].short + (s > 0 ? ' up' : ' down');
  return [top.map(([, k, x]) => word(k, -x)).join(', '), top.map(([, k, x]) => word(k, x)).join(', ')];
}
function mapGeometry(evs, P, mode) {
  if (mode === 'mine') {
    const nb = Math.hypot(...P.b) || 1; const u = P.b.map(v => v / nb);
    const M = Array.from({ length: NF }, () => new Array(NF).fill(0));
    const res = {};
    evs.forEach(e => {
      const wgt = e.qEff * (1 - e.qEff) + 0.02; const d0 = dot(e.d, u); const r = e.d.map((v, k) => v - d0 * u[k]); res[e.id] = r;
      for (let i = 0; i < NF; i++) for (let j = 0; j < NF; j++) M[i][j] += wgt * r[i] * r[j];
    });
    let v1 = powerIter(M, [u]); let v2 = powerIter(M, [u, v1]);
    const flip = v => { const k = v.reduce((bi, x, i) => Math.abs(x) > Math.abs(v[bi]) ? i : bi, 0); return v[k] < 0 ? v.map(x => -x) : v; };
    v1 = flip(v1); v2 = flip(v2);
    const raw = {}; evs.forEach(e => { raw[e.id] = [e.dT, dot(res[e.id], v1), dot(res[e.id], v2)]; });
    const mx = [0, 1, 2].map(i => Math.max(0.01, ...evs.map(e => Math.abs(raw[e.id][i]))));
    const pos = {}; evs.forEach(e => { const r = raw[e.id]; pos[e.id] = [r[0] / mx[0], r[1] / mx[1], r[2] / mx[2]]; });
    // The map is linear in the jump: rows that take δ to a position (v1 and v2 are square to the arrow, so the
    // residual's coordinates are δ's own).
    const G = [P.b.map(v => v / mx[0]), v1.map(v => v / mx[1]), v2.map(v => v / mx[2])];
    const lin = {}; evs.forEach(e => { lin[e.id] = G; });
    // Across, the dot is the whole move, knock-ons included, which the jump's own covariance leaves out: their
    // variance adds there alone (the other events' jumps are measured apart from this one's).
    const xVar = {}; evs.forEach(e => { xVar[e.id] = e.dTvar == null || e.dDvar == null ? 0 : Math.max(0, e.dTvar - e.dDvar) / mx[0] ** 2; });
    return { pos, lin, xVar, arrow: [1, 0, 0], ends: { x: ['You lose', 'You gain'], y: axisLabel(v1), z: axisLabel(v2) } };
  }
  const raw = {}; evs.forEach(e => { raw[e.id] = AXES3.map(a => dot(a.w, e.d)); });
  const norms = evs.map(e => Math.hypot(...raw[e.id])).sort((a, b) => a - b);
  const ref = Math.max(0.6, norms[Math.floor(norms.length * 0.85)] || 1);
  const pos = {}, lin = {};
  evs.forEach(e => {
    let p = raw[e.id].map(v => v / ref); const nm = Math.hypot(...p); const k = nm > 1.2 ? 1.2 / nm : 1;
    pos[e.id] = p.map(v => v * k); lin[e.id] = AXES3.map(ax => ax.w.map(v => v * k / ref));
  });
  const a = AXES3.map(ax => dot(ax.w, P.b)); const na = Math.hypot(...a) || 1;
  return { pos, lin, arrow: a.map(v => v / na), ends: { x: AXES3[0].ends, y: AXES3[1].ends, z: AXES3[2].ends } };
}

/* The covariance of an event's place on the map, G Σ G', from its jump's covariance, plus the knock-ons' variance
   across where the map puts the whole move there ("Your portfolio" view); null without a covariance. */
function mapCov(e, geo) {
  const C = jumpCov(e), G = geo && geo.lin && geo.lin[e.id];
  if (!C || !G) return null;
  const M = G.map(gi => G.map(gj => { let s = 0; for (let f = 0; f < gi.length; f++) { if (!gi[f]) continue; for (let h = 0; h < gj.length; h++) s += gi[f] * C[f][h] * gj[h]; } return s; }));
  if (geo.xVar && geo.xVar[e.id]) M[0][0] += geo.xVar[e.id];
  return M;
}
/* An ellipse from a 2×2 covariance [[a, b], [b, c]]: its semi-axes at one standard deviation and its angle. */
function ellipse2(a, b, c) {
  const m = (a + c) / 2, d = Math.sqrt(Math.max(0, ((a - c) / 2) ** 2 + b * b));
  return { rx: Math.sqrt(Math.max(0, m + d)), ry: Math.sqrt(Math.max(0, m - d)), angle: 0.5 * Math.atan2(2 * b, a - c) };
}

/* ---------- Odds history: the snapshot's daily closes, or an illustrative bridge in log-odds space ---------- */
function oddsHistory(e, n = 120) {
  if (e.series && e.series.length >= 2) return e.series.concat([e.q]);
  if (!e.hist) return null;
  const rng = mulberry32(hashStr(e.id)); const { h0, y, j = [] } = e.hist;
  const inc = new Array(n - 2).fill(0).map(() => (rng() - 0.5) * 0.18);
  j.forEach(([ago, size]) => { const k = n - 2 - ago; if (k >= 0 && k < inc.length) inc[k] += size; });
  const tot = inc.reduce((a, b) => a + b, 0); const corr = (logit(y) - logit(h0) - tot) / inc.length;
  const out = [h0]; let z = logit(h0);
  for (let i = 0; i < inc.length; i++) { z += inc[i] + corr; out.push(sigmoid(z)); }
  out.push(e.q);
  return out;
}

/* ---------- Historical replay (E8): engine's calls vs what happened ----------
   REPLAY comes in two shapes. The illustrative one has one jump per event (d) and fixed links. The engine's
   (`redkeep replay`) re-estimates each jump every evening (dd: index 0 is the evening before the first day, index
   i + 1 the close of day i), adds the odds at the close before the first day (q0), gives each link the weight the
   data set that evening (w per evening, null when the data didn't confirm it), and has no moves (null) on factors it
   had no prices for. An event's odds q[i] are at the close of day i, null before a market listed it. The engine's
   also carries each jump's error bars (sd, one standard deviation per factor, null where it had no reading), so the
   screen can show a jump that is mostly noise as such; the illustrative one has none. */
function replayCompute(P, knock) {
  const R = REPLAY; const D = R.days.length;
  const real = R.days.map(day => day.f.reduce((s, f, k) => s + (f == null ? 0 : P.b[k] * f / FACTORS[k].typical), 0));
  // The replay's jumps are in its own typical moves, and a backend snapshot brings others: put the arrow in the replay's.
  const bR = P.b.map((v, k) => (R.typical[k] == null ? 0 : v * R.typical[k] / FACTORS[k].typical));
  const done = (e, i) => e.res != null && i >= e.res;  // resolved by the close of day i
  const qEve = (e, k) => (k === 0 ? (e.q0 == null ? null : e.q0) : done(e, k - 1) || e.q[k - 1] == null ? null : e.q[k - 1]);
  const qAfter = (e, i) => (done(e, i) ? e.out : e.q[i] == null ? null : e.q[i]);  // the close of day i, resolutions included
  const jumpAt = (e, k) => { const d = e.dd ? e.dd[k] : e.d; return d ? dot(bR, d.map(x => (x == null ? 0 : x))) : null; };
  // The variance of that jump on this portfolio, from the factors' error bars taken as independent. A factor with no
  // reading adds nothing, as it adds nothing to the jump; null when the replay carries no error bars.
  const varAt = (e, k) => {
    const s = e.sd && e.sd[k];
    return s ? s.reduce((v, x, f) => (x == null || !isFinite(x) ? v : v + (bR[f] * x) ** 2), 0) : null;
  };
  const linksAt = k => (knock ? (R.links || []).map(l => (Array.isArray(l) ? l : [l.p, l.c, l.w[k]])).filter(l => l[2] != null) : []);
  // At evening k: each event's jump on this portfolio, plus the knock-ons through its links to events still open (4.4),
  // along every path that doesn't revisit an event (the backend's total_jump does the same). Each comes with its
  // variance: every event reached adds its own jump's variance times its weight squared, the weight summed over the
  // paths that reach it (two paths to one event carry the same error); null if one of them has no error bars.
  const totals = k => {
    const L = linksAt(k);
    const tot = (id, path) => {
      const e = R.events.find(z => z.id === id); let s = jumpAt(e, k);
      if (s == null) return null;
      const reach = new Map([[id, 1]]);
      const on = new Set(path).add(id);
      L.forEach(([p, c, w]) => {
        if (p !== id || on.has(c)) return;
        const ce = R.events.find(z => z.id === c), qc = ce ? qEve(ce, k) : null;
        if (qc == null || qc >= 1) return;
        const t = tot(c, on);
        if (t != null) { s += w * t[0]; t[1].forEach((wd, d) => reach.set(d, (reach.get(d) || 0) + w * wd)); }
      });
      return [s, reach];
    };
    return id => {
      const t = tot(id, []); if (t == null) return null;
      let v = 0;
      for (const [d, w] of t[1]) { const x = varAt(R.events.find(z => z.id === d), k); if (x == null) { v = null; break; } v += w * w * x; }
      return [t[0], v];
    };
  };
  const sdOf = t => (t == null || t[1] == null ? null : Math.sqrt(t[1]));
  const states = R.days.map((day, i) => { const tot = totals(i + 1); return R.events.map(e => {
    if (done(e, i)) return { id: e.id, t: e.t, s: e.s, status: 'happened', on: R.days[e.res].d };
    const q = qEve(e, i + 1);
    if (q == null) return { id: e.id, t: e.t, s: e.s, status: 'unlisted' };
    const T = tot(e.id);
    if (T == null) return { id: e.id, t: e.t, s: e.s, status: 'open', q, dT: null };
    const dT = T[0], sd = sdOf(T);
    return { id: e.id, t: e.t, s: e.s, status: 'open', q, dT, sd, ifYes: (1 - q) * dT, ifNo: -q * dT,
      ifYesErr: sd == null ? null : (1 - q) * sd, ifNoErr: sd == null ? null : q * sd, swing: Math.abs(dT) * Math.sqrt(q * (1 - q)) };
  }); });
  const calls = R.events.filter(e => e.res != null).map(e => {
    const q = qEve(e, e.res), T = totals(e.res)(e.id), dT = T == null ? null : T[0], sd = sdOf(T);
    const pred = q == null || dT == null ? null : e.out ? (1 - q) * dT : -q * dT;
    const predErr = pred == null || sd == null ? null : (e.out ? 1 - q : q) * sd;
    const why = q == null ? 'No market priced it the evening before' : dT == null ? 'No reading of its jump yet' : '';
    return { id: e.id, t: e.t, s: e.s, day: e.res, date: R.days[e.res].d, q, dT, pred, predErr, real: real[e.res], why };
  });
  // Every day: each event's own jump that evening times its odds change to the next close (Σ δ · Δq, section 10 of the
  // design). Knock-ons stay out, since the odds of the events they move are in the sum themselves. Null on a day when
  // no event had a jump and odds at both closes.
  const expl = R.days.map((day, i) => R.events.reduce((s, e) => {
    const a = qEve(e, i), b = qAfter(e, i), d = jumpAt(e, i);
    return a == null || b == null || d == null ? s : (s || 0) + d * (b - a);
  }, null));
  // How much of this portfolio's daily moves the events explain: 1 − Σ(real − explained)² / Σ real², where a day with
  // nothing to explain it counts as explaining nothing.
  const x = expl.map(v => v || 0), ss = real.reduce((s, r) => s + r * r, 0);
  const fit = { share: ss > 0 ? 1 - real.reduce((s, r, i) => s + (r - x[i]) ** 2, 0) / ss : null, corr: pearson(x, real) };
  const cum = []; let c = 1; real.forEach(r => { c *= 1 + r / 100; cum.push((c - 1) * 100); });
  return { real, cum, states, calls, expl, fit };
}

function pearson(x, y) {
  const n = x.length; if (n < 3) return null;
  const mx = x.reduce((s, v) => s + v, 0) / n, my = y.reduce((s, v) => s + v, 0) / n;
  let sxy = 0, sxx = 0, syy = 0;
  x.forEach((v, i) => { sxy += (v - mx) * (y[i] - my); sxx += (v - mx) ** 2; syy += (y[i] - my) ** 2; });
  return sxx > 0 && syy > 0 ? sxy / Math.sqrt(sxx * syy) : null;
}

/* ==========================================================================
   DATASETS · the illustrative data in data.js, or a backend snapshot.
   `redkeep app` writes live.js (one RK_LIVE constant) from a library snapshot,
   and any portfolio analyses, in the shapes data.js uses; the build inlines it
   when it exists. The model and the UI read data.js's globals, so switching
   replaces their contents in place and the app remounts.

   A snapshot exported without analyses brings its events only. The app then
   keeps its illustrative portfolios, rescaled to the snapshot's typical moves,
   and labels their exposures as illustrative.
   ========================================================================== */
const HAS_LIVE = typeof RK_LIVE !== 'undefined' && !!RK_LIVE && Array.isArray(RK_LIVE.events) && RK_LIVE.events.length > 0;
// Whether the snapshot brings the engine's own portfolios, prices and exposures, or events only.
const LIVE_PORTFOLIOS = HAS_LIVE && RK_LIVE.exposures !== 'illustrative' && Array.isArray(RK_LIVE.samples) && RK_LIVE.samples.length > 0;
const DEMO = {
  today: TODAY, factors: FACTORS.map(f => ({ typical: f.typical, proxy: f.proxy })),
  tickers: { ...TICKERS }, names: { ...NAMES }, samples: SAMPLES.slice(), events: EVENTS.slice(), links: LINKS.slice(),
  replay: { ...REPLAY },
};
// The engine's replay of a past episode (`redkeep replay --write`, then `redkeep app`), when the snapshot carries one.
const LIVE_REPLAY = HAS_LIVE && RK_LIVE.replay && Array.isArray(RK_LIVE.replay.days) && RK_LIVE.replay.days.length > 0
  ? RK_LIVE.replay : null;
let REPLAY_SOURCE = 'demo'; // 'engine' when the replay screen shows the engine's replay on archived prices
let DATASET = 'demo';    // where the events come from: 'demo' or 'live'
let EXPOSURES = 'demo';  // where the portfolios, prices and exposures come from
let UNMEASURED = [];     // factors the snapshot has no price data on, so no typical move of their own
let WEEKENDS = null;     // the snapshot's Hyperliquid weekend windows, when it ran them
let PERP_FACTORS = [];   // keys of the factors those windows measured
let MEASURED_FIT = {};   // the engine's out-of-sample fit for each portfolio it analyzed, by holdingsKey (model.js)
let JOINT_WEIGHT = null; // how much of the jump errors' correlations the snapshot carries (eval E11): 1, 0.5 or 0

function refill(target, src) {
  if (Array.isArray(target)) { target.length = 0; src.forEach(x => target.push(x)); return; }
  Object.keys(target).forEach(k => { delete target[k]; });
  Object.assign(target, src);
}

function applyDataset(id) {
  const L = id === 'live' && HAS_LIVE ? RK_LIVE : null;
  const LP = L && LIVE_PORTFOLIOS ? L : null;
  TODAY = L ? L.today : DEMO.today;
  UNMEASURED = [];
  WEEKENDS = (L && L.windows && L.windows.weekends) || null;
  PERP_FACTORS = WEEKENDS && WEEKENDS.readings > 0 ? Object.keys(WEEKENDS.used || {}) : [];
  FACTORS.forEach((f, i) => {
    const lf = L && L.factors.find(x => x.k === f.k);
    const measured = !!lf && lf.typical > 0;
    if (L && !measured) UNMEASURED.push(f);
    f.typical = measured ? lf.typical : DEMO.factors[i].typical;
    f.proxy = measured ? lf.proxy : DEMO.factors[i].proxy;
  });
  refill(TICKERS, LP ? LP.tickers : L ? rescaled(DEMO.tickers) : DEMO.tickers);
  refill(NAMES, LP ? { ...DEMO.names, ...LP.names } : DEMO.names);
  refill(SAMPLES, LP ? LP.samples : DEMO.samples);
  MEASURED_FIT = {};
  if (LP) (LP.results || []).forEach(r => {
    const s = LP.samples.find(x => x.id === r.sample);
    if (s && r.fit != null) MEASURED_FIT[holdingsKey(s.h.map(([t, u, a]) => ({ t, u, a })))] = r.fit;
  });
  refill(EVENTS, L ? L.events : DEMO.events);
  refill(LINKS, L ? L.links : DEMO.links);
  refill(REPLAY, L && LIVE_REPLAY ? LIVE_REPLAY : DEMO.replay);
  REPLAY_SOURCE = L && LIVE_REPLAY ? 'engine' : 'demo';
  DATASET = L ? 'live' : 'demo';
  EXPOSURES = LP ? 'live' : 'demo';
  CALIBRATION = L && L.calibration && L.calibration.markets > 0 ? L.calibration : null;
  JOINT_WEIGHT = L && typeof L.jointWeight === 'number' ? L.jointWeight : null;
  return DATASET;
}

/* The illustrative exposures are per typical move of the prototype's factors, and a snapshot's jumps are in the typical
   moves it measured. Rescaling keeps each exposure's size per unit of its factor (per 1% on the S&P 500, per basis
   point on the 10-year yield): the step the engine takes when a snapshot's typical moves differ from today's. */
function rescaled(tickers) {
  const r = FACTORS.map((f, k) => f.typical / DEMO.factors[k].typical);
  return Object.fromEntries(Object.entries(tickers).map(([t, v]) => [t, { ...v, b: v.b.map((x, k) => x * r[k]) }]));
}

/* "2026-11-08T14:05:00+00:00" -> "Nov 8, 2026, 14:05 UTC" */
function fmtStamp(iso) {
  const t = new Date(iso); if (isNaN(t)) return iso;
  const p = n => String(n).padStart(2, '0');
  return MONTHS[t.getUTCMonth()] + ' ' + t.getUTCDate() + ', ' + t.getUTCFullYear() + ', ' + p(t.getUTCHours()) + ':' + p(t.getUTCMinutes()) + ' UTC';
}

/* Calibrated odds. A snapshot carries the backend's study of resolved markets (`redkeep calibrate`) once one has run;
   before that its calibrated odds equal market odds. The illustrative data shades long shots by hand. */
let CALIBRATION = null;
/* What Tweaks says calibrated odds do. The illustrative data shades long shots by hand; a snapshot's odds move only

// True once the element's bottom edge has scrolled up past `offset` pixels from the top.
function useScrolledPast(ref, offset, enabled) {
  const [past, setPast] = useState(false);
  useEffect(() => {
    if (!enabled) return undefined;
    let raf = 0;
    const check = () => { raf = 0; const el = ref.current; if (el) setPast(el.getBoundingClientRect().bottom <= offset); };
    const on = () => { if (!raf) raf = requestAnimationFrame(check); };
    check();
    window.addEventListener('scroll', on, { passive: true }); window.addEventListener('resize', on);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('scroll', on); window.removeEventListener('resize', on); };
  }, [enabled, offset]);
  return past;
}

// True while the element passes under the floating nav, that is, it spans the line `offset` px from the top.
function useUnderNav(ref, offset, enabled) {
  const [under, setUnder] = useState(false);
  useEffect(() => {
    if (!enabled) { setUnder(false); return undefined; }
    let raf = 0;
    const check = () => { raf = 0; const el = ref.current; if (el) { const b = el.getBoundingClientRect(); setUnder(b.top <= offset && b.bottom > offset); } };
    const on = () => { if (!raf) raf = requestAnimationFrame(check); };
    check();
    window.addEventListener('scroll', on, { passive: true }); window.addEventListener('resize', on);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('scroll', on); window.removeEventListener('resize', on); };

}

      const ids = [hover, sel].concat(want.map(e => e.id)).filter((v, i, a) => v && a.indexOf(v) === i);

        const p = pts.find(q => q.e.id === id); if (!p) return;

        ctx.font = font; const t = p.e.s; const w = ctx.measureText(t).width;

      });

      }
      // tooltip follows the hovered dot

      if (tipEl) {

        if (p) {

    const pos = ev => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };

/* ---------- the flat view: impact against odds, with equal-swing curves ---------- */
function SvgDot({ x, y, r, tier, color, hl }) {
  const solid = tier === 'A' || tier === 'B';
  return html`<g>
    ${solid ? html`<circle cx=${x} cy=${y} r=${r} style=${{ fill: color, stroke: 'var(--surface)', strokeWidth: 1.5 }} />`
      : html`<circle cx=${x} cy=${y} r=${Math.max(1, r - 0.9)} style=${{ fill: color, fillOpacity: 0.14, stroke: color, strokeWidth: 1.8, strokeDasharray: tier === 'D' ? '3 2.5' : 'none' }} />`}
    ${tier === 'B' && html`<circle cx=${x} cy=${y} r=${r * 0.52} style=${{ fill: 'none', stroke: 'var(--surface)', strokeWidth: Math.max(1.2, r * 0.18) }} />`}
    ${hl && html`<circle cx=${x} cy=${y} r=${r + 4} style=${{ fill: 'none', stroke: 'var(--accent)', strokeWidth: 2 }} />`}
  </g>`;
}

function Scatter2D({ evs, hover, setHover, sel, onOpen, tw }) {
  const ref = useRef(null); const W = Math.max(300, useWidth(ref, 640)), H = Math.round(clamp(W * 0.66, 300, 440)), m = { l: 44, r: 16, t: 14, b: 44 };
