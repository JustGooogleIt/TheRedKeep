  const ranked = evs.slice().sort((a, b) => b.swing - a.swing);
  const lab = new Set((tw.labels === 'none' ? [] : ranked.slice(0, tw.labels === 'all' ? 99 : 5)).map(e => e.id));
  const levels = ranked.length ? [ranked[0].swingPct, ranked[0].swingPct / 2] : [];
  const contour = (c, s) => {
    const pts = []; for (let i = 1; i < 200; i++) { const q = i / 200; const x = s * c / Math.sqrt(q * (1 - q)); if (Math.abs(x) <= xm) pts.push(X(x).toFixed(1) + ',' + Y(q).toFixed(1)); }
    return pts.length > 1 ? 'M' + pts.join('L') : '';
  };
  const ticks = niceTicks(-xm, xm, 6);
  return html`<div className="flat" ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Events by what they would do to you and by their odds">
    ${[0, 0.25, 0.5, 0.75, 1].map(q => html`<g key=${'q' + q}><line x1=${m.l} x2=${W - m.r} y1=${Y(q)} y2=${Y(q)} style=${{ stroke: 'var(--line)' }} /><text x=${m.l - 8} y=${Y(q) + 3} textAnchor="end" className="ax">${q * 100}%</text></g>`)}
    ${ticks.map(v => html`<text key=${'x' + v} x=${X(v)} y=${H - m.b + 16} textAnchor="middle" className="ax">${fmtPct(v, 0)}</text>`)}
    <line x1=${X(0)} x2=${X(0)} y1=${m.t} y2=${H - m.b} style=${{ stroke: 'var(--line-2)' }} />
    ${levels.map((c, i) => html`<g key=${'c' + i}><path d=${contour(c, -1)} style=${{ fill: 'none', stroke: 'var(--ink-3)', strokeDasharray: '3 4', opacity: 0.55 }} /><path d=${contour(c, 1)} style=${{ fill: 'none', stroke: 'var(--ink-3)', strokeDasharray: '3 4', opacity: 0.55 }} /></g>`)}

    <text x=${W - m.r} y=${H - 8} textAnchor="end" className="ax">helps you →</text>

    <text x=${m.l + 4} y=${m.t + 10} className="ax">odds ↑</text>

      <${SvgDot} x=${X(e.dT)} y=${Y(e.qEff)} r=${R(e)} tier=${e.tier} color=${e.dT < 0 ? 'var(--loss)' : 'var(--gain)'} hl=${hover === e.id || sel === e.id} /></g>`)}

/* ---------- simulated outcomes ---------- */
function OutcomeCard({ sim, P, S, tw, onOpen }) {
  const V = P.V; const { lo, hi, bw, bins } = sim.hist; const mx = Math.max(1, ...bins);
  const hRef = useRef(null); const W = Math.max(300, useWidth(hRef, 600)), H = 180, m = { l: 8, r: 8, t: 14, b: 26 };
  const X = v => m.l + (v - lo) / (hi - lo) * (W - m.l - m.r);
  const bh = c => c / mx * (H - m.t - m.b);
  const ticks = niceTicks(lo, hi, 6); const dp = ticks.length > 1 && Math.abs(ticks[1] - ticks[0]) < 1 ? 1 : 0;
  const drivers = sim.drivers.map(d => {
    const yes = d.tail >= d.base; const fb = yes ? d.base : 1 - d.base, ft = yes ? d.tail : 1 - d.tail;
    return { ...d, yes, fb, ft, lift: ft - fb };

  return html`<section className="card" aria-labelledby="oc-h">
    <div className="card-head"><div><span className="kicker">Simulation · ${sim.n.toLocaleString('en-US')} joint scenarios</span><h3 className="h3" id="oc-h" style=${{ marginTop: 6 }}>Range of outcomes by ${horizonEnd(tw.horizon)}</h3>
      <p className="sub">Events are drawn together over the graph, so linked ones tend to happen together. ${tw.noise ? 'Includes everyday market noise.' : 'Event moves only, no everyday noise.'}</p></div></div>
    <div className="hist" ref=${hRef}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label=${'Histogram of outcomes. A 1 in 20 chance of ' + fmtPct(sim.p5) + ' or worse.'}>
      ${bins.map((c, i) => { const x0 = lo + i * bw; const tail = x0 + bw / 2 <= sim.p5; return c ? html`<rect key=${i} x=${X(x0) + 0.5} y=${H - m.b - bh(c)} width=${Math.max(0.6, X(x0 + bw) - X(x0) - 1)} height=${bh(c)} rx="1" style=${{ fill: tail ? 'var(--loss)' : 'var(--line-2)' }} />` : null; })}
      <line x1=${m.l} x2=${W - m.r} y1=${H - m.b} y2=${H - m.b} style=${{ stroke: 'var(--line-2)' }} />
      ${ticks.map(v => html`<text key=${'t' + v} x=${X(v)} y=${H - 8} textAnchor="middle" className="ax">${fmtPct(v, dp)}</text>`)}
      ${lo < 0 && hi > 0 && html`<line x1=${X(0)} x2=${X(0)} y1=${m.t} y2=${H - m.b} style=${{ stroke: 'var(--ink-3)', strokeDasharray: '2 3' }} />`}
      <line x1=${X(sim.p5)} x2=${X(sim.p5)} y1=${m.t} y2=${H - m.b} style=${{ stroke: 'var(--loss)', strokeWidth: 1.5 }} />
      <text x=${X(sim.p5) < 70 ? X(sim.p5) + 5 : X(sim.p5) - 5} y=${m.t + 8} textAnchor=${X(sim.p5) < 70 ? 'start' : 'end'} className="ax">1 in 20</text>
    </svg></div>
    <div className="stats">
      <div className="stat"><span className="label">Median</span><span className=${cls('v', tone(sim.p50))}>${fmtUsd(sim.p50 * V / 100, true)}</span></div>
      <div className="stat"><span className="label">Worst 1 in 20</span><span className=${cls('v', tone(sim.p5))}>${fmtUsd(sim.p5 * V / 100, true)}</span></div>
      <div className="stat"><span className="label">Best 1 in 20</span><span className=${cls('v', tone(sim.p95))}>${fmtUsd(sim.p95 * V / 100, true)}</span></div>
      <div className="stat"><span className="label">Worst 5% average</span><span className=${cls('v', tone(sim.es))}>${fmtUsd(sim.es * V / 100, true)}</span></div>
    </div>
    ${drivers.length > 0 && html`<ul className="drivers"><li className="drv-head"><span className="label">What the worst 5% have in common</span>
      <span className="drv-key" aria-hidden="true"><i style=${{ background: 'var(--ink-3)' }}></i><span>Overall</span><i style=${{ background: 'var(--loss)' }}></i><span>In the worst 5%</span></span></li>${drivers.map(d => html`<li key=${d.id}>
      <button className="inl" onClick=${() => onOpen(d.id)}>${S.byId[d.id].s}</button> ${d.yes ? 'happens' : 'doesn’t happen'} in <b>${pct0(d.ft)}</b> of the worst 5%, against ${pct0(d.fb)} overall.
      <div className="drv-bars" aria-hidden="true"><div className="drv-bar"><i style=${{ width: d.fb * 100 + '%', background: 'var(--ink-3)' }}></i></div><div className="drv-bar"><i style=${{ width: d.ft * 100 + '%', background: 'var(--loss)' }}></i></div></div></li>`)}</ul>`}
    <p className="note">${tw.odds === 'calibrated' ? 'With calibrated odds the average is ' + fmtPct(sim.mean, 2) + '. That is the engine’s edge over market prices, a hint rather than a forecast.' : 'The average is about zero (' + fmtPct(sim.mean, 2) + ') because market odds are already in today’s prices. What is left is the swing.'}</p>
  </section>`;
}

/* ---------- live feed / overnight changes ---------- */
function FeedCard({ live, setLive, feed, S, P, onOpen, hasLive, resetLive }) {
  const V = P.V;
  const overnight = useMemo(() => S.evs.filter(e => e.hist && e.inH && !e.resolved)
    .map(e => ({ e, dq: e.q0 - e.hist.y, usd: (e.q0 - e.hist.y) * e.dT * V / 100 }))
    .filter(x => Math.abs(x.dq) >= 0.005).sort((a, b) => Math.abs(b.usd) - Math.abs(a.usd)).slice(0, 6), [S, V]);
  return html`<section className="card" aria-labelledby="fd-h">
    <div className="card-head">
      <div><span className="kicker">${live ? 'Live · simulated odds' : 'Since yesterday'}</span><h3 className="h3" id="fd-h" style=${{ marginTop: 6 }}>${live ? 'Odds moving now' : 'What moved overnight'}</h3>
        <p className="sub">${live ? 'Each odds change is priced through your portfolio the moment it happens: the change in odds times what the event does to you.' : 'Overnight odds changes, priced for your portfolio: the change in odds times what the event does to you.'}</p></div>
      <button className=${cls('btn-ghost', live && 'on')} onClick=${() => setLive(!live)} aria-pressed=${live}><i className="dot-live"></i>${live ? 'Pause' : 'Go live'}</button>
    </div>
    ${live ? (feed.length ? html`<ul className="feed" aria-live="polite">${feed.slice(0, 8).map(f => html`<li key=${f.k}>
        <button className="inl f-t" onClick=${() => onOpen(f.id)}>${S.byId[f.id].s}</button><span className=${cls('f-v', tone(f.usd))}>${fmtUsd(f.usd, true)}</span>
        <span className="f-m">${f.time} · odds ${fmtOdds(f.q0)} → ${fmtOdds(f.q1)}</span></li>`)}</ul>` : html`<p className="sub">Waiting for the first odds change…</p>`)
      : html`<ul className="feed">${overnight.map(x => html`<li key=${x.e.id}>
        <button className="inl f-t" onClick=${() => onOpen(x.e.id)}>${x.e.s}</button><span className=${cls('f-v', tone(x.usd))}>${fmtUsd(x.usd, true)}</span>
        <span className="f-m">odds ${fmtOdds(x.e.hist.y)} → ${fmtOdds(x.e.q0)} (${fmtPts(x.dq)})</span></li>`)}</ul>`}
    ${!live && hasLive && html`<p className="list-foot sub" style=${{ marginLeft: 0 }}>Odds include your live session. <button className="link" onClick=${resetLive}>Back to snapshot odds</button></p>`}
  </section>`;
}

/* ==========================================================================
   UI · Part 3: the dragon story between the hero and the engine.
   Modelled on the manifesto on castle.tech, where a short text lights up word
   by word over knights drawn in dark green. Here the drawing is the Crimson
   Flight dragon, ported from its study (scene.js): each frame paints a
   low-resolution colour scene into an offscreen buffer, then prints it as a
   fixed grid of digits. A clock drives the wingbeats, body lift, tail wave and
   flame flicker, so they keep moving when scrolling stops; scroll moves the
   story along, grows the fire and brings the dragon up out of the dark.
   Everything the component touches is reached through refs, and every frame,
   observer and listener it starts is stopped when it unmounts.
   ========================================================================== */
// The story, in three chapters. {braces} mark the words that light up in crimson.
// Every claim matches DESIGN.md: look-through (6.1), priced in (3, 4.2), the event graph (4.4),
// the market quorum (4.6) and ranking by swing (4.3). The one aside is where the name comes from.
const DRAGON_STORY = [
  { ch: 0, text: 'Tariffs. Recessions. A surprise from the Fed. Every portfolio has {dragons}, and none of them show up on your statement.' },
  { ch: 0, text: 'You don’t really own QQQ. You own a hundred companies, a bet on interest rates and a quiet exposure to China.' },
  { ch: 0, big: true, text: 'Here be dragons.' },
  { ch: 1, text: 'Up close, every dragon is {made} {of} {numbers}: the odds that it comes, how hard it hits, and how much of that the market already expects.' },
  { ch: 1, text: 'If markets give tariffs a 40% chance, 40% of the damage is already in the price. The Red Keep counts only {the} {surprise}.' },
  { ch: 1, text: 'Dragons rarely fly alone. Tariffs make a recession likelier, so it follows the chain and counts each blow once.' },
  { ch: 1, text: 'It trusts a number only when two markets agree.' },
  { ch: 1, text: 'And it ranks every dragon by how far it could still {swing} you, not by how loud its headline is.' },
  { ch: 2, text: 'Every castle needs a {keep}: the tallest tower, the one you climb to see what’s coming.' },
  { ch: 2, text: 'My favorite castle in Game of Thrones is the Red Keep. It never saw the dragon coming.' },
  { ch: 2, big: true, text: 'This one watches for dragons.' },
];
const DRAGON_CHAPTERS = ['What you really own', 'Made of numbers', 'The keep'];
const DRAGON_STILL_PHASE = 0;          // the wing pose shown when motion is reduced
const DRAGON_DIGITS = '0123456789'.split('');
// The faint castle behind the dragon: the area of citadel.png that scene.js samples, which leaves out
// the artwork's own dragon. build.py inlines it as a data URL, so the canvas can always read it back.
const DRAGON_CITADEL = typeof RK_CITADEL === 'string' ? RK_CITADEL : 'citadel.webp';
const clamp01 = x => Math.max(0, Math.min(1, x));

/* Owns the two canvases. The drawing below follows scene.js line for line;
   only its globals became arguments (progress, clock, wing phase, brightness, image),
   plus where the dragon sits (cx, cy, as shares of the width and height; scene.js uses .5 and .57). */
function makeDragonPainter(canvas) {
  const ctx = canvas.getContext('2d', { alpha: false });
  const buffer = document.createElement('canvas'), b = buffer.getContext('2d', { willReadFrequently: true });
  const mix = (a, z, t) => a + (z - a) * t;
  let W = 0, H = 0, cols = 0, rows = 0, cell = 9;

  function resize(w, h) {
    W = w; H = h; cell = W < 650 ? 6 : 7;
    cols = Math.ceil(W / cell); rows = Math.ceil(H / (cell * 1.35));
    const d = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * d); canvas.height = Math.round(H * d); ctx.setTransform(d, 0, 0, d, 0, 0);
    buffer.width = cols; buffer.height = rows;
  }

  function shape(path, fill, stroke, width = 1) {
    const p = new Path2D(path);
    if (fill) { b.fillStyle = fill; b.fill(p); }
    if (stroke) { b.strokeStyle = stroke; b.lineWidth = width; b.stroke(p); }
  }

  // Dorsal anatomy: long neck, narrow torso, articulated wing fingers and tapered tail.
  function dragon(x, y, size, phase) {
    b.save(); b.translate(x, y); b.scale(size, size);
    // Each joint has its own phase: the shoulder drives, the wrist follows,
    // and the outer fingers flex last. The span stays open throughout the stroke.
    for (const side of [-1, 1]) {
      b.save(); b.scale(side, 1);
      const drive = Math.sin(phase), wristBeat = Math.sin(phase - .28), tipBeat = Math.sin(phase - .56);
      const elbow = { x: 35, y: -11 + drive * 12 };
      const wrist = { x: 69 + 3 * Math.cos(phase), y: -21 + wristBeat * 28 };
      const tip = { x: 143 - 7 * Math.cos(phase), y: -25 + tipBeat * 62 };
      const fingers = [tip, { x: 115, y: 22 + Math.sin(phase - .68) * 49 }, { x: 79, y: 43 + Math.sin(phase - .52) * 33 }, { x: 40, y: 36 + Math.sin(phase - .32) * 15 }];
      const [, f1, f2, f3] = fingers;
      const outline = `M 6 -4 Q 19 ${elbow.y - 6} ${elbow.x} ${elbow.y} Q 52 ${wrist.y - 8} ${wrist.x} ${wrist.y} Q 108 ${tip.y - 10} ${tip.x} ${tip.y} Q ${f1.x - 5} ${mix(tip.y, f1.y, .6)} ${f1.x} ${f1.y} Q ${f2.x + 14} ${f2.y - 20} ${f2.x} ${f2.y} Q ${f3.x + 17} ${f3.y - 16} ${f3.x} ${f3.y} Q 20 11 6 13 Z`;
      const membrane = b.createLinearGradient(12, wrist.y - 20, 90, 46);
      membrane.addColorStop(0, '#4d1735'); membrane.addColorStop(.3, '#db426a'); membrane.addColorStop(.65, '#862c50'); membrane.addColorStop(1, '#43132e');
      shape(outline, membrane, '#df799c', .7);
      b.save(); b.clip(new Path2D(outline));
      // Thin light and shadow bands move with the flexing membrane.
      for (let j = 0; j < 170; j++) { const xx = 13 + (j * 37.73) % 129, yy = -85 + (j * 13.19) % 195; b.fillStyle = j % 3 ? '#f69fb72b' : '#21071755'; b.fillRect(xx, yy, .8, 1.1); }
      for (let i = 0; i < fingers.length; i++) {
        const f = fingers[i];
        for (let j = 1; j < 5; j++) { const t = j / 5; shape(`M ${mix(8, f.x, t)} ${mix(8, f.y, t)} Q ${mix(wrist.x, f.x, t)} ${mix(wrist.y, f.y, t) + 4} ${f.x} ${f.y}`, null, '#f094b240', .55); }
      }
      b.restore();
      // The strong upper arm and four supporting fingers remain visible at every angle.
      shape(`M 6 -4 Q 19 ${elbow.y - 6} ${elbow.x} ${elbow.y} Q 52 ${wrist.y - 8} ${wrist.x} ${wrist.y} Q 108 ${tip.y - 10} ${tip.x} ${tip.y}`, null, '#efacc2', 1.7);
      for (let i = 1; i < fingers.length; i++) { const f = fingers[i]; shape(`M ${wrist.x} ${wrist.y} Q ${mix(wrist.x, f.x, .55)} ${mix(wrist.y, f.y, .55) - 5} ${f.x} ${f.y}`, null, '#ef99b4', .9); }
      shape(`M 7 5 Q 25 ${elbow.y + 7} ${elbow.x} ${elbow.y + 2} Q 53 ${wrist.y + 2} ${wrist.x} ${wrist.y}`, null, '#4c1836', 2.3);
      shape(`M ${wrist.x - 1} ${wrist.y} L ${wrist.x + 1} ${wrist.y - 9} L ${wrist.x + 5} ${wrist.y + 1}`, '#edb0c3', null);
      b.restore();
    }
    // A continuous taper follows a broad, trailing S-curve. Motion travels
    // down its length, so the tip follows the hips instead of wagging as a unit.
    function tailPoint(t) {
      const wave = phase * .58;
      // No fixed sideways bend: the entire curve crosses the centerline.
      // Increasing amplitude and delayed phase let the tip trail the hips.
      const xx = (Math.sin(wave - t * 2.6) * 30 + Math.sin(wave - t * 4.3) * 5) * t ** 1.25;
      return { x: xx, y: 28 + 57 * t - 5 * t * t + Math.cos(wave - t * 2.6) * 1.6 * t };
    }
    const spine = [], left = [], right = [];
    for (let i = 0; i <= 70; i++) {
      const t = i / 70, pt = tailPoint(t), next = tailPoint(Math.min(1, t + .002)), prev = tailPoint(Math.max(0, t - .002));
      const dx = next.x - prev.x, dy = next.y - prev.y, len = Math.hypot(dx, dy) || 1, nx = dy / len, ny = -dx / len, r = 5.4 * (1 - t) ** 1.3 + .06;
      spine.push({ ...pt, nx, ny, r, t }); left.push({ x: pt.x - nx * r, y: pt.y - ny * r }); right.push({ x: pt.x + nx * r, y: pt.y + ny * r });
    }
    b.beginPath(); left.forEach((pt, i) => (i ? b.lineTo(pt.x, pt.y) : b.moveTo(pt.x, pt.y))); right.slice().reverse().forEach(pt => b.lineTo(pt.x, pt.y)); b.closePath();
    const tailShade = b.createLinearGradient(-6, 35, 29, 78);
    tailShade.addColorStop(0, '#bd5b80'); tailShade.addColorStop(.35, '#67213f'); tailShade.addColorStop(.65, '#cc6d93'); tailShade.addColorStop(1, '#45152e');
    b.fillStyle = tailShade; b.fill(); b.strokeStyle = '#ce7d9c'; b.lineWidth = .5; b.stroke();
    // A narrow illuminated ridge and small diminishing dorsal scales.
    b.beginPath(); spine.forEach((pt, i) => (i ? b.lineTo(pt.x - pt.nx * pt.r * .2, pt.y - pt.ny * pt.r * .2) : b.moveTo(pt.x, pt.y))); b.strokeStyle = '#eea5bd'; b.lineWidth = .62; b.stroke();
    for (let i = 4; i < 59; i += 5) {
      const pt = spine[i], tp = spine[i + 2], h = (1 - pt.t) * 2.7;
      shape(`M ${pt.x} ${pt.y} L ${pt.x - pt.nx * h} ${pt.y - pt.ny * h - 1.6} L ${tp.x} ${tp.y}`, '#d78fab', null);
      shape(`M ${left[i].x} ${left[i].y} Q ${pt.x} ${pt.y + 1.5} ${right[i].x} ${right[i].y}`, null, '#f3adc642', .4);
    }
    const body = b.createLinearGradient(-9, 0, 9, 0);
    body.addColorStop(0, '#2c0b20'); body.addColorStop(.4, '#be567e'); body.addColorStop(.56, '#f4acc2'); body.addColorStop(.7, '#9a355a'); body.addColorStop(1, '#230917');
    shape('M -3 -47 C -3 -34 -8 -24 -8 -9 C -14 1 -10 18 -7 30 Q -4 39 0 40 Q 6 35 7 27 C 9 15 13 1 7 -9 C 6 -24 3 -34 3 -47 Z', body, '#bd6a8f', .6);
    // Long folded hind legs and separated hooked talons.
    for (const side of [-1, 1]) { b.save(); b.scale(side, 1); shape('M 6 15 Q 16 23 11 36 L 15 45 L 12 43 L 10 46 L 10 41 L 7 43 L 7 37 Q 8 29 4 26 Z', '#73304f', '#d98fa6', .6); b.restore(); }
    // Segmented scales and a pale dorsal ridge bring depth through the numerical shading.
    for (let j = 0; j < 24; j++) {
      const yy = -42 + j * 3.2, ww = yy < -12 ? 2.2 : yy > 27 ? 3 : 6.1;
      shape(`M ${-ww} ${yy} Q 0 ${yy + 3} ${ww} ${yy}`, null, j % 2 ? '#f29ab6' : '#662144', .44);
      shape(`M 0 ${yy} L -1.5 ${yy + 3} L 1 ${yy + 2}`, '#f2a9bd', null);
    }
    shape('M -3 -47 L -5 -53 L -3 -59 L -1 -62 L 2 -62 L 4 -58 L 5 -53 L 3 -47 Z', body, '#ed9db5', .6);
    shape('M -4 -53 L -9 -49 L -5 -59 M 4 -53 L 9 -49 L 5 -59', null, '#eaa6be', 1);
    b.fillStyle = '#ffc5ad'; b.fillRect(-3, -57, 1, .8); b.fillRect(2, -57, 1, .8);
    b.restore();
    return { x, y: y - 62 * size };
  }

  function paint({ p, clock, phase, bright, citadel, cx = .5, cy = .57 }) {
    if (!cols || !rows) return;
    b.globalAlpha = 1; b.fillStyle = '#12050c'; b.fillRect(0, 0, cols, rows);
    const sky = b.createLinearGradient(0, 0, 0, rows);
    sky.addColorStop(0, '#30111f'); sky.addColorStop(.55, '#321322'); sky.addColorStop(1, '#0c0308');
    b.fillStyle = sky; b.fillRect(0, 0, cols, rows);
    // The castle drifts slightly as you scroll (citadel is already cropped to the castle area).
    if (citadel) {
      b.save(); b.globalAlpha = .19;
      const cw = cols * 1.1, ch = rows * .78;
      b.drawImage(citadel, 0, 0, citadel.naturalWidth, citadel.naturalHeight, -cols * .04 - p * cols * .035, rows * .37 - p * rows * .025, cw, ch);
      b.globalCompositeOperation = 'multiply'; b.fillStyle = '#ba4b6d'; b.fillRect(0, rows * .37, cols, rows);
      b.restore();
    }
    const veil = b.createLinearGradient(0, rows * .35, 0, rows * .52);
    veil.addColorStop(0, '#321322'); veil.addColorStop(1, '#32132200');
    b.fillStyle = veil; b.fillRect(0, rows * .35, cols, rows * .18);
    // One finely articulated dragon holds the center while scrolling brings it closer.
    const size = Math.min(cols / 340, rows / 205) * (1 + p * .055);
    const x = cols * (cx + Math.sin(p * 2) * .012), y = rows * cy - Math.sin(clock * 2.65 - .4) * 1.25;
    const mouth = dragon(x, y, size, phase);
    const fire = clamp01((p - .08) / .77);
    if (fire > 0) {
      const length = rows * .10 + rows * .45 * fire, width = 1 + fire * 5.5;
      const glow = b.createRadialGradient(mouth.x, mouth.y - length * .55, 0, mouth.x, mouth.y - length * .55, length * .8);
      glow.addColorStop(0, '#da244744'); glow.addColorStop(1, '#da244700');
      b.fillStyle = glow; b.fillRect(0, 0, cols, rows);
      // Nested rising tongues: narrow at the mouth, billowing into a growing plume.
      for (let layer = 0; layer < 3; layer++) {
        b.beginPath(); b.moveTo(mouth.x - .65, mouth.y);
        for (let i = 0; i <= 36; i++) {
          const t = i / 36, yy = mouth.y - t * length, envelope = Math.sin(Math.PI * t * .92) * width * (1 - layer * .28);
          const curl = Math.sin(t * 12 - clock * 4 + layer) * t * 2 + Math.sin(t * 28 - clock * 6) * t;
          b.lineTo(mouth.x - envelope + curl, yy);
        }
        for (let i = 36; i >= 0; i--) {
          const t = i / 36, envelope = Math.sin(Math.PI * t * .92) * width * (1 - layer * .28);
          const curl = Math.sin(t * 12 - clock * 4 + layer) * t * 2 + Math.sin(t * 25 - clock * 5) * t;
          b.lineTo(mouth.x + envelope + curl, mouth.y - t * length);
        }
        b.closePath(); b.fillStyle = ['#a92249', '#f24b65', '#ffb39b'][layer]; b.fill();
      }
      for (let i = 0; i < 65; i++) {
        const t = (clock * .23 + i * .071) % 1, side = Math.sin(i * 9.31);
        const xx = mouth.x + side * (3 + t * width * 2) + Math.sin(clock + i) * t * 2, yy = mouth.y - t * length * 1.2;
        b.globalAlpha = (1 - t) * fire; b.fillStyle = i % 4 ? '#ef4564' : '#ffc1a5'; b.fillRect(xx, yy, .5, .7);
      }
      b.globalAlpha = 1;
    }
    // Print the buffer as digits on a grid that never moves: brighter pixels get denser digits.
    const pix = b.getImageData(0, 0, cols, rows).data;
    ctx.fillStyle = '#11040b'; ctx.fillRect(0, 0, W, H);
    ctx.font = `${cell + 1}px "Courier New",monospace`; ctx.textBaseline = 'top';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const k = (r * cols + c) * 4, R = pix[k], G = pix[k + 1], B = pix[k + 2];
        const lum = (R * .36 + G * .45 + B * .19) / 255, density = clamp01(lum * 1.6);
        const noise = ((c * 73 + r * 37) % 101) / 101;
        const digit = Math.floor(clamp01(density * .7 + noise * .3) * 9);
        const red = Math.min(255, (R * .9 + 22) * bright), green = Math.min(210, (G * .65 + 5) * bright), blue = Math.min(230, (B * .77 + 8) * bright);
        ctx.fillStyle = `rgb(${red | 0},${green | 0},${blue | 0})`;
        ctx.fillText(DRAGON_DIGITS[digit], c * cell, r * cell * 1.35);
      }
    }
  }

  return { resize, paint };
}

/* One paragraph of the story, split into words so each can light up in turn. */
function storyWords(text) {
  const out = [];
  text.split(' ').forEach((tok, i) => {
    const m = tok.match(/^([^{]*)\{([^}]+)\}(.*)$/);
    if (i) out.push(' ');
    out.push(m ? html`<span className="dragon-w" key=${i}>${m[1]}<b>${m[2]}</b>${m[3]}</span>` : html`<span className="dragon-w" key=${i}>${tok}</span>`);
  });
  return out;
}

/* The story: a tall section whose sticky, full-viewport stage holds the dragon, with the
   text gliding up over it. Scrolling the section's length runs the story from 0 to 1.
   The composition lives in the stylesheet as custom properties on .dragon, so each layout
   (wide, tall, short) sets its own; they are read again on every resize. All are shares
   of the stage: the dragon's centre, where the text column's top starts, where its last line
   ends, and the line that words light up as they rise past. */
const STORY_LOOK = { '--dragon-x': .5, '--dragon-y': .57, '--story-start': .84, '--story-end': .54, '--story-light': .78 };   // fallbacks
const STORY_DIM = .12;     // opacity of a word that has not lit up yet, as on castle.tech
function storyLook(el) {
  const cs = getComputedStyle(el), o = {};
  for (const k in STORY_LOOK) { const v = parseFloat(cs.getPropertyValue(k)); o[k] = Number.isFinite(v) ? v : STORY_LOOK[k]; }
  return { x: o['--dragon-x'], y: o['--dragon-y'], start: o['--story-start'], end: o['--story-end'], light: o['--story-light'] };
}

function DragonScene({ tw, rootRef: outerRef }) {
  // The app may pass its own ref for the section (it uses it to darken the nav over the story).
  const ownRef = useRef(null), rootRef = outerRef || ownRef;
  const stageRef = useRef(null), canvasRef = useRef(null), colRef = useRef(null);
  const barRef = useRef(null), chapterNoRef = useRef(null), chapterNameRef = useRef(null);
  const look = useRef(null); look.current = { boost: tw.glow === 'bright', citadel: tw.citadel !== false };
  const redraw = useRef(null);
  useEffect(() => { if (redraw.current) redraw.current(); }, [tw.glow, tw.citadel]);

  useEffect(() => {
    const root = rootRef.current, stage = stageRef.current, canvas = canvasRef.current, col = colRef.current;
    const bar = barRef.current, chapterNo = chapterNoRef.current, chapterName = chapterNameRef.current;
    if (!root || !stage || !canvas || !col || !canvas.getContext) return undefined;
    const painter = makeDragonPainter(canvas);
    const mq = typeof matchMedia === 'function' ? matchMedia('(prefers-reduced-motion: reduce)') : null;
    let reduce = !!(mq && mq.matches);
    let raf = 0, visible = true, dirty = true, progress = 0, goal = 0, paintedAt = -1, chapter = 0, img = null;
    let stageH = 0, travel = 1, lines = [], at = storyLook(root);

    const size = () => painter.resize(stage.clientWidth || window.innerWidth, stage.clientHeight || window.innerHeight);
    // Where each paragraph sits in the column, and how far the column travels. The section is
    // exactly as tall as that travel, so the text moves at the speed of the page.
    function layout() {
      at = storyLook(root);
      stageH = stage.clientHeight || window.innerHeight;
      lines = Array.from(col.children, el => {
        const words = Array.from(el.children);
        return { top: el.offsetTop, h: el.offsetHeight, ch: +el.dataset.ch || 0, words, shown: words.map(() => -1), k: -1 };
      });
      travel = Math.max(1, col.offsetHeight + (at.start - at.end) * stageH);
      root.style.height = Math.round(stageH + travel) + 'px';
    }
    // All layout reads happen here, once per frame, before anything is written.
    const measure = () => { goal = clamp01(-root.getBoundingClientRect().top / travel); };
    // The castle backdrop is optional: load it the first time it is switched on.
    const citadel = () => {
      if (!look.current.citadel) return null;
      if (!img) { img = new Image(); img.decoding = 'async'; img.onload = () => { dirty = true; schedule(); }; img.src = DRAGON_CITADEL; }
      return img.complete && img.naturalWidth ? img : null;
    };
    function paint(now) {
      const p = progress, clock = reduce ? 0 : now / 1000;
      // The dragon comes up out of the dark over the first half of the story, to the study's own brightness.
      const t = clamp01(p / .5), rise = .78 + .22 * t * t * (3 - 2 * t);
      painter.paint({ p, clock, phase: reduce ? DRAGON_STILL_PHASE : clock * 2.65 + p * .6, bright: (look.current.boost ? 1.35 : 1) * rise, citadel: citadel(), cx: at.x, cy: at.y });
    }
    // The text, chapter marker and progress rail follow the same eased progress as the canvas.
    function place() {
      const p = progress, y = at.start * stageH - p * travel;
      col.style.transform = `translate3d(0,${y.toFixed(1)}px,0)`;
      let n = lines.length ? lines[0].ch : 0;
      for (const L of lines) {
        const top = y + L.top;
        // The chapter is the one being read: its paragraph has risen a fifth of the stage past the light line.
        if (top < (at.light - .2) * stageH) n = L.ch;
        // Words light up in reading order as their paragraph rises past the light line.
        const k = reduce ? L.words.length : clamp01((at.light * stageH - top) / Math.max(L.h * 1.15, .2 * stageH)) * L.words.length;
        if (k === L.k) continue;
        L.k = k;
        L.words.forEach((w, i) => {
          const o = clamp01(k - i);
          if (o !== L.shown[i]) { L.shown[i] = o; w.style.opacity = o >= 1 ? '' : (STORY_DIM + (1 - STORY_DIM) * o).toFixed(3); }
        });
      }
      bar.style.transform = `scaleX(${p})`;
      if (n !== chapter) { chapter = n; chapterNo.textContent = `0${n + 1} / 03`; chapterName.textContent = DRAGON_CHAPTERS[n]; }
    }
    function frame(now) {
      raf = 0; measure();
      if (reduce) { progress = goal; dirty = false; paint(0); place(); return; }   // one still frame, no loop
      progress += (goal - progress) * .10;
      if (dirty || now - paintedAt > 30) { paintedAt = now; dirty = false; paint(now); }
      place();
      if (visible) raf = requestAnimationFrame(frame);
    }
    function schedule() { if (!raf && visible) raf = requestAnimationFrame(frame); }
    function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }
    // Repaint at once after a resize, because resizing clears the canvas.
    const onResize = () => { size(); layout(); measure(); if (reduce) progress = goal; paint(reduce ? 0 : performance.now()); place(); };
    // The text reflows (a font arrives, the width changes): only the story's layout needs redoing.
    const onReflow = () => { layout(); measure(); place(); };
    const onScroll = () => { if (reduce) schedule(); };   // the running loop reads the scroll position itself
    const onMotionPref = () => { reduce = !!(mq && mq.matches); stop(); lines.forEach(L => { L.k = -1; }); dirty = true; schedule(); };
    const ro = typeof ResizeObserver === 'function'
      ? new ResizeObserver(entries => { if (entries.some(e => e.target === stage)) onResize(); else onReflow(); })
      : null;
    const io = typeof IntersectionObserver === 'function'
      ? new IntersectionObserver(entries => { visible = entries[entries.length - 1].isIntersecting; if (visible) { dirty = true; schedule(); } else stop(); })
      : null;

    size(); layout(); measure(); progress = goal; paint(reduce ? 0 : performance.now()); place();
    if (ro) { ro.observe(stage); ro.observe(col); } else window.addEventListener('resize', onResize);
    if (io) io.observe(root);
    window.addEventListener('scroll', onScroll, { passive: true });
    if (mq) { if (mq.addEventListener) mq.addEventListener('change', onMotionPref); else mq.addListener(onMotionPref); }
    redraw.current = () => { dirty = true; schedule(); };
    schedule();
    return () => {
      stop(); redraw.current = null;
      if (ro) ro.disconnect(); else window.removeEventListener('resize', onResize);
      if (io) io.disconnect();
      window.removeEventListener('scroll', onScroll);
      if (mq) { if (mq.removeEventListener) mq.removeEventListener('change', onMotionPref); else mq.removeListener(onMotionPref); }
      if (img) { img.onload = null; img = null; }
    };
  }, []);

  return html`<section className="dragon" ref=${rootRef} aria-label="Why The Red Keep starts with the dragons">
    <div className="dragon-stage" ref=${stageRef}>
      <canvas className="dragon-canvas" ref=${canvasRef} role="img" aria-label="A slender dragon drawn in crimson numbers beats its wings and breathes a plume of fire upward that grows as you scroll."></canvas>
      <div className="dragon-shade" aria-hidden="true"></div>
      <div className="dragon-copy">
        <div className="dragon-col" ref=${colRef}>
          ${DRAGON_STORY.map((b, i) => html`<p key=${i} className=${cls('dragon-p', b.big && 'big')} data-ch=${b.ch}>${storyWords(b.text)}</p>`)}
        </div>
      </div>
      <div className="dragon-hud" aria-hidden="true">
        <div className="dragon-chapter"><b ref=${chapterNoRef}>01 / 03</b><span ref=${chapterNameRef}>${DRAGON_CHAPTERS[0]}</span></div>
        <div className="dragon-rail"><i ref=${barRef}></i></div>
      </div>
    </div>
  </section>`;
}

/* ==========================================================================
   UI · Part 4: the methodology tab. A short tour in plain words: the
   priced-in idea, the seven steps on the analysis tab's strip, how the
   engine is tested and what it doesn't do yet. The math, the rejected
   alternatives and the references are in docs/DESIGN.md; the saved eval
   results quoted here are from docs/WRITEUP.md.
   ========================================================================== */

// The worked example in DESIGN.md section 3, with its illustrative numbers: $1M of QQQ, tariffs on China at 40%.
const M_EXAMPLE = { V: 1e6, direct: -6.0, knock: -2.5, q: 0.4 };
// Results of the saved eval runs (WRITEUP.md, "What the evals found"): E9's odds and E0's screen from Nov 8,
// 2026, E4's coverage over E3's 55 resolved markets from the jump study of Nov 13, E10's dollar clock
// (the share of a 4 p.m. move the series shows a day late) from Nov 13, and E11's joint error bars from Nov 13
// (the share of resolution days whose whole move landed inside each forecast's 80% zone). Update them when those
// evals rerun. The replay's numbers are not here: they come with the snapshot (REPLAY.metrics).
const M_EVALS = { brierMarket: 0.110, brierAI: 0.191, oddsMarkets: 250, covered: 0.83, jumpMarkets: 55, screenFinds: 0.96, screenSends: 0.38,
  lateNoon: 0.23, lateCarried: 0.06, jointDays: 47, insideJoint: 0.64, insideApart: 0.77, insideHalf: 0.79 };

function MethodExample({ P, top, onOpen }) {
  const { V, direct, knock, q } = M_EXAMPLE, dT = direct + knock;
  const ifYes = (1 - q) * dT, ifNo = -q * dT, sw = Math.abs(dT) * Math.sqrt(q * (1 - q));
  return html`<section className="card" aria-labelledby="m-ex-h">
    <div className="card-head"><div><span className="kicker">The core idea · an illustrative example</span><h3 className="h3" id="m-ex-h" style=${{ marginTop: 6 }}>Only the surprise counts</h3>
      <p className="sub">You hold $1M of QQQ, and prediction markets give US tariffs on China a 40% chance. If tariffs happen, QQQ falls about 8.5%: 6% directly, and 2.5% more because tariffs make a recession likelier. But at 40% odds, 40% of that fall is already in today’s price.</p></div></div>
    <${SplitBar} dT=${dT} q=${q} />
    <div className="three m-three">
      <div><span className="label">If tariffs happen</span><span className="v neg">${fmtUsd(ifYes * V / 100, true)}</span><span className="s">${fmtPct(ifYes)} · the surprise</span></div>
      <div><span className="label">If they don’t</span><span className="v pos">${fmtUsd(ifNo * V / 100, true)}</span><span className="s">${fmtPct(ifNo)} · the relief</span></div>
      <div><span className="label">Swing</span><span className="v">${swingUsd(sw * V / 100)}</span><span className="s">${swingPct(sw)} · either way</span></div>
    </div>
    <div className="formula">
      <div>full move ${fmtPct(dT)} = direct ${fmtPct(direct)} + knock-on through recession ${fmtPct(knock)}</div>
      <div>if it happens: (1 − ${q.toFixed(2)}) × ${fmtPct(dT)} = ${fmtPct(ifYes)}</div>
      <div>if it doesn’t: ${MINUS}${q.toFixed(2)} × ${fmtPct(dT)} = ${fmtPct(ifNo)}</div>
      <div>swing: ${Math.abs(dT).toFixed(1)}% × √(${q.toFixed(2)} × ${(1 - q).toFixed(2)}) = ${swingPct(sw)}</div>
    </div>
    <p className="m-p">Weighted by their odds, the two outcomes net to zero: that is what priced in means. So the engine ranks events by <b>swing</b>, how far each one could still move you either way. Swing is largest for coin flips with big moves, and small for events the market already treats as settled, however alarming the headline.</p>
    ${top && html`<p className="note">On your portfolio right now, the biggest swing is <button className="inl" onClick=${() => onOpen(top.id)}>${top.t}</button>: ${swingUsd(top.swingPct * P.V / 100)} at ${fmtOdds(top.qEff)} odds.</p>`}
  </section>`;
}

function MethodSteps({ tw }) {
  const listed = DATASET === 'live' && RK_LIVE.catalogue ? Object.values(RK_LIVE.catalogue).reduce((a, n) => a + (+n || 0), 0) : 0;
  const markets = listed >= 1000 ? 'Polymarket and Kalshi list about ' + (Math.round(listed / 1000) * 1000).toLocaleString('en-US') + ' markets.'
    : 'Polymarket and Kalshi list tens of thousands of markets.';
  const steps = [
    ['Look through', 'What you actually own', html`<p>Each fund is replaced by the companies it holds, and a company held several ways is added up, so a stock you own directly and through a fund shows as one line. A fund with no holdings data, or one that holds bonds, gold or futures rather than companies, stays whole and is measured from its own prices.</p>`],
    ['Exposure', 'Which way it leans', html`<p>The engine measures how each holding has moved with ten market factors, each tracked by a real price:</p>
      <div className="m-chips">${FACTORS.map(f => html`<span key=${f.k} className="m-chip">${f.name}<small>${f.proxy}</small></span>`)}</div>
      <p>Weighted by the holdings, that gives the portfolio’s arrow: how much it gains or loses when each factor makes a typical move, one standard deviation of its weekly change. Other factors join only when a portfolio needs them, and the fit is the share of its daily moves the factors explain, on prices the model didn’t see.</p>`],
    ['Discover', 'Events that could move you, and the event map', html`<p>${markets} Claude labels a sample of them, and a small model trained on those labels screens the rest: on markets it hadn’t seen, it kept ${pct0(M_EVALS.screenFinds)} of the ones that matter while sending Claude only ${pct0(M_EVALS.screenSends)}. The events that survive form a shared library, and each portfolio sees the ones that resolve inside its horizon, ${tw.horizon} months here.</p>`],
    ['Match', 'Each event’s card, under Matched market', html`<p>An event takes its odds from a market only if the market asks the same question: the same threshold, deadline and source. Claude judges each candidate against a fixed rubric and quotes the rule it relied on. When nothing fits, the event is marked unpriced and the rejected near-misses are shown with the reason, instead of borrowing the nearest market’s odds.</p>`],
    ['Evidence', 'Each event’s card, under How big is the jump?', html`<p>How far each factor jumps if the event happens is measured, not guessed: from how prices moved on the days the event’s odds moved sharply, from Hyperliquid’s perps on weekends while stock markets are shut, from past similar events, and from an AI prior. Each reading carries an error bar, and they are averaged by their precision. Then each event gets a tier:</p>
      <ul className="m-tiers">${['A', 'B', 'C', 'D'].map(t => html`<li key=${t}><span className=${'tier show t' + t}><b>${t}</b><span>${TIERS[t].name}</span></span><span>${TIERS[t].rule}</span></li>`)}</ul>`],
    ['Graph', 'Each event’s card, under Knock-on effects', html`<p>Some events make others likelier: tariffs raise the odds of a recession. An event’s full move adds the moves it sets off along those links, so each blow is counted once. Links are checked against how the two events’ odds have moved together, and related prices against the rules of probability.</p>`],
    ['Simulate', 'Range of outcomes', html`<p>Thousands of futures are drawn together over the graph at market odds, so linked events tend to happen together. The average comes out near zero, because those odds are already in today’s prices. What is left is the spread: the worst 1 in 20, and what the worst futures have in common.</p>`],
  ];
  return html`<section className="card" aria-labelledby="m-steps-h">
    <div className="card-head"><div><span className="kicker">From portfolio to ranked events</span><h3 className="h3" id="m-steps-h" style=${{ marginTop: 6 }}>Seven steps</h3></div></div>
    <ol className="m-steps">${steps.map(([t, where, body], i) => html`<li key=${t} className="m-step">
      <div className="m-step-h"><span className="m-n">${String(i + 1).padStart(2, '0')}</span><h4 className="m-step-t">${t}</h4></div>
      <div className="m-step-b">${body}<p className="m-where"><span className="label">On the page</span><span>${where}</span></p></div>
    </li>`)}</ol>
  </section>`;
}

function MethodTests({ goTab }) {
  const ex = REPLAY_SOURCE === 'engine' && REPLAY.metrics ? REPLAY.metrics.explained : null;
  return html`<section className="card" aria-labelledby="m-test-h">
    <div className="card-head"><div><span className="kicker">How it’s tested</span><h3 className="h3" id="m-test-h" style=${{ marginTop: 6 }}>Checked against what happened</h3>
      <p className="sub">Each test’s measure was written down before its first run, and one of them asks whether the engine beats simply asking an AI.</p></div></div>
    <div className="m-tests">
      <div className="tile m-tile"><span className="label">Odds · markets vs an AI</span><div className="tile-v">${M_EVALS.brierMarket.toFixed(3)} <small>vs</small> ${M_EVALS.brierAI.toFixed(3)}</div>
        <div className="tile-s">Brier score, lower is better, on ${M_EVALS.oddsMarkets} markets that resolved after Claude’s training data. The markets won, so a market sets the odds wherever one fits.</div></div>
      ${ex && ex.explained_share != null
        ? html`<button className="tile m-tile" onClick=${() => goTab('replay')}><span className="label">Replay · April 2025</span><div className="tile-v">${fmtShare(ex.explained_share)}</div>
            <div className="tile-s">of the daily factor moves came from the events’ jumps times their odds changes, rerunning the engine evening by evening on archived prices. Right sign on ${ex.big_days_right} of ${ex.big_days} big moves.</div></button>`
        : html`<button className="tile m-tile" onClick=${() => goTab('replay')}><span className="label">Replay · April 2025</span><div className="tile-v small">Day by day</div>
            <div className="tile-s">The engine replays the April 2025 tariff shock one evening at a time, seeing only the odds known at each close.</div></button>`}
      <div className="tile m-tile"><span className="label">Error bars · resolved markets</span><div className="tile-v">${pct0(M_EVALS.covered)}</div>
        <div className="tile-s">of the jumps on ${M_EVALS.jumpMarkets} resolved markets landed inside the engine’s 80% ranges. One market’s reading alone was too vague to act on, which is why a jump needs two that agree.</div></div>
      <div className="tile m-tile"><span className="label">Timing · lead and lag</span><div className="tile-v">${pct0(M_EVALS.lateNoon)} <small>→</small> ${pct0(M_EVALS.lateCarried)}</div>
        <div className="tile-s">of each day’s dollar move showed up a day late, read at the Fed’s noon fixing and then carried to the 4 p.m. close like every other factor. The same tests found that yesterday’s moves forecast today’s worse than no move, so an event’s jump is its first day’s move.</div></div>
      <div className="tile m-tile"><span className="label">Error bubbles · errors together</span><div className="tile-v">${pct0(M_EVALS.insideJoint)} <small>vs</small> ${pct0(M_EVALS.insideApart)}</div>
        <div className="tile-s">of ${M_EVALS.jointDays} resolution days landed inside the 80% zone with the factors’ errors moving together as measured, against one by one. The measured links were too strong, so ranges count each factor’s error on its own for now. At half strength the zone held ${pct0(M_EVALS.insideHalf)}; how strong they really are is the next thing to test on new markets.</div></div>
    </div>
    <span className="label m-sub-l">What it doesn’t do yet</span>
    <ul className="m-limits">
      <li><b>Read options.</b> They would give every factor a second market reading, so more jumps could be confirmed.</li>
      <li><b>Give the AI prior today’s news.</b> It reasons from its training data, so it can lag the markets. It never sets odds where a market fits, but it does weigh on jumps the markets can’t pin down.</li>
      <li><b>Use stress-day exposures.</b> Markets move together more in a sell-off, so a big shock can hit harder than exposures measured on ordinary days suggest.</li>
      <li><b>Count how the factors’ errors move together.</b> The engine measures it, so a hedge’s errors could cancel in its ranges, but the first test on resolved markets found the measured links too strong. Until a larger test backs them, each factor’s error counts on its own.</li>
    </ul>
  </section>`;
}

function MethodSources() {
  return html`<section className="card" aria-labelledby="m-src-h">
    <div className="card-head"><div><span className="kicker">Where the numbers come from</span><h3 className="h3" id="m-src-h" style=${{ marginTop: 6 }}>Markets first, the AI second</h3></div></div>
    <p className="m-p m-first">Odds come from Polymarket and Kalshi, prices and factor data from Massive and FRED, and weekend prices from Hyperliquid’s perps. Claude labels markets for the screen, judges the matches, picks past analogs and writes a starting estimate, but wherever a market can measure a number, the market’s evidence wins.</p>
    <p className="m-p">The design doc in the repository (docs/DESIGN.md) has the math, every alternative weighed, and the references. Nothing here is investment advice.</p>
  </section>`;
}

function MethodView({ P, shown, tw, onOpen, goTab }) {
  const top = P.V > 0 && shown.length ? shown[0] : null;
  return html`<div className="method">
    <${MethodExample} P=${P} top=${top} onOpen=${onOpen} />
    <${MethodSteps} tw=${tw} />
    <${MethodTests} goTab=${goTab} />
    <${MethodSources} />
  </div>`;
}

/* ==========================================================================
   UI · Part 3: the event card, historical replay, tweaks, and the app shell.
   ========================================================================== */
const REL = { same: 'Same event', sum: 'Sum of outcomes', implies: 'Stricter market · lower bound', ladder: 'Ladder', bound: 'Bounded by related markets' };

function SplitBar({ dT, q }) {
  const ref = useRef(null);
  const W = Math.max(280, useWidth(ref, 520)), a = 8, b = W - 8, x1 = a + q * (b - a);
  // Under 400px the two labels under the bar would run into each other, so the second one drops a line.
  const two = W < 400;
  return html`<div className="split" ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + (two ? 76 : 62)} role="img" aria-label=${'Of the full ' + fmtPct(dT) + ' move, ' + fmtPct(q * dT) + ' is already priced in and ' + fmtPct((1 - q) * dT) + ' would still be a surprise.'}>
    <defs><pattern id="rk-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="5" style=${{ fill: 'var(--ink-3)', opacity: 0.6 }} /></pattern></defs>
    <text x=${a} y="11" className="ax">Full move if it happens · ${fmtPct(dT)}</text>
    <rect x=${a} y="20" width=${Math.max(0, x1 - a - 1)} height="16" rx="2" style=${{ fill: 'url(#rk-hatch)' }} />
    <rect x=${x1 + 1} y="20" width=${Math.max(0, b - x1 - 1)} height="16" rx="2" style=${{ fill: dT < 0 ? 'var(--loss)' : 'var(--gain)' }} />
    <text x=${a} y="54" className="ax">Priced in at ${fmtOdds(q)} · ${fmtPct(q * dT)}</text>
    <text x=${b} y=${two ? 70 : 54} textAnchor="end" className="ax">Surprise if it happens · ${fmtPct((1 - q) * dT)}</text>
  </svg></div>`;
}

// Where the full move could land, from the jump's error bars across factors: the 80% range (darker inside: the
// middle 50%), beside no move. Worded as frequencies, not standard deviations.
const Z80 = 1.2816, Z50 = 0.6745;
// How the range counts the factors' errors, as far as eval E11 has backed their correlations (JOINT_WEIGHT).
function rangeNote() {
  if (JOINT_WEIGHT >= 1) return 'The range adds each factor’s error with how the factors’ errors move together: a hedge’s errors can cancel, and a bet on factors that move together piles them up.';
  if (JOINT_WEIGHT > 0) return 'The range adds each factor’s error with half of how the factors’ errors move together, as far as tests on resolved markets back it.';
  return 'The range adds up each factor’s error on its own. The engine also measures how the factors’ errors move together, so that a hedge’s errors could cancel, but tests on resolved markets haven’t confirmed it yet.';
}
function ImpactRange({ dT, sd }) {
  const ref = useRef(null);
  const W = Math.max(280, useWidth(ref, 520)), a = 8, b = W - 8;
  const lo = Math.min(0, dT - Z80 * sd), hi = Math.max(0, dT + Z80 * sd), pad = (hi - lo) * 0.06 || 1;
  const X = v => a + (v - lo + pad) / (hi - lo + 2 * pad) * (b - a);
  const col = dT < 0 ? 'var(--loss)' : 'var(--gain)';
  const r80 = [dT - Z80 * sd, dT + Z80 * sd], r50 = [dT - Z50 * sd, dT + Z50 * sd];
  return html`<div className="split" ref=${ref}><svg viewBox=${'0 0 ' + W + ' 62'} role="img" aria-label=${'8 times in 10 the full move would land between ' + fmtPct(r80[0]) + ' and ' + fmtPct(r80[1]) + '.'}>

    <rect x=${X(r80[0])} y="22" width=${Math.max(1, X(r80[1]) - X(r80[0]))} height="14" rx="2" style=${{ fill: col, opacity: 0.22 }} />

}

function Spark({ h, now, from }) {
  const ref = useRef(null);
  const W = Math.max(280, useWidth(ref, 520)), H = 72, n = h.length; const lo = Math.min(...h, now), hi = Math.max(...h, now); const pad = Math.max(0.01, (hi - lo) * 0.15);
  const X = i => 6 + i / (n - 1) * (W - 12); const Y = v => 6 + (1 - (v - lo + pad) / (hi - lo + 2 * pad)) * (H - 28);
  const d = h.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(i === n - 1 ? now : v).toFixed(1)).join('');
  return html`<div className="spark" ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label=${'Odds from ' + (from || '120 days ago') + ', ' + fmtOdds(h[0]) + ', to today, ' + fmtOdds(now)}>
    <path d=${d} style=${{ fill: 'none', stroke: 'var(--ink-2)', strokeWidth: 1.5, strokeLinejoin: 'round' }} />
    <circle cx=${X(n - 2)} cy=${Y(h[n - 2])} r="2.5" style=${{ fill: 'var(--ink-3)' }} />
    <circle cx=${X(n - 1)} cy=${Y(now)} r="3.5" style=${{ fill: 'var(--accent)' }} />
    <text x="6" y=${H - 4} className="ax">${from || '120 days ago'} · ${fmtOdds(h[0])}</text>
    <text x=${W - 6} y=${H - 4} textAnchor="end" className="ax">Today · ${fmtOdds(now)}</text>
  </svg></div>`;
}

function ErrBar({ k, s, market }) {

function verdictText(f) {
  const vague = Math.max((f.nAll ?? f.nMarket) - f.nMarket, 0);
  if (f.agree === false && f.dof) return html`<span className="mk bad">!</span><p><b>Market readings disagree.</b> χ² ${f.chi2.toFixed(1)} is over the 5% cutoff of ${f.crit}. The engine shows the event as contested instead of averaging the gap away.</p>`;
  if (f.nMarket >= 2 && f.agree) return html`<span className="mk ok">✓</span><p><b>Market readings agree.</b> χ² ${f.chi2.toFixed(2)} is under the 5% cutoff of ${f.crit}, so the fused jump stands.</p>`;
  if (f.nMarket >= 2) return html`<span className="mk mid">≈</span><p><b>Market readings of different factors.</b> They don’t share a factor, so they can’t check each other yet and the jump is provisional.</p>`;
  if (f.nMarket === 1 && vague) return html`<span className="mk mid">≈</span><p><b>One precise market reading.</b> The ${vague === 1 ? 'other market reading’s error bar is' : 'other market readings’ error bars are'} over half the jump, too wide to confirm it, so the jump is provisional.</p>`;
  if (f.nMarket === 1) return html`<span className="mk mid">≈</span><p><b>One market reading.</b> Nothing to cross-check it against yet, so the jump is provisional.</p>`;
  if (vague) return html`<span className="mk mid">≈</span><p><b>${vague === 1 ? 'One market reading, too vague to count.' : 'Market readings too vague to count.'}</b> ${vague === 1 ? 'Its error bar is' : 'Their error bars are'} over half the jump, too wide to confirm it, so the jump is provisional.</p>`;
  return html`<span className="mk mid">≈</span><p><b>No market readings.</b> The jump comes from past events and the AI prior only.</p>`;
}

function Explain({ e, P, q, ifYes, ifNo }) {
  const [st, setSt] = useState({ s: 'idle', text: '' });
  const ctl = useRef(null);
  useEffect(() => { if (ctl.current) ctl.current.abort(); setSt({ s: 'idle', text: '' }); }, [e.id]);
  useEffect(() => () => { if (ctl.current) ctl.current.abort(); }, []);
  const go = async () => {
    const sample = await getSample(); if (!sample) { setSt({ s: 'off', text: '' }); return; }
    if (ctl.current) ctl.current.abort(); const ac = new AbortController(); ctl.current = ac;
    setSt({ s: 'think', text: '' });
    const hold = P.rows.slice().sort((a, b) => b.w - a.w).slice(0, 6).map(r => r.t + ' ' + (r.w * 100).toFixed(0) + '%').join(', ');
    const top = P.look.filter(o => o.kind === 'stock').slice(0, 5).map(o => o.name + ' ' + (o.w * 100).toFixed(1) + '%').join(', ');
    const drivers = e.contrib.slice(0, 4).map(c => c.name + ' ' + fmtPct(c.c, 2)).join('; ');
    const prompt = [
      'You explain one result from a portfolio scenario engine to the person who owns the portfolio.',
      'Write 3 or 4 short sentences of plain English: no lists, no headings, no preamble.',
      'Say why this event moves this portfolio the way the numbers say, which holdings or exposures drive it, and one thing worth watching. Use only the numbers given. Do not give advice to buy or sell.',
      '',
      'Portfolio (' + fmtUsdFull(P.V) + '): ' + hold + '. Largest look-through companies: ' + (top || 'none') + '.',
      'Event: ' + e.t + ', resolves ' + fmtDate(e.date) + '. Odds ' + fmtOdds(q) + '.',
      'Full move if it happens: ' + fmtPct(e.dT, 2) + ' of the portfolio (direct ' + fmtPct(e.dD, 2) + ', knock-on effects through other events ' + fmtPct(e.dT - e.dD, 2) + ').',
      'Net of what the odds already price in: ' + fmtPct(ifYes, 2) + ' if it happens, ' + fmtPct(ifNo, 2) + ' if it does not.',
      'Biggest drivers (exposure times the factor move): ' + drivers + '.',
      'Background: ' + e.why,
    ].join('\n');
    try {
      const r = await sample(prompt, { modelTier: 'quick', signal: ac.signal, onText: ({ text }) => setSt({ s: 'stream', text }) });
      if (!ac.signal.aborted) setSt({ s: 'done', text: r.text });
    } catch (err) {
      const code = err && err.code;
      if (code === 'cancelled' || ac.signal.aborted) return;
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'capability_disabled' || code === 'not_declared') setSt({ s: 'off', text: '' });
      else if (code === 'rate_limited' || code === 'queue_overflow') setSt({ s: 'err', text: 'Claude is busy right now. Try again in a minute.' });
      else setSt({ s: 'err', text: (err && err.text) || 'Claude could not answer this time.' });
    }
  };
  if (st.s === 'off') return null;
  const busy = st.s === 'think' || st.s === 'stream';
  return html`<div style=${{ marginTop: 14 }}>
    ${busy ? html`<button className="btn-ghost" onClick=${() => { if (ctl.current) ctl.current.abort(); setSt({ s: 'idle', text: '' }); }}>Stop</button>`
      : html`<button className="btn-ghost" onClick=${go}>${st.s === 'idle' ? 'Explain for my portfolio' : 'Explain again'}</button>`}
    ${st.s === 'think' && html`<p className="ai-out sub">Thinking…</p>`}
    ${st.text && html`<p className=${cls('ai-out', st.s === 'err' && 'sub')} aria-live="polite">${st.text}</p>`}
  </div>`;
}

/* A backend snapshot checks the related prices against the rules of probability (DESIGN.md 6.6). */
function cohText(c) {
  if (!c.flags.length) return html`<span className="mk ok">✓</span><p><b>Related prices add up.</b> ${c.n === 1 ? 'One check' : c.n + ' checks'} against the rules of probability, all within the markets’ spreads.</p>`;
  return html`<span className="mk bad">!</span><p><b>Related prices don’t add up.</b> ${c.flags.join(' ')} ${c.contested
    ? 'The odds rest on these prices, so the event counts as contested.'
    : 'The odds don’t rest on these prices, so they stand, but one of the related markets is probably mispriced.'}</p>`;
}

/* If a parent at odds q happens, a child's odds move by w · (1 − q): w is P(child | parent) − P(child | not parent). */

function capNote(e, other) { const n = e.coh && e.coh.caps && e.coh.caps[other]; return n ? html`<span className="sub" style=${{ display: 'block' }}>${n}</span>` : ''; }

/* ---------- historical replay ---------- */
function verdictOf(pred, real) {
  if (pred == null) return ['mid', '–', 'No call'];
  if (Math.abs(real) < 0.3 && Math.abs(pred) < 0.3) return ['ok', '✓', 'Both small'];
  if (Math.sign(pred) !== Math.sign(real)) return ['bad', '✕', 'Wrong direction'];
  const r = Math.abs(pred) / Math.abs(real);
  if (r >= 0.7 && r <= 1.4) return ['ok', '✓', 'Close'];
  return ['mid', '≈', r < 1 ? 'Right way, too small' : 'Right way, too big'];
}

function ReplayChart({ RC, day, setDay }) {
  const ref = useRef(null);
  const R = REPLAY, D = R.days.length, W = Math.max(300, useWidth(ref, 640)), H = 250, m = { l: 40, r: 12, t: 14, b: 30 };
  const called = RC.calls.filter(c => c.pred != null);
  const vals = RC.real.concat(RC.cum, RC.expl.filter(v => v != null), called.map(c => c.pred));
  const ym = Math.max(2, ...vals.map(Math.abs)) * 1.12;
  const cw = (W - m.l - m.r) / D; const every = cw < 46 ? 2 : 1; const X = i => m.l + (i + 0.5) * cw; const Y = v => m.t + (ym - v) / (2 * ym) * (H - m.t - m.b);
  const ticks = niceTicks(-ym, ym, 6);
  const cumPath = RC.cum.slice(0, day + 1).map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join('');
  return html`<div className="rp-chart" ref=${ref}><svg viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label="Daily moves of your portfolio, what the engine’s events explained each day, and its calls on the days events resolved">
    ${ticks.map(v => html`<g key=${'y' + v}><line x1=${m.l} x2=${W - m.r} y1=${Y(v)} y2=${Y(v)} style=${{ stroke: Math.abs(v) < 1e-9 ? 'var(--line-2)' : 'var(--line)' }} /><text x=${m.l - 6} y=${Y(v) + 3} textAnchor="end" className="ax">${fmtPct(v, 0)}</text></g>`)}
    ${RC.real.map((v, i) => html`<rect key=${'b' + i} x=${X(i) - cw * 0.28} y=${Math.min(Y(v), Y(0))} width=${cw * 0.56} height=${Math.max(1, Math.abs(Y(v) - Y(0)))} rx="1.5" style=${{ fill: v < 0 ? 'var(--loss)' : 'var(--gain)', opacity: i <= day ? (i === day ? 1 : 0.7) : 0.14, cursor: 'pointer' }} onClick=${() => setDay(i)} />`)}
    ${called.map(c => html`<rect key=${'p' + c.id} x=${X(c.day) - cw * 0.42} y=${Math.min(Y(c.pred), Y(0))} width=${cw * 0.84} height=${Math.max(1, Math.abs(Y(c.pred) - Y(0)))} rx="2" style=${{ fill: 'none', stroke: 'var(--ink)', strokeWidth: 1.4, strokeDasharray: '4 3', opacity: c.day <= day ? 1 : 0.25 }} />`)}
    ${RC.expl.map((v, i) => (v == null ? null : html`<line key=${'x' + i} x1=${X(i) - cw * 0.36} x2=${X(i) + cw * 0.36} y1=${Y(v)} y2=${Y(v)} style=${{ stroke: 'var(--ink)', strokeWidth: 2.5, strokeLinecap: 'round', opacity: i <= day ? 1 : 0.25, pointerEvents: 'none' }} />`))}
    <path d=${cumPath} style=${{ fill: 'none', stroke: 'var(--accent)', strokeWidth: 2, strokeLinejoin: 'round' }} />
    ${RC.cum.slice(0, day + 1).map((v, i) => html`<circle key=${'c' + i} cx=${X(i)} cy=${Y(v)} r=${i === day ? 4 : 2.5} style=${{ fill: 'var(--accent)' }} />`)}
    ${R.days.map((d, i) => (i === day || (i % every === 0 && Math.abs(i - day) >= every) ? html`<text key=${'d' + i} x=${X(i)} y=${H - 10} textAnchor="middle" className="ax" style=${{ fontWeight: i === day ? 700 : 500 }}>${fmtDate(d.d, false)}</text>` : null))}
  </svg></div>`;
}

// What the replay screen says about an event the engine couldn't price or measure on a given day.
function replayGap(s, ev, d) {
  if (s.status === 'open') return 'No reading of its jump yet';
  if (ev.match === 'bound') return 'Only bounded by related markets, so no odds';
  if (!ev.listed) return REPLAY_SOURCE === 'engine' ? 'No market matched it' : 'No market yet';
  return ev.listed > d ? 'No market until ' + fmtDate(ev.listed, false) : 'No price at that close';
}

// A replay jump's error bar, one standard deviation, when the engine's replay carries one.
const plusMinus = e => (e == null ? '' : ' ± ' + fmtPct(e, 1, false));
// A jump less than two standard deviations from no move: the engine's convention for a reading it can't act on alone.
const withinNoise = s => s.ifYesErr != null && Math.abs(s.ifYes) < 2 * s.ifYesErr;

const fmtCorr = v => (v == null ? '–' : (v < 0 ? MINUS : '') + Math.abs(v).toFixed(2));
const fmtShare = v => (v == null ? '–' : (v < -0.005 ? MINUS : '') + Math.abs(Math.round(v * 100)) + '%');

// "FRED (SP500, DGS10) and Massive (FXI)" from each factor's source, such as "Massive SMH vs Massive SPY".
function replaySources(sources) {
  const by = {};
  Object.values(sources || {}).forEach(v => v.split(' vs ').forEach(x => { const [p, ...k] = x.split(' '); (by[p] = by[p] || []).includes(k.join(' ')) || by[p].push(k.join(' ')); }));
  return Object.entries(by).map(([p, ks]) => p + ' (' + ks.join(', ') + ')').join(' and ') || 'FRED';
}

// The engine's own metrics on every factor, fixed before the first run (DESIGN.md section 10).
function ReplayScore() {
  const R = REPLAY, m = R.metrics;
  if (!m) return null;
  const ca = m.calls, ex = m.explained, byId = Object.fromEntries(R.events.map(e => [e.id, e]));
  const fname = k => (FACTORS.find(f => f.k === k) || { name: k }).name;
  const ratio = (ca.stocks || []).filter(x => x.ratio != null);
  const per = Object.entries(ex.by_factor || {});
  const share = fmtShare;
  const tm = v => (v > 0 ? '+' : v < 0 ? MINUS : '') + Math.abs(v).toFixed(1);
  const neg = per.some(([, v]) => v.explained_share != null && v.explained_share < 0);
  return html`<section className="card"><div className="card-head"><div><span className="kicker">Every factor, not just this portfolio</span><h3 className="h3" style=${{ marginTop: 6 }}>The engine’s scorecard</h3>
      <p className="sub">These measures were fixed before the first run. They count each factor’s moves in typical moves, so they don’t depend on the portfolio on the left.</p></div></div>
    <div className="tiles">
      <div className="tile"><span className="label">Calls, factor by factor</span><div className="tile-v">${ca.factor_signs_right} of ${ca.factor_signs}</div><div className="tile-s">factor moves on the days events resolved went the way the engine called the evening before</div></div>
      <div className="tile"><span className="label">Daily moves explained</span><div className="tile-v">${share(ex.explained_share)}</div><div className="tile-s">of the squared daily moves over ${ex.cells} factor-days came from each event’s jump times that day’s odds change${ex.corr == null ? '' : ' · correlation ' + fmtCorr(ex.corr)}${ex.explained_share != null && ex.explained_share < 0 ? ' · below zero is worse than calling no move' : ''}</div></div>
      <div className="tile"><span className="label">Big days</span><div className="tile-v">${ex.big_days_right} of ${ex.big_days}</div><div className="tile-s">factor-days that moved a typical move or more, where the explained move had the right sign</div></div>
      <div className="tile"><span className="label">Stocks vs the call</span><div className="tile-v small">${ratio.length ? ratio.map(x => x.ratio.toFixed(1) + '×').join(' · ') : '–'}</div><div className="tile-s">${ratio.length ? 'how far stocks moved on each call day, as a multiple of the call (1× is exact): ' + ratio.map(x => (byId[x.event] || { s: x.event }).s).join(', ') : 'No call had a reading on stocks'}</div></div>
    </div>
    ${per.length > 0 && html`<div className="scroll-x" style=${{ marginTop: 16 }}><table className="calls"><thead><tr><th>Factor</th><th>Days</th><th>Explained</th><th>Correlation</th></tr></thead><tbody>
      ${per.map(([k, v]) => html`<tr key=${k}><td>${fname(k)}</td><td className="n">${v.days}</td><td className="n">${share(v.explained_share)}</td><td className="n">${fmtCorr(v.corr)}</td></tr>`)}
    </tbody></table></div>`}
    ${neg && html`<p className="sub" style=${{ margin: '8px 0 0' }}>Explained below zero means the events’ moves fit that factor worse than calling no move at all.</p>`}
    ${(m.ranking || []).length > 0 && html`<${Frag}><span className="label" style=${{ display: 'block', marginTop: 18 }}>The first evening’s ranking, by swing on stocks</span>
      <ol className="rp-rank">${m.ranking.map(x => html`<li key=${x.event}><b>${(byId[x.event] || { s: x.event }).s}</b> at ${fmtOdds(x.q)}, ±${x.swing.toFixed(2)} typical moves. ${x.resolved_on ? 'Happened ' + fmtDate(x.resolved_on, false) + (x.stock_move_that_day == null ? '.' : ', and stocks moved ' + tm(x.stock_move_that_day) + ' typical moves that day.') : 'Didn’t happen during the episode.'}</li>`)}</ol><//>`}
  </section>`;
}

// E8's own metric: a sample portfolio rebuilt as it stood at the close before the episode, with exposures fitted only
// on the two years before and ETF holdings as known then, scored on its realized daily moves (DESIGN.md section 10).
function ReplayThen({ sampleId }) {
  const R = REPLAY, all = R.portfolios || {}, p = sampleId ? all[sampleId] : null;
  if (!Object.keys(all).length) return null;
  const base = fmtDate(R.base), m = p && p.metrics, byId = Object.fromEntries(R.events.map(e => [e.id, e]));
  const share = v => (v != null && v > 0.99 && v < 1 ? '>99%' : fmtShare(v));
  const call = p ? (p.calls || []).find(c => c.pred != null && c.real != null) : null;
  const held = m && m.factors.explained_share != null && m.factors.explained_share >= 0.9;
  return html`<section className="card" aria-labelledby="rp-then-h"><div className="card-head"><div><span className="kicker">The sample portfolios, as they stood then</span><h3 className="h3" id="rp-then-h" style=${{ marginTop: 6 }}>${p ? 'This portfolio, rebuilt as of ' + base : 'Scored as they stood on ' + base}</h3>
      <p className="sub">The chart above uses today’s exposures. Here a sample portfolio is rebuilt as it stood at the close of ${base}: holdings valued at that close, exposures fitted only on the two years of prices before it, and ETF holdings as they were known then. Nothing from the episode reaches it.</p></div></div>
    ${p ? html`<div className="tiles">
        <div className="tile"><span className="label">Factors explain</span><div className="tile-v">${share(m.factors.explained_share)}</div><div className="tile-s">of its daily moves: its exposures times each day’s actual factor moves${held ? ', so the exposures held through the crash and the rebound' : ''}</div></div>
        <div className="tile"><span className="label">Events explain</span><div className="tile-v">${share(m.events.explained_share)}</div><div className="tile-s">of its daily moves, from each event’s jump times that day’s odds change${m.events.corr == null ? '' : ' · correlation ' + fmtCorr(m.events.corr)}</div></div>
        <div className="tile"><span className="label">Right sign</span><div className="tile-v">${m.events.right_sign} of ${m.events.days_moved}</div><div className="tile-s">days the events’ move pointed the way the portfolio went</div></div>
        ${call && html`<div className="tile"><span className="label">${(byId[call.event] || { s: call.event }).s}</span><div className="tile-v small">${fmtPct(call.pred)} <small>vs</small> ${fmtPct(call.real)}</div><div className="tile-s">expected the evening before, at ${fmtOdds(call.q)} odds, against the day: ${fmtUsd(call.pred * p.value / 100, true)} against ${fmtUsd(call.real * p.value / 100, true)} on ${fmtUsd(p.value)}</div></div>`}
      </div>`
      : html`<p className="note">Pick one of the sample portfolios to see its score. A portfolio you build or edit has no holdings from then to rebuild.</p>`}
  </section>`;
}

function ReplayView({ P, tw, sampleId }) {
  const R = REPLAY, D = R.days.length, V = P.V, engine = REPLAY_SOURCE === 'engine';
  const RC = useMemo(() => replayCompute(P, tw.knock), [P, tw.knock]);
  const [day, setDay] = useState(0); const [play, setPlay] = useState(false);
  useEffect(() => {
    if (!play) return undefined;
    const id = setInterval(() => setDay(d => { if (d >= D - 1) { setPlay(false); return d; } return d + 1; }), 1100);
    return () => clearInterval(id);
  }, [play]);
  const pick = i => { setPlay(false); setDay(i); };
  const byId = Object.fromEntries(R.events.map(e => [e.id, e]));
  const resDays = new Set(RC.calls.map(c => c.day));
  const order = { open: 0, happened: 1, unlisted: 2 };
  const rows = RC.states[day].slice().sort((a, b) => order[a.status] - order[b.status] || (b.swing || 0) - (a.swing || 0));
  const real = RC.real[day], cum = RC.cum[day], expl = RC.expl[day];
  const called = RC.calls.filter(c => c.pred != null);
  const right = called.filter(c => verdictOf(c.pred, c.real)[0] !== 'bad').length;
  const worst = called.slice().sort((a, b) => Math.abs(b.real - b.pred) - Math.abs(a.real - a.pred))[0];
  const togglePlay = () => { if (!play && day >= D - 1) setDay(0); setPlay(!play); };
  let summary = '';
  if (worst) {
    summary = 'For this portfolio the engine got the direction right ' + right + ' of ' + called.length + ' times. Its biggest miss was “' + worst.s + '”: it expected ' + fmtPct(worst.pred) + ' and the day brought ' + fmtPct(worst.real) + '. ';
    summary += Math.abs(worst.real) > Math.abs(worst.pred)
      ? 'On stress days everything moves together more than usual, so exposures measured on normal days understate the hit. The design’s fix is a second set of exposures fitted on stress periods.'
      : 'Part of that move had already happened in the days before, as the odds rose.';
  }
  const fit = RC.fit.share == null ? '' : 'Over the ' + D + ' days, the events’ jumps times their odds changes account for ' + fmtShare(RC.fit.share) + ' of this portfolio’s daily moves' + (RC.fit.corr == null ? '.' : ' (correlation ' + fmtCorr(RC.fit.corr) + ').') + (RC.fit.share < 0 ? ' Below zero means worse than calling no move at all.' : '');
  return html`<${Frag}>
    <section className="card" aria-labelledby="rp-h">
      <div className="card-head">
        <div><span className="kicker">Historical replay · ${engine ? 'the engine on archived prices' : 'a resolved episode'}</span><h2 className="h2" id="rp-h" style=${{ marginTop: 6 }}>${R.title}</h2><p className="sub">${R.sub} Each day, the engine only sees the odds as of the previous close${engine ? ', and jumps measured on data up to that close' : ''}. Change the portfolio on the left and the replay updates.</p></div>
        <div className="rp-ctl"><button className="btn" onClick=${togglePlay}>${play ? 'Pause' : day >= D - 1 ? 'Replay' : 'Play'}</button></div>
      </div>
      <div className="rp-time"><div className="rp-days" role="group" aria-label="Trading days">${R.days.map((d, i) => html`<button key=${d.d} className=${cls('rp-day', i < day && 'past', i === day && 'on', resDays.has(i) && 'res')} aria-pressed=${i === day} onClick=${() => pick(i)}>${fmtDate(d.d, false)}</button>`)}</div></div>
      <p className="rp-note"><span className="label">${fmtDate(R.days[day].d)}</span><b className=${tone(real)}>${fmtUsd(real * V / 100, true)} (${fmtPct(real)})</b>${R.days[day].note && html`<span>${R.days[day].note}</span>`}<span className="sub" style=${{ margin: 0 }}>${expl == null ? 'No event priced on both closes' : 'The events explain ' + fmtPct(expl)} · running total ${fmtPct(cum)}</span></p>
    </section>
    <div className="duo">
      <section className="card"><div className="card-head"><div><span className="kicker">Your portfolio, day by day</span><h3 className="h3" style=${{ marginTop: 6 }}>Moves against the engine’s calls</h3></div></div>
        <${ReplayChart} RC=${RC} day=${day} setDay=${pick} />
        <div className="legend"><span><i className="sw" style=${{ background: 'var(--loss)', borderRadius: 2 }}></i>Your portfolio that day</span><span><i className="tick"></i>What the events explain: each jump times that day’s odds change</span><span><i className="sw" style=${{ background: 'none', border: '1.5px dashed var(--ink)', borderRadius: 2 }}></i>The engine’s call the evening before</span><span><i className="ln"></i>Running total</span></div>
        ${fit && html`<p className="sub" style=${{ margin: '10px 0 0' }}>${fit}</p>`}
      </section>
      <section className="card"><div className="card-head"><div><span className="kicker">At the close of ${fmtDate(R.days[day].d, false)}</span><h3 className="h3" style=${{ marginTop: 6 }}>What the engine saw</h3></div></div>
        <ul className="rp-list">${rows.map(s => { const live = s.status === 'open' && s.dT != null; return html`<li key=${s.id} className=${live ? '' : 'done'}>
          <span>${s.t}<small>${live ? 'If it happens ' + fmtPct(s.ifYes) + plusMinus(s.ifYesErr) + ' · if not ' + fmtPct(s.ifNo) + plusMinus(s.ifNoErr) + (withinNoise(s) ? ' · within noise' : '') : s.status === 'happened' ? 'Happened ' + fmtDate(s.on, false) : replayGap(s, byId[s.id], R.days[day].d)}</small></span>
          <span className="mono" style=${{ textAlign: 'right' }}>${s.status === 'open' ? fmtOdds(s.q) : ''}</span>
          <span className="cell">${live ? swingUsd(s.swing * V / 100) : ''}${live && html`<small>${swingPct(s.swing)}</small>`}</span></li>`; })}</ul>
        ${rows.some(s => s.ifYesErr != null) && html`<p className="sub" style=${{ margin: '10px 0 0' }}>± is one standard deviation, from the error bars of the readings behind each jump, taken factor by factor${JOINT_WEIGHT > 0 ? ': the replay keeps each factor’s error bar only' : ''}. “Within noise” marks a jump less than two of them from no move: the data can’t yet tell it from no effect.</p>`}
      </section>
    </div>
    <section className="card"><div className="card-head"><div><span className="kicker">Calls against outcomes</span><h3 className="h3" style=${{ marginTop: 6 }}>Did the engine get it right?</h3></div></div>
      <div className="scroll-x"><table className="calls"><thead><tr><th>Event</th><th>Resolved</th><th>Odds before</th><th>Engine said</th><th>The day</th><th>Verdict</th></tr></thead><tbody>
        ${RC.calls.map(c => { const [k, mk, txt] = verdictOf(c.pred, c.real), ev = byId[c.id]; return html`<tr key=${c.id}><td>${c.t}${engine && ev.from && html`<br /><small>${ev.url ? html`<a href=${ev.url} target="_blank" rel="noopener noreferrer">${ev.from}</a>` : ev.from}${ev.gran && ev.gran.length ? ' · ' + ev.gran.join(' and ') + ' prices' : ''}</small>`}</td><td className="n">${fmtDate(c.date, false)}</td><td className="n">${c.q == null ? '–' : fmtOdds(c.q)}</td>
          ${c.pred == null ? html`<td><small>${c.why}</small></td>` : html`<td className=${cls('n', tone(c.pred))}>${fmtPct(c.pred)}${plusMinus(c.predErr)}<br /><small>${fmtUsd(c.pred * V / 100, true)}</small></td>`}
          <td className=${cls('n', tone(c.real))}>${fmtPct(c.real)}<br /><small>${fmtUsd(c.real * V / 100, true)}</small></td><td style=${{ whiteSpace: 'nowrap' }}><span className=${'mk ' + k}>${mk}</span> ${txt}</td></tr>`; })}
      </tbody></table></div>
      ${summary && html`<p className="note">${summary}</p>`}
    </section>
    ${engine && html`<${ReplayThen} sampleId=${sampleId} />`}
    ${engine && html`<${ReplayScore} />`}
    <section className="card" aria-labelledby="rp-how-h"><div className="card-head"><div><span className="kicker">Method</span><h3 className="h3" id="rp-how-h" style=${{ marginTop: 6 }}>How this replay was made</h3></div></div>
      ${engine ? html`<${Frag}>
          <p className="rp-how">Factor moves are daily closes from ${replaySources(R.sources)}. The odds are archived Polymarket and Kalshi prices at each 4 p.m. New York close, from markets the same judge as a refresh matched to each event, as of the evening before the first day. Each evening’s jumps come only from data up to that close: market windows over the previous ${R.lookback || 180} days, fused with each event’s historical analogs. ${R.portfolios && Object.keys(R.portfolios).length ? 'The chart uses this portfolio’s exposures today, not April 2025’s; the card above scores the sample portfolios as they stood then.' : 'This portfolio’s exposures are today’s, not April 2025’s.'} Run ${fmtStamp(R.asOf)}.</p>
          ${(R.leftOut || []).length > 0 && html`<span className="label rp-how-l">Left out</span><ul className="rp-how-list">${R.leftOut.map(x => html`<li key=${x}>${x}</li>`)}</ul>`}
          ${(R.warnings || []).length > 0 && html`<span className="label rp-how-l">Gaps in the data</span><ul className="rp-how-list">${R.warnings.map(w => html`<li key=${w}>${w}</li>`)}</ul>`}
        <//>`
        : html`<p className="rp-how">Factor moves are approximate daily closes from April 2025. The odds paths are illustrative reconstructions, not archived prices. In the real system this test runs on every resolved event, and its results set how much each evidence source is trusted.</p>`}
    </section>
  <//>`;
}

const DEFAULT_TWEAKS = { odds: 'market', knock: true, horizon: 6, tiers: 'ABCD', topN: 12, sims: 4000, noise: false, theme: 'auto', accent: 'dragon', heading: 'serif', density: 'comfortable', hero: true, dragon: true, glow: 'normal', citadel: true, view: 'macro', rotate: true, labels: 'top', links: true, spread: 'hover' };
const TWEAK_OPTS = {
  odds: ['market', 'calibrated'], knock: [true, false], horizon: [3, 6, 12], tiers: ['ABCD', 'ABC', 'AB'], topN: [8, 12, 'all'], sims: [2000, 4000, 10000], noise: [false, true],
  theme: ['auto', 'light', 'dark'], accent: ['dragon', 'ember', 'teal', 'steel'], heading: ['serif', 'sans'], density: ['comfortable', 'compact'], hero: [true, false], dragon: [true, false], glow: ['normal', 'bright'], citadel: [true, false],
  view: ['macro', 'mine', 'flat'], rotate: [true, false], labels: ['top', 'all', 'none'], links: [true, false], spread: ['hover', 'all', 'none'],
};
function cleanTweaks(t) {
  const o = {}; if (!t || typeof t !== 'object') return o;
  // One earlier version saved the hero as 'dragon', 'image' or 'off'; the image is the hero again.
  if (typeof t.hero === 'string') t = { ...t, hero: t.hero !== 'off' };
  for (const k in TWEAK_OPTS) if (TWEAK_OPTS[k].includes(t[k])) o[k] = t[k];
  return o;
}

function TweaksSheet({ tw, setTw, onClose }) {

  useEffect(() => { if (closeRef.current) closeRef.current.focus({ preventScroll: true }); }, []);
  useEffect(() => { const k = ev => { if (ev.key === 'Escape') onClose(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [onClose]);
  const set = (k, v) => setTw({ ...tw, [k]: v });
  const Row = (label, help, k, opts) => html`<div className="tw-row"><span>${label}${help && html`<small>${help}</small>`}</span>
    <div className="seg" role="group" aria-label=${label}>${opts.map(([v, l]) => html`<button key=${String(v)} className=${tw[k] === v ? 'on' : ''} aria-pressed=${tw[k] === v} onClick=${() => set(k, v)}>${l}</button>`)}</div></div>`;
  const json = JSON.stringify(tw, null, 2);
  const copy = () => {
    try { navigator.clipboard.writeText(json).then(() => setCopied('ok'), () => setCopied('manual')); } catch (e) { setCopied('manual'); }
